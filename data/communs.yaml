# Les sorts communs à toutes les classes qui invoquent : l'Arakne et le
# Chaferfu, et leurs variantes (coût, relance, délai initial, portée).
#
# Ils n'ont ni ligne ni effet ici : l'application leur greffe l'invocation,
# comme aux sorts d'invocation des classes, d'après le relevé
# `data/snapshots/invocations.json`. Chacun invoque un monstre à 80 % et
# l'autre de sa paire à 20 % (effets 181 à `random` 80 et 20).
#
# Les Cawottes n'y sont pas : elles n'attaquent pas.

