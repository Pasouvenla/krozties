# Steamer.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: steamer
name: { fr: "Steamer", en: "Steamer" }

resources:
  - id: tourelles_au_contact
    scope: caster
    max: 1
    default: 0
    declared_by_player: true
    player_label: "Vos tourelles sont au contact de la cible"
    note: |
      Cochez si vous posez vos tourelles au contact de la cible : elles sont
      alors dans la zone de vos sorts. Vapor et Turbine les font évoluer, le
      Sabotage frappe plus fort pour chacune qui a évolué puis la rétrograde,
      Ancrage et Gouvernail vous rendent 1 PA.

  - id: poussee_subie
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "La cible subit des dommages de poussée à chaque tour"
    note: |
      À cocher si vous poussez la cible contre un obstacle à chaque tour : elle
      subit des dommages de poussée sans bouger, ce que la Flibuste exploite.

  - id: flibuste
    # Sans `dofusdb_source` : ses chiffres sont la SECONDE ligne de son sort,
    # que l'appariement par position confondrait avec la premiere. Le
    # controle des magnitudes le rattache au sort de meme identifiant.
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      # La poussee d'un autre, entre deux tours : seulement si le joueur la
      # declare.
      - trigger: turn_start
        requires: { kind: caster_has, resource: poussee_subie }
        # Sous-sort 31025, grade 2 : 1 % de critique de base, et non les 15 %
        # du sort.
        crit_base_percent: 1
        lines:
          - element: air
            area: { shape: G, size: 1, max_targets: 9 }
            critical: [28, 30]
            normal: [23, 25]
      # La poussée des sorts du Steamer lui-même, quand le joueur coche « Vos
      # poussées butent contre un obstacle ».
      - trigger: push_damage
        crit_base_percent: 1
        lines:
          - element: air
            area: { shape: G, size: 1, max_targets: 9 }
            critical: [28, 30]
            normal: [23, 25]
    note: |
      L'etat Flibuste : 23-25 Air aux ennemis en zone quand la cible subit des
      dommages de poussee, puis il se retire. Deux Flibustes dans le meme tour
      rafraichissent le meme etat, qu'une seule poussee consomme.

      Deux poussees le consomment. Celle d'un sort du Steamer, dans le tour,
      si ses poussees butent contre un obstacle. Et celle que le joueur declare
      subie par la cible a chaque tour, comptee une fois au debut du tour
      suivant si l'etat est encore la.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "Aucun sort du Steamer ne la pose."

spells:
  - id: scaphandre
    dofusdb_id: 13819
    name: { fr: "Scaphandre", en: "Scaphander" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    cooldown_turns: 3
    crit: { base_rate: unknown }
    note: |
      Applique un bouclier sur le lanceur et les Tourelles et le rend Intaclable.
      Le bouclier est plus important sur le lanceur.
    assumptions:
      - "Effets 950/951 : ce sort applique « Intaclable » (96). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
    lines: []
    open_questions:
      - "Effet 335 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
    effects: []

  - id: maree
    dofusdb_id: 13820
    name: { fr: "Marée", en: "Tide" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Échange de position avec la cible et occasionne des dommages Eau aux ennemis.
      
      Sur le lanceur : modifie l'état de Marée et rembourse le coût en PA et l'utilisation du sort.
      Cet effet peut être déclenché 2 fois maximum par tour.
    assumptions:
      - "Effets 792/1160 : lance aussi « Marée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Deux modes de lancer. Sur un ennemi, le sort échange les positions et frappe en Eau, ce qui est compté ici. Sur le lanceur, il retourne la Marée, se rembourse ses PA et son utilisation, et peut repartir deux fois par tour au plus : ce mode ne frappe pas, et la Marée ne commande que des poussées, des attirances, des portées et des lignes de vue. Il n'est donc pas écrit, et le total reste juste."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
