# Sadida.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: sadida
name: { fr: "Sadida", en: "Sadida" }

# Les trois poisons du Sadida : chacun est un état posé sur la cible qui
# frappe tout seul, et non une frappe au lancer. Leurs sorts n'ont aucune
# ligne immédiate, chaque fourchette étant rangée sous un unique groupe
# « Début de tour » ou « Fin de tour » avec sa durée : un poison de durée N
# tombe N fois. Aucun des trois ne peut critiquer (`can_crit: false`).
resources:
  - id: vent_empoisonne
    dofusdb_source: 13529
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          - element: air
            # Ce sort ne peut pas critiquer (`can_crit: false`), et
            # sa seule ligne publiée est non critique : le moteur
            # exige une valeur ici, c'est la même.
            critical: [13, 15]
            normal: [13, 15]

  - id: seve_paralysante
    dofusdb_source: 13533
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          - element: fire
            # Ce sort ne peut pas critiquer (`can_crit: false`), et
            # sa seule ligne publiée est non critique : le moteur
            # exige une valeur ici, c'est la même.
            critical: [15, 18]
            normal: [15, 18]
        note: |
          Duree 3, la plus longue des trois. L'infobulle dit « fin de tour de la
          cible », ce qui pour une recherche par tours tombe au meme endroit que
          le debut du notre : c'est le raisonnement deja tenu sur la Sentence du
          Iop et la Fleche Tyrannique du Cra.

  - id: miasmes
    dofusdb_source: 13562
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          - element: air
            # Ce sort ne peut pas critiquer (`can_crit: false`), et
            # sa seule ligne publiée est non critique : le moteur
            # exige une valeur ici, c'est la même.
            critical: [12, 14]
            normal: [12, 14]

  - id: arbres_feuillus
    scope: caster
    max: 6
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Arbres feuillus plantés"
    note: |
      Combien d'Arbres feuillus vous avez plantés : la Force de la Nature monte
      de 10 dégâts de base par arbre, six au plus (40-45 nu, puis 50-55 à un
      arbre, jusqu'à 100-105 à six). Le calcul ne suit ni leur pose ni leur durée
      de vie : il prend le nombre que vous déclarez.

  - id: ennemis_infectes
    scope: caster
    max: 5
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Ennemis Infectés"
    note: |
      Combien d'ennemis portent l'Infection : l'Inoculation monte de 5 dégâts de
      base par ennemi Infecté, cinq au plus (39-43 nu, puis 44-48 à un ennemi,
      jusqu'à 64-68 à cinq). L'Infection n'est pas suivie : elle se pose par
      d'autres sorts, sur des cibles que le calcul ne distingue pas.

  - id: poupee_morte
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Une de vos Poupées meurt pendant la Malédiction"
    note: |
      La Malédiction Vaudou frappe encore la cible à la mort d'une Poupée du
      lanceur : cochez si une de vos Poupées meurt pendant la Malédiction.

  - id: malediction_vaudou
    # Sans `dofusdb_source` : ses chiffres sont la SECONDE ligne Eau de son
    # sort, que l'appariement par position confondrait avec la premiere. Le
    # controle des magnitudes le rattache au sort de meme identifiant.
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          # Sous-sort 29638, grade 5 : 14-16, sans critique, comme le sort.
          - element: water
            critical: [14, 16]
            normal: [14, 16]
    note: |
      L'etat Vaudou : 14-16 Eau a la cible a la mort d'une Poupee du lanceur.
      Pose seulement si le joueur declare qu'une Poupee meurt pendant la
      Malediction, et compte une fois, au debut du tour qui suit le lancer.

spells:
  - id: tremblement
    dofusdb_id: 13514
    name: { fr: "Tremblement", en: "Earthquake" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    casts_per_target: 1
    crit: { base_rate: unknown }
    note: |
      En zone autour du lanceur, d'un Arbre Feuillu ou d'une Poupée :
      • Occasionne des dommages Terre aux ennemis.
      • Attire les entités vers le centre de la zone.
      • Dévoile les invisibles.
    assumptions:
      - "Effet 1160 : le sous-sort porte la MEME fourchette que la ligne propre et cible les Arbres ou les Poupees du lanceur. C'est la zone etendue que le texte du sort decrit, pas une frappe de plus sur la meme cible : « applique les effets dans un cercle de taille 2 »."
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: la_folle_transmutee
    dofusdb_id: 13515
    name: { fr: "La Folle Transmutée", en: "Transmuted Madoll" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    cooldown_turns: 3
    crit: { base_rate: 0, can_crit: false }
    note: |
      Invoque une Poupée maîtrisable qui peut Infecter et appliquer un poison Air de début de tour.
      
      La Poupée est remplacée par un Arbre 3 tours après son invocation.
    lines: []
    effects: []

  - id: ronce
    dofusdb_id: 13516
    name: { fr: "Ronce", en: "Bramble" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Infecte la cible et occasionne des dommages Terre.
      
      Sur un Arbre Feuillu : applique les effets sur les ennemis dans un cercle de taille 2.
      
      Sur un ennemi : applique également les effets sur tous les ennemis Infectés.
    assumptions:
      - "Effets 950 et 951, etat « Infecte » (263) : il ne change AUCUN degat. Ce qu'il fait est propager, « sur un ennemi Infecte, applique les effets sur TOUS les ennemis Infectes », formule qui revient mot pour mot sur neuf sorts de la classe. C'est une mecanique multi-cibles, et sur une cible unique elle n'a personne a qui propager."
      - "Effet 1160 : le sous-sort porte la MEME fourchette que la ligne propre et cible les Arbres ou les Poupees du lanceur. C'est la zone etendue que le texte du sort decrit, pas une frappe de plus sur la meme cible : « applique les effets dans un cercle de taille 2 »."
      - "Effets 1160/2960 : lance aussi « Infection », « Ronce », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: chardons_ardents
    dofusdb_id: 13517
    name: { fr: "Chardons Ardents", en: "Ardent Thistles" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    cooldown_turns: 3
    crit: { base_rate: 0, can_crit: false }
    note: |
      Applique l'état Chardons Ardents sur l'ennemi ciblé :
      • Applique un poison Feu de fin de tour sur la cible pour chaque PM qu'elle utilise (cumulable 3 fois).
      
      Sur un ennemi : applique les effets sur tous les ennemis Infectés.
    assumptions:
      - "Effet 1160 : le sous-sort porte la MEME fourchette que la ligne propre et cible les Arbres ou les Poupees du lanceur. C'est la zone etendue que le texte du sort decrit, pas une frappe de plus sur la meme cible : « applique les effets dans un cercle de taille 2 »."
      - "Effets 950/951 : ce sort applique « {{spell,29967,1::Chardons Ardents}} » (5399). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "Effets 1160/2960 : lance aussi « Chardons Ardents », « Infection », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Seul poison de la classe à rester écrit en frappe immédiate : il s'applique « pour chaque PM que la cible utilise, cumulable 3 fois », donc de zéro à trois fois selon ce que l'adversaire fait de son tour, durée 1. Le compter une fois est le milieu entre rien, si la cible ne bouge pas, et trois fois 8 si elle dépense tout : un décalage d'un tour, jamais une erreur de magnitude."
    lines:
      - element: fire
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: herbes_folles
    dofusdb_id: 13518
    name: { fr: "Herbes Folles", en: "Wild Grass" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
