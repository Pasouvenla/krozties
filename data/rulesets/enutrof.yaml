# Enutrof.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: enutrof
name: { fr: "Enutrof", en: "Enutrof" }

resources:
  - id: age_d_or_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 13329
    modifies_damage:
      # Effet 138 a `delay: 1` : la Puissance arrive AU TOUR SUIVANT.
      - kind: characteristic
        amount: 200
    note: |
      La Puissance que l'Âge d'Or accorde au tour suivant : « Rend l'allié ciblé
      Intaclable. Augmente sa Puissance au tour suivant. » Effet 138 à 200 sur la
      cible « a », `delay: 1`, durée 1 ; le lanceur peut se cibler lui-même, sa
      portée minimale étant de zéro. Gagnée par un `schedule_gain` à un tour de
      délai, elle vit le tour où elle arrive et lui seul (`turns: 0`).
      L'Intaclable n'est pas modélisé : il porte sur le déplacement.
  - id: tunnel_de_fortune_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Effet 138, duree 1 et `delay: 1` : la Puissance arrive AU TOUR SUIVANT et
    # y reste ce tour-la. Le sort la gagne par un `schedule_gain`, et
    # `turns: 0` la fait vivre ce tour-la seulement.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 12809
    modifies_damage:
      # Vingt points de Puissance PAR PM DEPENSE, sans plafond dans la donnee.
      - kind: characteristic
        amount: 20
        per_mp_used: true
    note: |
      La Puissance que le Tunnel de Fortune accorde au lanceur au tour suivant :
      « augmente sa Puissance au tour suivant pour chaque PM qu'il a utilisé ».
      Effet 138 à 20 sur le lanceur (« C »), `delay: 1`. Le nombre de PM se
      déclare : c'est le réglage « PM dépensés » du scénario, comme pour la
      Tourbière. Le jeu lit les PM dépensés au tour du lancer ; le réglage étant
      unique, le même chiffre vaut pour tous les tours. L'invisibilité n'est pas
      modélisée.
  - id: eboulement
    scope: target
    max: 4
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: spell_tagged
        tag: removes_range
        spends: 1
        lines:
          - element: earth
            critical: [15, 17]
            normal: [12, 14]
        note: |
          La marque que pose Éboulement : elle répond à un retrait de Portée subi par la
          cible, quatre fois, puis disparaît (effet 950 de durée 3 ; « déclenchables
          4 fois, l'état est retiré dès la limite atteinte »). C'est la tentative qui
          déclenche, pas sa réussite : la résistance au retrait de la cible ne
          l'empêche pas.

  - id: monnaie_sonnante
    scope: target
    max: 4
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: spell_tagged
        tag: removes_ap
        spends: 1
        lines:
          - element: air
            critical: [14, 16]
            normal: [11, 13]
        note: |
          La marque que pose Monnaie Sonnante : elle répond à une tentative de retrait de PA subi par la
          cible, quatre fois, puis disparaît (effet 950 de durée 3 ; « déclenchables
          4 fois, l'état est retiré dès la limite atteinte »). C'est la tentative qui
          déclenche, pas sa réussite : la résistance au retrait de la cible ne
          l'empêche pas.

  - id: orpaillage
    scope: target
    max: 4
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: spell_tagged
        tag: removes_mp
        spends: 1
        lines:
          - element: water
            critical: [13, 15]
            normal: [10, 12]
        note: |
          La marque que pose Orpaillage : elle répond à une tentative de retrait de PM subi par la
          cible, quatre fois, puis disparaît (effet 950 de durée 3 ; « déclenchables
          4 fois, l'état est retiré dès la limite atteinte »). C'est la tentative qui
          déclenche, pas sa réussite : la résistance au retrait de la cible ne
          l'empêche pas.

  - id: opportunite
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 138 : de la Puissance, dans l'arrondi caracteristique.
      - kind: characteristic
        amount: 80
    note: |
      « Occasionne des dommages Air et augmente la Puissance du lanceur. » 80
      pendant deux tours, cumul 2 : deux lancers donnent 160. Le sort coûte 2 PA
      et se lance trois fois par tour.


