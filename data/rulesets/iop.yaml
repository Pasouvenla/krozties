# Iop.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: iop
name: { fr: "Iop", en: "Iop" }

resources:
  - id: agitation_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 13113
    modifies_damage:
      - kind: characteristic
        amount: 20
        per_mp_used: true
    note: |
      La Puissance que l'Agitation accorde, par PM dépensé, pour un tour :
      « Augmente les PM de l'allié ciblé et le rend Intaclable. Augmente
      également sa Puissance pour chaque PM utilisé. » Effet 138 à 20 sur la
      cible « a », durée 1 ; le lanceur peut se cibler lui-même, la portée
      minimale du sort étant de zéro. Le nombre de PM se déclare : c'est le
      réglage « PM dépensés », comme pour la Tourbière et le Tunnel de Fortune de
      l'Enutrof. Les PM que le sort donne ne sont pas comptés : un PM gagné n'est
      pas un PM dépensé.
  - id: puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 2
      refresh: on_apply
      on_expire: reset_to_default
    modifies_damage:
      # Puissance s'ajoute a la caracteristique dans le premier arrondi, la ou
      # se trouve la Puissance du stuff : meme etage du pipeline.
      - kind: characteristic
        amount: 300
        critical_amount: 350
      # Effet 414, Dommages Poussee : 120, 140 sur un critique.
      - kind: push_damage
        amount: 120
        critical_amount: 140
    note: |
      Effet 138, durée 3 : 300 de Puissance, 350 sur un coup critique, au niveau
      3 du sort, et 120 Dommages Poussée (140 en critique).

  - id: destin
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    note: |
      « Les dommages du sort sont augmentés à la récupération du sort. » Effet
      293, délai égal à l'intervalle de relance, durée 1 : un bonus unique qui
      arrive quand le sort redevient disponible, pas un cumul. Le sort s'applique
      la ressource en se lançant et la lit au lancer suivant : le premier lancer
      n'a rien, tous les suivants ont le bonus, et l'intervalle de relance place
      celui-ci au bon moment.

      Vérifié en jeu : le bonus exige seulement que le sort soit de nouveau
      disponible, et ne grossit pas à attendre davantage.

  - id: sentence
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 0
      refresh: on_apply
      on_expire: reset_to_default
    while_present:
      - trigger: turn_start
        lines:
          - element: fire
            critical: [32, 36]
            normal: [26, 30]
        note: |
          L'infobulle dit « à la fin du tour de la cible », ce qui, pour une
          recherche par tours, tombe au même endroit que le début du nôtre. « En zone
          autour d'elle » n'exclut pas la cible : ce que pose ce genre de sort est une
          glyphe, qui frappe toute entité présente, la cible d'origine comprise.

          Les deux fourchettes sont celles de l'instantané pour le sort 13147 : 13-16
          (34-38 en critique) est le coup immédiat, porté par le sort, et 26-30
          (32-36) ce que l'état inflige, porté ici.

  - id: elan_divin
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 3
      refresh: on_apply
      on_expire: reset_to_default
    modifies_damage:
      # Effet 112 : « Dommages », tous éléments confondus, diceNum 30, durée 4. Du
      # fixe, qui s'ajoute après l'arrondi caractéristique et non dedans,
      # contrairement à la Puissance : en `base_damage`, 30 en vaudraient 276 sur un
      # build à 650 de caractéristique.
      - kind: flat_damage
        amount: 30
    note: |
      Ce que l'Epee Divine laisse derriere elle : "augmente les Dommages du
      lanceur et des allies en zone". La magnitude vient de la donnee.

  - id: pugilat_enchaine
    scope: caster
    max: 3
    default: 0
    monotone: increasing
    duration:
      turns: 0
      refresh: on_apply
      on_expire: reset_to_default
    note: |
      "Les dommages du sort sont augmentes apres chaque lancer POUR LE TOUR EN
      COURS." Effet 293, valeur 18, duree 1 : le cumul retombe a zero au tour
      suivant, ce que dit `duration: 1`. Plafonne a trois, le sort etant limite
      a quatre lancers par tour et le premier ne beneficiant d'aucun cumul.

  - id: fureur_enchainee
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration:
      turns: 1
      refresh: on_apply
      on_expire: decrement_one
    note: |
      « Les dommages du sort sont augmentés après chaque lancer. Les bonus se
      décrémentent si le sort n'est pas relancé. » D'où `decrement_one` plutôt
      que `reset_to_default` : l'oubli d'un tour coûte un cran, pas tout le
      cumul. Effet 293, valeur 20, durée 2. Cumul 2 : trois paliers, 28-32 puis
      48-52 puis 68-72, vingt de plus à chaque cran.

  - id: accumulation_gagnee
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 2
      refresh: on_apply
      on_expire: reset_to_default
    note: |
      « Sur le lanceur : augmente les dommages du sort. » Effet 293, valeur 24,
      durée 3. Cumul 1 : deux paliers, 22-26 puis 46-50.

  - id: colere_recuperee
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    note: |
      « Les dommages du sort sont augmentés à la récupération du sort. » Effet
      293, délai égal à l'intervalle de relance, durée 1 : un bonus unique qui
      arrive quand le sort redevient disponible, pas un cumul. Le sort s'applique
      la ressource en se lançant et la lit au lancer suivant : le premier lancer
      n'a rien, tous les suivants ont le bonus, et l'intervalle de relance place
      celui-ci au bon moment.

      Une mécanique distincte de celle de l'Épée du Destin : les deux sorts
      rechargent chacun de leur côté, sans partager leur compteur.

  - id: condamne
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 1
      refresh: on_apply
      on_expire: reset_to_default
    note: |
      L'etat que pose l'Epee du Jugement (effet 950, duree 2). Sa frappe
      differee (effet 3793, delai 2) ne tombe que sur une cible qui le porte, et
      un nouveau lancer reinitialise le retardement.

  - id: bond
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163, parametre 115 : les dommages subis par la cible sont
      # multiplies par 1,15. Meme etage qu'un bonus de Dofus.
      - kind: final_multiplier
        percent: 115
    note: |
      « Augmente les dommages subis par les ennemis en zone » : +15 %. Le Bond ne
      frappe pas lui-même : il téléporte le lanceur et pose ce malus, pour le tour
      du lancer seulement. La donnée porte une durée de 0 sur l'effet 1163,
      « jusqu'au début du prochain tour du lanceur », comme les vulnérabilités du
      Fer Rouge ou du Volcan.

  - id: massacre
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: final_multiplier
        percent: 115
    note: |
      « Augmente et renvoie une partie des dommages subis par l'ennemi ciblé » :
      effet 1163 à 115, donc +15 %, pour le tour du lancer seulement (durée 0,
      comme le Bond). Le renvoi aux ennemis en zone (effet 1223, 30 %) n'est pas
      modélisé.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "Seul le Duel la pose sur le lanceur, pour deux tours, et le Duel n'a aucun effet dans ce calculateur : la rotation ne le lance pas. ⚠️ S'il en recoit un, le Bond devra l'exiger absente."

spells:
  - id: pression
    dofusdb_id: 13106
    name: { fr: "Pression", en: "Pressure" }
    ap_cost: { base: 3 }
    casts_per_turn: 4
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Érode la cible et occasionne des dommages Terre.
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: bond
    dofusdb_id: 13107
    name: { fr: "Bond", en: "Jump" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    crit: { base_rate: 0, can_crit: false }
    note: |
      Téléporte le lanceur sur la case ciblée et augmente les dommages subis par les ennemis en zone.
    assumptions:
      - "Ce sort ne frappe pas : il téléporte le lanceur et augmente de 15 % les dommages que les ennemis en zone subissent (effet 1163, paramètre 115). C'est ce +15 % qui est compté ici."
      - "La téléportation n'est pas modélisée : ce calculateur ne simule pas la grille."
    lines: []
    effects:
      - effect: gain
        resource: bond


  - id: intimidation
    dofusdb_id: 13108
    name: { fr: "Intimidation", en: "Intimidation" }
    ap_cost: { base: 2 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: 5 }
    note: |
      Occasionne des dommages dans le meilleur élément du lanceur aux ennemis et repousse la cible.
    assumptions:
      - "Sort « dans le meilleur élément du lanceur » : la ligne frappe dans l'élément où le build a le plus de caractéristique, la même fourchette valant pour les cinq éléments."
    lines:
      - best_element: true
        critical: [11, 13]
        normal: [8, 10]
    effects:
      - effect: damage

  - id: duel
    dofusdb_id: 13109
    name: { fr: "Duel", en: "Duel" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    cooldown_turns: 4
    crit: { base_rate: 0, can_crit: false }
    note: |
      Rend le lanceur et l'ennemi ciblé Invulnérables à distance, leur applique l'état Pesanteur et les immobilise.
      La durée de l'état Pesanteur est plus importante sur le lanceur.
    assumptions:
      - "Effets 950/951 : ce sort applique « Invulnérable à Distance » (375) ; applique « Pesanteur » (7). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "Effet 1160 : lance aussi « Duel », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines: []
    effects: []

  - id: epee_divine
    dofusdb_id: 13110
    name: { fr: "Épée Divine", en: "Divine Sword" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Air aux ennemis et augmente les Dommages du lanceur et des alliés en zone.
    assumptions:
      - "Le même bonus accordé aux alliés en zone n'est pas compté : ce calculateur résout un seul lanceur."
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      - effect: gain
        resource: elan_divin


  - id: epee_du_destin
    dofusdb_id: 13111
    name: { fr: "Épée du Destin", en: "Sword of Fate" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    cooldown_turns: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Feu.
      Les dommages du sort sont augmentés à la récupération du sort.
    assumptions:
      - "Le bonus « à la récupération du sort » : 38-42 au lancer, 78-82 deux tours plus tard, soit les 40 de dégâts de base que porte la donnée (« 1 charge - Dans 2 tours 78-82 »)."
    lines:
      - element: fire
        critical: unknown
        normal: unknown
        base_bonus: [{ kind: per_resource, resource: destin, amount: 40 }]
    effects:
      # Les degats LISENT la ressource, puis le lancer la pose pour la fois
      # suivante. Inverser ces deux lignes donnerait le bonus des le premier
      # lancer, alors qu'il recompense justement d'avoir attendu la recharge.
      - effect: damage
      - effect: gain
        resource: destin

  - id: massacre
    dofusdb_id: 13112
    name: { fr: "Massacre", en: "Massacre" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    cooldown_turns: 4
    crit: { base_rate: 0, can_crit: false }
    note: |
      Augmente et renvoie une partie des dommages subis par l'ennemi ciblé aux ennemis en zone autour de lui.
    assumptions:
      - "Effet 792 : lance aussi « Massacre », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Augmente de 15 % les dommages que la cible subit (effet 1163, paramètre 115)."
      - "Le renvoi d'une partie de ces dommages aux ennemis en zone (effet 1223, 30 %) n'est pas compté : ce solveur ne résout qu'une cible."
    lines: []
    effects:
      - effect: gain
        resource: massacre


  - id: friction
    dofusdb_id: 13113
    name: { fr: "Friction", en: "Friction" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    cooldown_turns: 3
    crit: { base_rate: 0, can_crit: false }
    note: |
      Attire la cible et lui applique l'état Friction :
      • Sur un ennemi : attire la cible vers son attaquant ennemi.
      • Sur un allié : attire ses attaquants ennemis vers elle.
    assumptions:
      - "Effets 950/951 : ce sort applique « Friction » (3643). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "Effet 1160 : lance aussi « Friction », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines: []
    effects: []

  - id: precipitation
    dofusdb_id: 13114
    name: { fr: "Précipitation", en: "Precipitation" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    cooldown_turns: 2
    initial_cooldown: 1
    crit: { base_rate: 0, can_crit: false }
