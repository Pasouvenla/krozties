  - id: epee_du_jugement
    dofusdb_id: 13117
    name: { fr: "Épée du Jugement", en: "Sword of Judgement" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Applique un bouclier sur le lanceur, occasionne des dommages Eau et applique l'état Condamné sur la cible :
