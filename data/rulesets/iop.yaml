      - "Les deux fourchettes Eau sont deux effets : 31-35 au lancer et 48-52 deux tours plus tard (« Tous sauf lanceur - Dans 2 tours »)."
      - "Les boucliers posés sur le lanceur ne sont pas modélisés : ce calculateur maximise les dégâts infligés."
