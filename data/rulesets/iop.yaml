      Augmente les PA de l'allié ciblé et lui applique l'état Affaibli.
      Retire des PA non esquivables à cet allié au tour suivant.
      
      L'état n'est pas appliqué sur le lanceur.
    assumptions:
      - "Effets 950/951 : ce sort applique « Affaibli » (42). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
    lines: []
    open_questions:
      - "Effet 3793 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 111, +5 PA : va a l'ALLIE CIBLE, et le texte precise que « l'etat n'est pas applique sur le lanceur ». Le plus gros gain de PA du parc, et il ne vaut rien en solo."
    effects: []

  - id: couperet
