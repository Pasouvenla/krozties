          - element: water
            critical: [37, 42]
            normal: [31, 35]


  - id: pieges_declenches
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "La cible traverse votre Barrière"
    note: |
      Cochez si la cible traverse le glyphe de votre Barrière : ses dégâts
      comptent alors quand vous la lancez.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "Barriere, Ataraxie et Bergerie la posent sur leur cible ou dans leur glyphe. Aucune n'a d'effet dans ce calculateur, qui ne les lance donc pas, et la rotation ne place jamais le Feca dans son propre glyphe."

