# Féca.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: feca
name: { fr: "Féca", en: "Féca" }

resources:

  - id: hypoglyphe
    # Hypoglyphe, que les huit glyphes elementaires exigent absent (HS!238).
    game_states: [238]
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # « Dans le même tour », dit le texte : `turns: 0` fait vivre l'état le tour
    # de la pose et lui seul. La donnée écrit `duration: 1` sur l'effet 950, mais
    # le texte du sort tranche.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      L'état « Hypoglyphe » (238), que les huit glyphes élémentaires du Féca
      s'appliquent à eux-mêmes en se lançant, et qui leur interdit à tous de
      repartir dans le tour. C'est dans la donnée : les huit portent le critère de
      lancer `states_criterion: "HS!238"` (« le lanceur n'a pas l'état 238 ») et
      l'effet 950 valeur 238 sur `C`. Le texte dit la même chose : « Empêche
      l'utilisation d'autres glyphes élémentaires dans le même tour. »

  - id: sur_le_glyphe_aura
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Tu te tiens sur ton glyphe-aura"
    note: |
      Le glyphe-aura du Pâturage donne 10 % de dommages finaux aux alliés, et vous
      en faites partie si vous vous tenez dessus : sa portée minimale est de zéro,
      vous pouvez le poser sous vos pieds. Cochez si vous jouez ainsi.

  - id: aura_paturage
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Pas de glyphe, pas d'aura : le glyphe ne vivant que le tour de sa pose, le
    # bonus non plus, là où la donnée écrit 2. Il ne profite qu'à ce qui part
    # après le Pâturage, dans son tour.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1171, « #1% Dommages finaux », paramètre 10, durée 2, cible `a`,
      # sur le sous-sort 13028, que l'instantané ne porte pas.
      - kind: final_multiplier
        percent: 110
        # Effet 1171, « % Dommages finaux » : ils s'additionnent à ceux des
        # Dofus et de l'équipement.
        finaux: true
    note: |
      Le glyphe-aura du Pâturage, et lui seul des trois : le Refuge porte l'effet
      1163 à 85, « Dommages subis x85% », qui protège ; le Verglas l'effet 752 à
      50, « + 50 Fuite ». Aucun des deux ne touche aux dégâts.

  # Les glyphes qui frappent : la rotation suppose une cible qui ne bouge pas,
  # et qui reste donc dans chaque glyphe posé sur elle ; un piège, lui, ne part
  # que si l'ennemi entre dedans.
  #
  # Chaque glyphe se lit comme un poison du parc : posé au tour N avec une durée
  # de 2, il frappe au début de chacun des deux tours suivants de la cible
  # (« fin de tour » tombe au même endroit pour une recherche par tours). Au
  # sol, il reste jusqu'à la fin du tour N+1 du lanceur, et la Transhumance peut
  # le déclencher tant qu'il y est : un seul compteur dit les deux choses.
  #
  # Les fourchettes sont celles des sous-sorts, au grade que chaque sort nomme.

  - id: glyphe_terre_brulee
    dofusdb_source: 12985
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          # Sous-sort 12996, grade 3 : taux de critique nul et aucune ligne
          # critique. Le moteur exige une valeur ici : c'est la meme.
          - element: fire
            critical: [30, 34]
            normal: [30, 34]
      - trigger: spell_tagged
        tag: triggers_glyphs
        spends: 0
        once_per_turn: true
        lines:
          - element: fire
            critical: [30, 34]
            normal: [30, 34]

  - id: glyphe_terre_battue
    dofusdb_source: 12987
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          # Sous-sort 13000, grade 3, sans critique.
          - element: earth
            critical: [29, 33]
            normal: [29, 33]
      - trigger: spell_tagged
        tag: triggers_glyphs
        spends: 0
        once_per_turn: true
        lines:
          - element: earth
            critical: [29, 33]
            normal: [29, 33]

  - id: glyphe_vallee
    dofusdb_source: 12990
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          # Sous-sort 12998, grade 3, sans critique.
          - element: water
            critical: [28, 32]
            normal: [28, 32]
      - trigger: spell_tagged
        tag: triggers_glyphs
        spends: 0
        once_per_turn: true
        lines:
          - element: water
            critical: [28, 32]
            normal: [28, 32]

  - id: glyphe_prairie
    dofusdb_source: 12992
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          # Sous-sort 12999, grade 3, sans critique.
          - element: air
            critical: [31, 35]
            normal: [31, 35]
      - trigger: spell_tagged
        tag: triggers_glyphs
        spends: 0
        once_per_turn: true
        lines:
          - element: air
            critical: [31, 35]
            normal: [31, 35]

  - id: glyphe_defiance
    dofusdb_source: 12988
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          # Sous-sort 13001, grade 2 : les quatre elements a 21-22, sans
          # critique. Glyphe de FIN de tour, d'une duree de 1 : un coup.
          - element: earth
            critical: [21, 22]
            normal: [21, 22]
          - element: fire
            critical: [21, 22]
            normal: [21, 22]
          - element: water
            critical: [21, 22]
            normal: [21, 22]
          - element: air
            critical: [21, 22]
            normal: [21, 22]
    note: |
      Glyphe de fin de tour, les quatre autres étant de début de tour. La cible y
      prend son coup à la fin de son tour, donc toujours entre deux tours du
      Féca : le compte est le même. La Transhumance ne le déclenche pas : la
      Défiance n'est pas dans la liste de ses effets 1026.

  # Les trois glyphes-auras ne frappent que déclenchés : leur ligne de dégâts
  # porte le masque `A,*E5260`, « si le lanceur a l'état Glyphes déclenchés »,
  # que la Transhumance ne lui donne que le temps de ses propres effets. Leur
  # sous-sort critique a un taux de base de 1 %, et non celui du sort.
  #
  # Ils ne vivent que le tour de leur pose : la Transhumance ne déclenche une
  # aura que dans le tour où elle est posée, après elle, bien que la donnée
  # écrive 2 sur leur pose (effet 401), d'où `turns: 0`. Un seul glyphe
  # élémentaire partant par tour, une Transhumance ne déclenche jamais plus
  # d'une aura.

  - id: glyphe_paturage
    dofusdb_source: 13013
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: spell_tagged
        tag: triggers_glyphs
        spends: 0
        once_per_turn: true
        crit_base_percent: 1
        lines:
          # Sous-sort 29068 : 31-35, critique 37-42.
          - element: air
            critical: [37, 42]
            normal: [31, 35]

  - id: glyphe_refuge
    dofusdb_source: 13021
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: spell_tagged
        tag: triggers_glyphs
        spends: 0
        once_per_turn: true
        crit_base_percent: 1
        lines:
          # Sous-sort 29067 : 32-36, critique 38-43.
          - element: earth
            critical: [38, 43]
            normal: [32, 36]

  - id: glyphe_verglas
    dofusdb_source: 13023
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
