  - id: fleche_devorante
    dofusdb_id: 32446
    name: { fr: "Flèche Dévorante", en: "Devouring Arrow" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    crit: { base_rate: 10 }
    note: |
      Vole de la vie dans l'élément Feu.
      N'affecte pas le lanceur.
      Le vol de vie est plus important après chaque lancer sur un même ennemi.
      
      Occasionne également des dommages Feu à l'ennemi initial si le sort est lancé sur une autre cible, ou dans les prochains tours s'il n'est pas relancé.
      Les dommages sont plus importants selon le nombre de lancers effectués sur un même ennemi.
    assumptions:
      - "La seconde famille du sort, des dégâts Feu de 34-38 à 70-74 selon le cran, n'est pas comptée : elle frappe « l'ennemi initial si le sort est lancé sur une autre cible, ou dans les prochains tours s'il n'est pas relancé ». Le calcul rend le résultat pour une seule cible et ne suit pas une abstention de lancer : c'est le chiffre d'un Crâ qui relance la flèche sur le même ennemi."
      - "Effet 3793, sans libellé officiel : il apparaît deux fois sur le lanceur, en regard des deux effets 293 qui portent les crans, et c'en est donc la comptabilité. Les quatre crans sont écrits ci-dessous, une ligne chacun : l'effet ne manque pas, son nom manque. Même classement que la Flèche Punitive et la Flèche d'Expiation."
      - "Effet 406, « retire les effets d'un sort », present deux fois et ne nommant aucun sort : c'est l'annulation de la frappe DIFFEREE quand le sort est relance. Cette frappe n'etant pas comptee, l'annulation n'a rien a annuler et ne coute donc RIEN ; le trou est la frappe elle-meme, declare en question ouverte. L'effet ne touche PAS au compteur de crans, qui doit survivre d'un lancer a l'autre pour que les paliers montent."
      - "Les quatre paliers du vol de vie immédiat sont écrits, un par cran de l'état : 11-13 sans état, 23-27 sous I, 34-38 sous II et sous III. Le cran se prend sur la cible : changer d'ennemi repart de zéro."
      - "Les paliers ne mûrissent pas avec le temps : ils suivent les lancers sur le même ennemi."
      - "Effet 1160 : lance aussi « <color=#e6893d>Décharge :</color> », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      # Quatre paliers, une ligne chacun : ils changent de largeur, deux points
      # puis quatre, ce qu'un bonus de dégâts de base ne peut pas écrire. Chaque
      # cran est étiqueté « Cible sous Flèche Dévorante I », « II », « III ».
      - element: fire
        active_at: { resource: devorante, exactly: 0 }
        critical: [14, 16]
        normal: [11, 13]
      - element: fire
        active_at: { resource: devorante, exactly: 1 }
        critical: [28, 32]
        normal: [23, 27]
      # Les crans II et III sur une seule case, comme les deux premiers. Leur
      # zone est écrite parce que la donnée porte aussi 34-38 en cercle de
      # taille 63 : c'est la frappe différée, sur toute la carte et non
      # comptée, que la fusion ne distingue pas de ce vol de vie par la seule
      # fourchette.
      - element: fire
        active_at: { resource: devorante, exactly: 2 }
        area: { shape: P, size: 1, max_targets: 1, falloff_percent: 10, falloff_steps: 4 }
        critical: [41, 46]
        normal: [34, 38]
      - element: fire
        active_at: { resource: devorante, exactly: 3 }
        area: { shape: P, size: 1, max_targets: 1, falloff_percent: 10, falloff_steps: 4 }
        critical: [41, 46]
        normal: [34, 38]
    effects:
      - effect: damage
      - effect: gain
        resource: devorante
        at_cap: skip

