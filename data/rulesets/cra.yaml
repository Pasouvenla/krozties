# Crâ.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: cra
name: { fr: "Crâ", en: "Crâ" }

resources:
  - id: glacee_enchainee
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Flèche Glacée : effet 293, durée 3 ; en 3.7, +3 / +4 / +5 par cran selon le
      grade, deux crans au plus.

  - id: immobilisation_enchainee
    scope: caster
    max: 4
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    note: "Fleche d'Immobilisation : effet 293, valeur 2, duree 3."

  - id: expiation_enchainee
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 5, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Trois paliers, 108-114 sans charge, 220-226 à une, 331-337 à deux : des
      écarts de 112 et 111, donc un bonus constant, les 36 de l'effet 293.
      « Dans 2 tours » puis « Dans 4 tours » dit combien de temps il faut pour
      atteindre chaque palier : deux tours par charge, l'intervalle de relance du
      sort. Le cumul doit donc survivre à cette attente.

  - id: punitive_enchainee
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Sur un même build : 454-501 sans charge, 737-784 à une, 1114-1162 à deux.
      Les écarts valent 283 puis 377, dont le rapport est exactement 32/24, les
      deux valeurs que la donnée porte pour l'effet 293 aux délais 1 et 2 : deux
      paliers cumulatifs, +24 au premier cran, +32 au second (`steps: [24, 32]`).

      Plafond de deux : ce sort montre deux paliers, « 1 charge » et « 2
      charges », qui se cumulent par-dessus les dégâts initiaux. Le champ
      « Cumul : 1 » du pied de fiche ne compte pas : il dit autre chose que le
      nombre de crans du bonus de dégâts.

  - id: fulminante_enchainee
    scope: caster
    max: 4
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Flèche Fulminante : « les dommages sont augmentés après chaque cible
      touchée », effet 293 valeur 15 ; sur cible unique, une cible touchée par
      lancer. Quatre paliers de charge, 26-29 nu puis 41-44, 56-59, 71-74 et
      86-89, quinze points d'écart chacun.

  - id: tirs_puissants
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # 250 Puissance sur un jet normal, 300 sur un critique (effet 138, dans les
      # deux listes de la donnée). Le solveur applique une valeur : la critique
      # quand le sort critique au moins 78 % du temps sur ce build, la normale
      # sinon. L'ordre compte, cette ressource portant aussi quinze points de
      # taux : le calcul se fait en deux passes, le taux d'abord.
      - kind: characteristic
        amount: 250
        critical_amount: 300
      # Effet 115, valeur 15, durée 1 : quinze points de taux de coup critique,
      # « augmente sa Puissance, ses Dommages Poussée et ses Critiques ».
      # Dix-sept sur un critique, dans la liste critique de la donnée.
      - kind: critical_rate
        percent: 15
        critical_percent: 17
      # Effet 414, Dommages Poussée : 150, 170 sur un critique.
      - kind: push_damage
        amount: 150
        critical_amount: 170
    note: |
      "Sacrifie la Portee du lanceur pour augmenter sa Puissance." La portee
      perdue n'est pas modelisee : le placement ne l'est pas non plus, donc ce
      sort ressort ici sans son cout.

  - id: acuite_absolue
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 115, valeur 15, durée 1.
      - kind: critical_rate
        percent: 15
    note: |
      « Augmente egalement ses Critiques. » C'est la seule moitie de ce sort qui
      touche aux degats : la portee minimale relevee et la ligne de vue
      desactivee relevent du placement, que ce calculateur ne simule pas.

  - id: elan_assaillant
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: characteristic
        amount: 150
    note: |
      Fleche Assaillante : effet 138, 150 Puissance, duree 1. Comme la Puissance
      du stuff, elle entre dans l'arrondi caracteristique et profite a TOUS les
      sorts, pas seulement au sien.

  - id: fleche_tyrannique
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 1
      refresh: on_apply
      on_expire: reset_to_default
    while_present:
      - trigger: turn_start
        lines:
          - element: fire
            critical: [24, 26]
            normal: [20, 22]
        note: |
          Le poison de fin de tour. La donnée porte trois lignes Feu pour ce sort,
          28-32 puis 20-22 puis 28-32 : sur un build, coup immédiat 215-234, « Fin de
          tour » 176-185 avec une durée de 2, puis une troisième ligne égale à la
          première. Le rapport le confirme : 234-215 = 19 pour un écart de base de 4,
          185-176 = 9 pour un écart de 2. C'est donc 20-22 qui empoisonne et 28-32
          qui frappe. Le poison tombe au début de nos deux tours suivants.


  - id: fleche_harcelante
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 1
      refresh: on_apply
      on_expire: reset_to_default
    while_present:
      - trigger: turn_start
        lines:
          - element: air
            critical: [20, 23]
            normal: [17, 19]
        note: |
          Le poison de début de tour, même forme que la Flèche Tyrannique. Ce sort n'a
          aucun coup immédiat : son texte dit « réduit les soins reçus par la cible et
          lui applique un poison Air de début de tour », et sa seule fourchette est
          rangée sous « Début de tour », durée 2.

  - id: redemption_enchainee
    scope: caster
    max: 6
    default: 0
    monotone: increasing
    note: |
      « Les dommages du sort sont augmentés pour chaque tentative de retrait de
      PA ou de PM réussie. » Six crans, sept paliers 26-29, 32-35, 38-41, 44-47,
      50-53, 56-59, 62-65 et leurs critiques de 31-35 à 67-71 : 6 par cran sur
      les deux bornes. Seuls les retraits de PM comptent : le retrait de PA est
      supposé ne jamais aboutir sur une cible de fin de jeu (`AP_THEFT_LANDS`).
      « Les dommages sont réinitialisés après utilisation du sort » : la réserve
      se vide au lancer.

  - id: devorante
    scope: target
    max: 3
    default: 0
    monotone: increasing
    note: |
      « Le vol de vie est plus important après chaque lancer sur un même
      ennemi. » Cumul 3 : « Flèche Dévorante I, II et III ». Porté par la cible
      et non par le lanceur : changer de cible repart de zéro.

  - id: attaques_subies
    scope: caster
    max: 4
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Attaques ennemies subies au tour précédent"
    note: |
      Combien d'attaques ennemies vous avez subies au tour précédent : l'Œil pour
      Œil monte de 6 dégâts de base par attaque, quatre au plus (27-30 nu, puis
      33-36 à une attaque, jusqu'à 51-54 à quatre).

  - id: poussee_subie
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "La cible subit des dommages de poussée à chaque tour"
    note: |
      À cocher si vous poussez la cible contre un obstacle à chaque tour : elle
      subit des dommages de poussée sans bouger, ce qui décharge le poison de la
      Flèche Tyrannique.

  - id: fleche_tyrannique_decharge
    dofusdb_source: 32448
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        # Sous-sort 32488, grade 3 : 1 % de critique de base, et non les 15 %
        # du sort.
        crit_base_percent: 1
        lines:
          - element: fire
            critical: [34, 38]
            normal: [28, 32]
    note: |
      La decharge de la Fleche Tyrannique : quand la cible subit des dommages de
      poussee, le sort « occasionne prematurement des dommages Feu et retire
      les effets du sort ». 28-32 d'un coup, et plus de poison. Posee seulement
      si le joueur declare la poussee, une fois par tour au debut du suivant.

  - id: pieges_declenches
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "La cible déclenche votre piège Vendetta"
    note: |
      Cochez si la cible marche sur votre Vendetta : ses dégâts comptent alors
      quand vous la posez, une fois par tour au plus.

  - id: vendetta_dommages_subis
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - { kind: final_multiplier, percent: 110 }
    note: |
      En 3.7, le piège de Vendetta « récupère l'augmentation de dommages subis de
      Représailles : x110 % (1 tour) », cumul maximal 1. Posé quand le piège part,
      après ses dégâts : il sert aux coups qui suivent dans le tour.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "Les Represailles la posent sur les cibles de leur zone, et la rotation ne place pas le Cra dans sa propre zone. Le Pas Chasse, seul a l'exiger absente, n'a de toute facon aucun effet ici."

spells:
  - id: fleche_de_recul
    dofusdb_id: 32426
    name: { fr: "Flèche de Recul", en: "Retreat Arrow" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Air aux ennemis et repousse la cible.
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: fleche_cinglante
    dofusdb_id: 32427
    name: { fr: "Flèche Cinglante", en: "Lashing Arrow" }
    ap_cost: { base: 2 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Retire des PM et occasionne des dommages Air.
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: gain
        resource: redemption_enchainee
        at_cap: skip
      - effect: damage

  - id: fleche_de_dispersion
    dofusdb_id: 32428
    name: { fr: "Flèche de Dispersion", en: "Dispersing Arrow" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Air aux ennemis et repousse les cibles depuis le centre en zone.
      La poussée est plus importante aux extrémités de la zone.
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: fleche_perforante
    dofusdb_id: 32429
    name: { fr: "Flèche Perforante", en: "Piercing Arrow" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Air aux ennemis et repousse les cibles en zone.
      Les dommages de zone ne sont pas dégressifs et sont plus importants sur les cibles ayant du bouclier.
    lines:
      - element: air
        critical: unknown
        normal: unknown
    assumptions:
      - "Ce sort porte deux fourchettes Air : 44-48 sur une cible sous bouclier, 38-42 sinon. Les boucliers de la cible ne sont pas simulés, c'est donc la seconde qui est comptée ici."
    effects:
      - effect: damage

  - id: pluie_de_fleches
    dofusdb_id: 32431
    name: { fr: "Pluie de Flèches", en: "Raining Arrows" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Retire de l'Esquive PM et occasionne des dommages Air en zone.
      N'affecte pas le lanceur.
      
      Les effets sont relancés à partir de la case ciblée au tour suivant.
    assumptions:
      - "Effet 2794 à `delay: 1`, Air 21-23 (25-28 en critique), en frappe différée : « les effets sont relancés à partir de la case ciblée au tour suivant », et la donnée porte deux effets 2794, l'un immédiat, l'autre à délai 1, à la même fourchette. Elle repart de la case ciblée, pas de la cible : si l'ennemi a bougé, elle le rate. Ce calculateur la compte comme touchant."
      - "Effet 163, -N Esquive PM sur la cible : l'esquive decide si un retrait de PM aboutit, elle ne change aucun degat porte."
      - "Effet 2794 : lance aussi « Pluie de Flèches », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: gain
        resource: redemption_enchainee
        at_cap: skip
      - effect: damage
      # « Les effets sont relances a partir de la case ciblee AU TOUR SUIVANT » :
      # effet 2794 a `delay: 1` dans la donnee, la meme volee une seconde fois.
      - effect: schedule
        id: pluie_relancee
        delay: 1
        payload:
          - element: air
            critical: [25, 28]
            normal: [21, 23]

  - id: fleche_boomerang
    dofusdb_id: 32432
    name: { fr: "Flèche Boomerang", en: "Boomerang Arrow" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    casts_per_target: 1
    crit: { base_rate: unknown }
    note: |
      Retire des PM et occasionne des dommages Air.
      N'affecte pas le lanceur.
      
      Retire des PM et vole de la vie à la cible initiale et aux ennemis entre elle et la nouvelle cible si elles sont alignées.
      Affecte également les Balises.
      Applique ces effets entre la dernière cible et le lanceur à la fin du tour de ce dernier s'il est aligné avec elle.
    assumptions:
      - "Effet 2795 : encore un lanceur de sous-sort, meme signature que 1160 et 792, sa description officielle se reduisant a « #1 ». Il porte ici le meme retour de boomerang que ci-dessus."
      - "Effets 950 et 951, etat « Fleche Boomerang » (6975) : il marque la cible initiale, celle vers qui le boomerang revient. Lu par le sort lui-meme et par personne d'autre."
      - "Effets 792, 1160 et 2160, Air 26-29 en vol de vie : « vole de la vie a la CIBLE INITIALE et aux ennemis entre elle et la nouvelle cible si elles sont alignees ». Il faut donc une seconde cible et un alignement pour que cette ligne parte. Sur une cible unique elle n'a rien a atteindre."
      - "Effet 2160 : le sort REBONDIT sur une autre entite, « Flèche Boomerang » sur « a,A,E6975 » : Air 26-29 en vol de vie. Le rebond frappe l'entite la plus proche AUTRE que celle visee : sur une cible unique il n'a rien a toucher et n'ajoute rien, le chiffre affiche est donc exact. C'est le reglage « Ennemis touches » qui le fait compter, un rebond valant une cible de plus."
      - "Effets 792/1160/2160 : lance aussi « Flèche Boomerang », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: gain
        resource: redemption_enchainee
        at_cap: skip
      - effect: damage

  - id: fleche_persecutrice
    dofusdb_id: 32433
    name: { fr: "Flèche Persécutrice", en: "Persecuting Arrow" }
    ap_cost: { base: 4 }
    casts_per_turn: 2
    casts_per_target: 1
    crit: { base_rate: unknown }
    note: |
      Vole de la vie dans l'élément Air.
      Occasionne des dommages Air au tour suivant si la cible n'est pas dans la ligne de vue du lanceur.
    assumptions:
      - "Effet 3793 à `delay: 1`, Air 34-38 (41-46 en critique) : « occasionne des dommages Air au tour suivant si la cible n'est pas dans la ligne de vue du lanceur ». Compté à chaque lancer, au début du tour suivant : le Crâ finit son tour hors de la ligne de vue de sa cible. Rangé sous « Dans 1 tour », à la même fourchette que le vol de vie immédiat, il critique au taux du sort."
      - "Effet 1160 : lance aussi « Flèche Persécutrice », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      # « Au tour suivant si la cible n'est pas dans la ligne de vue » : le Crâ
      # finit hors de sa ligne de vue.
      - effect: schedule
        id: persecution
        delay: 1
        payload:
          - element: air
            critical: [41, 46]
            normal: [34, 38]

  - id: fleche_glacee
    dofusdb_id: 32435
    name: { fr: "Flèche Glacée", en: "Frozen Arrow" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Retire des PA et occasionne des dommages Eau.
      Les dommages du sort sont augmentés après son utilisation.
    lines:
      - element: water
        critical: unknown
        normal: unknown
        base_bonus:
          - kind: per_resource
            resource: glacee_enchainee
            amount: 5
    effects:
      - effect: damage
      - effect: gain
        resource: glacee_enchainee

  - id: fleche_d_immobilisation
    dofusdb_id: 32436
    name: { fr: "Flèche d'Immobilisation", en: "Immobilising Arrow" }
    ap_cost: { base: 2 }
    casts_per_turn: 4
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Vole des PM et occasionne des dommages Eau
      Les dommages du sort sont augmentés après chaque lancer.
    assumptions:
      - "Effet 77, vol de PM : un PM retire ne change aucun degat porte, et ce calculateur ne simule pas le tour de l'adversaire."
    lines:
      - element: water
        critical: unknown
        normal: unknown
        base_bonus:
          - kind: per_resource
            resource: immobilisation_enchainee
            amount: 2
    effects:
      - effect: gain
        resource: redemption_enchainee
        at_cap: skip
      - effect: damage
      - effect: gain
        resource: immobilisation_enchainee

  - id: il_de_taupe
    dofusdb_id: 32437
    name: { fr: "Œil de Taupe", en: "Bat's Eye" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Dévoile les invisibles, retire de la Portée et vole de la vie dans l'élément Eau en zone.
    lines:
      - element: water
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: fleche_d_expiation
    dofusdb_id: 32438
    name: { fr: "Flèche d'Expiation", en: "Atonement Arrow" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    cooldown_turns: 2
    crit: { base_rate: unknown }
    note: |
      Réduit les soins reçus par la cible et occasionne des dommages Eau.
      Les dommages du sort sont augmentés pour les prochains lancers.
    lines:
      - element: water
        critical: unknown
        normal: unknown
        base_bonus:
          - kind: per_resource
            resource: expiation_enchainee
            amount: 36
    assumptions:
      - "Effet 3793, « les dommages du sort sont augmentés pour les prochains lancers » : compté, mesuré à 37,8 puis 73,8 puis 109,8 de dégâts de base, pour 36, 72 et 108 publiés. « Dans 2 tours » puis « Dans 4 tours » ne dit pas qu'un cran mûrit tout seul, mais dans combien de temps on peut relancer : l'intervalle de relance du sort vaut deux tours. Voir la ressource `expiation_enchainee`."
      - "La montée est comptée : le total n'est pas un plancher."
    effects:
      - effect: damage
      - effect: gain
        resource: expiation_enchainee

  - id: fleche_ralentissante
    dofusdb_id: 32439
    name: { fr: "Flèche Ralentissante", en: "Slow-Down Arrow" }
    ap_cost: { base: 4 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Retire des PA et des PM et occasionne des dommages Eau en zone.
    lines:
      - element: water
        critical: unknown
        normal: unknown
    effects:
      - effect: gain
        resource: redemption_enchainee
        at_cap: skip
      - effect: damage

  - id: fleche_paralysante
    dofusdb_id: 32441
    name: { fr: "Flèche Paralysante", en: "Paralysing Arrow" }
    ap_cost: { base: 4 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Retire des PA et des PM et occasionne des dommages Eau en zone.
    lines:
      - element: water
        critical: unknown
        normal: unknown
    effects:
      - effect: gain
        resource: redemption_enchainee
        at_cap: skip
      - effect: damage

  - id: fleche_de_redemption
    dofusdb_id: 32442
    name: { fr: "Flèche de Rédemption", en: "Redemption Arrow" }
    ap_cost: { base: 4 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Vole de la vie dans l'élément Eau.
      Les dommages du sort sont augmentés pour chaque tentative de retrait de PA ou de PM réussie.
      
      Les dommages sont réinitialisés après utilisation du sort.
    assumptions:
      - "Effet 293, +6 dégâts de base par cran, plafonné à six : sept paliers, 26-29, 32-35, 38-41, 44-47, 50-53, 56-59, 62-65, et 31-35 à 67-71 en critique. L'écart est de 6 sur les deux bornes : un bonus de dégâts de base, pas une autre ligne."
      - "Effet 1406, « enleve les effets du rang N du sort M » : c'est la remise a zero que le texte annonce, « les dommages sont reinitialises apres utilisation du sort ». Ecrite ici en `reset` de la ressource."
    lines:
      - element: water
        critical: unknown
        normal: unknown
        base_bonus:
          - kind: per_resource
            resource: redemption_enchainee
            amount: 6
    effects:
      - effect: damage
      - effect: reset
        resource: redemption_enchainee

  - id: fleche_de_barrage
    dofusdb_id: 32443
    name: { fr: "Flèche de Barrage", en: "Barricade Arrow" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
