# Sram.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: sram
name: { fr: "Sram", en: "Sram" }

resources:
  - id: fourberie_intelligence
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 12905
    modifies_damage:
      - kind: characteristic
        amount: 100
        element: fire
    note: |
      Les cent points de Intelligence que la Fourberie vole à la cible et donne au
      lanceur, pendant trois tours, cumul 2 (`maxStack`) : deux cents au plus. Le
      vol donne au lanceur ce qu'il retire, et ne lève que les lignes Feu.

  - id: arnaque_agilite
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 12911
    modifies_damage:
      - kind: characteristic
        amount: 100
        element: air
    note: |
      Les cent points de Agilité que l'Arnaque vole à la cible et donne au
      lanceur, pendant trois tours, cumul 2 (`maxStack`) : deux cents au plus. Le
      vol donne au lanceur ce qu'il retire, et ne lève que les lignes Air.

  - id: pillage_chance
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 12934
    modifies_damage:
      - kind: characteristic
        amount: 100
        element: water
    note: |
      Les cent points de Chance que le Pillage vole à la cible et donne au
      lanceur, pendant trois tours, cumul 2 (`maxStack`) : deux cents au plus. Le
      vol donne au lanceur ce qu'il retire, et ne lève que les lignes Eau.

  - id: extorsion_force
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 12938
    modifies_damage:
      - kind: characteristic
        amount: 100
        element: earth
    note: |
      Les cent points de Force que l'Extorsion vole à la cible et donne au
      lanceur, pendant trois tours, cumul 2 (`maxStack`) : deux cents au plus. Le
      vol donne au lanceur ce qu'il retire, et ne lève que les lignes Terre.
      La Terre emporte le Neutre avec elle, les deux tirant de la Force.

  - id: truanderie
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 138 : de la Puissance, donc DANS l'arrondi caracteristique.
      - kind: characteristic
        amount: 80
    note: |
      « Vole de la Puissance. » La donnée porte les deux moitiés séparément :
      l'effet 186 retire 80 Puissance à la cible, l'effet 138 en donne 80 au
      lanceur, marqué « C », pendant trois tours. Cumul 2 (`maxStack`) : le moteur
      applique les modificateurs par charge, et deux crans valent le double.


  - id: vulnerabilite_marque_mortuaire
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Meme lecture que pour Coupe-gorge : zero tour veut dire « le tour de la
    # pose, et lui seul ».
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163, « Dommages subis x102 % ». Le sort en porte cinq paliers, 102 à
      # 110 %, gouvernés par le nombre de pièges déclenchés du lanceur (états 1407 à
      # 1410 sur le lanceur). C'est le palier sans piège qui compte, le plus bas des
      # cinq : ces états ne sont pas suivis.
      - kind: final_multiplier
        percent: 102
    note: |
      La vulnerabilite que la Marque Mortuaire pose sur sa cible. Tout ce qui
      tombe ensuite sur elle dans le meme tour est multiplie par 1.02, et
      jusqu'a 1.10 pour qui joue ses pieges.

  - id: vulnerabilite_coupe_gorge
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Zéro tour veut dire « le tour de la pose, et lui seul » : la vulnérabilité
    # tient jusqu'au début du prochain tour du lanceur, qui n'en profite que dans
    # le même tour d'actions.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163, « Dommages subis x110 % » : un multiplicateur, donc tout a
      # la fin du pipeline.
      - kind: final_multiplier
        percent: 110
    note: |
      La vulnerabilite que Coupe-gorge pose sur sa cible. Tout ce qui tombe ensuite
      sur elle dans le meme tour est multiplie par 1.1.

  - id: injection_toxique
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 2
      refresh: on_apply
      on_expire: reset_to_default
    while_present:
      - trigger: turn_start
        lines:
          - element: air
            critical: [34, 38]
            normal: [28, 32]
        note: |
          Le poison de début de tour, même forme que la Flèche Harcelante et la
          Flèche Tyrannique du Crâ. « Retire des PM et applique un poison Air de début
          de tour sur la cible » : le sort ne frappe pas au lancer, et sa seule
          fourchette, 28-32, est rangée sous « Début de tour », durée 3. Le poison
          tombe au début de chacun de nos trois tours suivants.
    note: |
      Un seul poison : le cumul de 2 de la donnée (`maxStack`) porte sur le temps
      de relance, pas sur le poison. La relance vaut 5 de base et descend à 3 au
      mieux, un cran par cible qui prend des dégâts de piège ; cette relance
      raccourcie n'est pas comptée.

  - id: toxines
    scope: target
    max: 6
    default: 0
    monotone: increasing
    duration:
      turns: 1
      refresh: on_apply
      on_expire: reset_to_default
    while_present:
      - trigger: turn_start
        lines:
          - element: air
            active_at: { resource: toxines, exactly: 1 }
            critical: [7, 9]
            normal: [7, 9]
          - element: air
            active_at: { resource: toxines, exactly: 2 }
            critical: [13, 15]
            normal: [13, 15]
          - element: air
            active_at: { resource: toxines, exactly: 3 }
            critical: [19, 21]
            normal: [19, 21]
          - element: air
            active_at: { resource: toxines, exactly: 4 }
            critical: [25, 27]
            normal: [25, 27]
          - element: air
            active_at: { resource: toxines, exactly: 5 }
            critical: [31, 33]
            normal: [31, 33]
          - element: air
            active_at: { resource: toxines, exactly: 6 }
            critical: [37, 39]
            normal: [37, 39]
        note: |
          Le poison de fin de tour, avec ses six paliers, même forme que l'Arsenic et
          l'Injection Toxique ci-dessous, durée 2. Le sort ne frappe pas au lancer :
          « applique un poison Air de fin de tour sur l'ennemi ciblé ». Le compteur
          porte à la fois la présence du poison et son cran : quand le poison tombe,
          la durée le ramène à zéro et le cran part avec lui.

          Le compteur suit les lancers, pas les tours passés sous poison : les paliers
          sont étiquetés « N tours avec cible sous poison », et le sort ne se lançant
          qu'une fois par tour, les deux coïncident tant qu'on le relance. Sur un tour
          sauté, le jeu compte un tour de plus et ce fichier aucun : le modèle est un
          plancher.

          Le texte du sort dit que le poison « est réappliqué tant qu'il est actif et
          que la cible subit des dommages de pièges » ; les paliers publiés nomment la
          condition autrement, par tours sous poison, et c'est cette lecture qui est
          retenue.

  - id: arsenic
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 1
      refresh: on_apply
      on_expire: reset_to_default
    while_present:
      - trigger: turn_start
        lines:
          - element: air
            critical: [19, 22]
            normal: [16, 18]
        note: |
          « Retire de la Portee et applique un poison Air de debut de tour sur
          la cible. » Meme forme que l'Injection Toxique ci-dessus, duree 2.

  - id: pieges_declenches
    scope: caster
    max: 5
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Pièges que la cible déclenche par tour"
    note: |
      Combien de vos pièges la cible déclenche à chaque tour : ils comptent
      leurs dégâts quand vous les posez, dans cette limite, et la Chausse-trappe
      frappe de 8 de plus par piège.
    # Ce que le réglage porte, pour le mainteneur : combien de pièges du lanceur
    # ont été déclenchés, ce que le joueur déclare.
    #
    # La Chausse-trappe monte de 8 dégâts de base par piège, cinq au plus : 28-32
    # nu, puis 36-40 à un piège, jusqu'à 68-72 à cinq. La Rotation compte aussi
    # les pièges eux-mêmes : ce réglage borne ceux qui partent dans un tour (« la
    # cible déclenche N pièges par tour »), sur une réserve à part,
    # `pieges_du_tour`, que la Rotation greffe et que les pièges consomment.
    #
    # « Les effets sont retirés après utilisation du sort » : la Chausse-trappe
    # remet le compteur à zéro en partant, et le réglage revient à la valeur
    # déclarée au début du tour suivant, un compteur déclaré disant ce que le
    # joueur fait dans un tour et non une réserve qui s'épuise.

  - id: concentration_de_chakra
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Effet 950 du sort 12903, etat 643, duree 1 : le tour du lancer.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      L'etat de la Concentration de Chakra : chaque piege que la cible declenche
      tant qu'il tient lui vole 12 en meilleur element, comme dans KrozTrap.

  - id: double_au_contact
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Votre double meurt au contact de la cible"
    note: |
      Le double du Comploteur meurt à la fin de son troisième tour et frappe
      alors les entités à son contact : cochez si vous le gardez au contact de la
      cible.

costly:
  - id: vols_de_caracteristique
    name: { fr: "Vols de caractéristique", en: "Characteristic steals" }
    resources: [fourberie_intelligence, arnaque_agilite, pillage_chance, extorsion_force, truanderie]
    note: |
      Les cinq sorts qui volent une caractéristique à la cible, Fourberie,
      Arnaque, Pillage, Extorsion et Truanderie, et le bonus qu'ils rendent au
      lanceur pendant trois tours. Sans eux, le total est très en dessous de ce
      qu'un Sram fait vraiment.

spells:
  - id: truanderie
    dofusdb_id: 12902
    name: { fr: "Truanderie", en: "Gangsterdom" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Vole de la Puissance et occasionne des dommages Terre.
    assumptions:
      - "Effet 186, -80 Puissance sur la CIBLE : c'est l'autre moitie du vol, celle qui affaiblit l'adversaire. Elle ne change pas ce que le lanceur inflige, et ce calculateur ne simule pas le tour de l'adversaire."
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      - effect: gain
        resource: truanderie

  - id: concentration_de_chakra
    dofusdb_id: 12903
    name: { fr: "Concentration de Chakra", en: "Chakra Concentration" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    cooldown_turns: 3
    initial_cooldown: 1
    crit: { base_rate: 0, can_crit: false }
    note: |
      Applique l'état Concentration de Chakra sur l'ennemi ciblé :
      • Vole de la vie dans le meilleur élément du lanceur à la cible si elle subit des dommages de pièges.
      
      Dissipe l'invisibilité du lanceur.
    assumptions:
      - "Dans la Rotation : l'état sur la cible le tour du lancer (effet 950, durée 1), et 12 en meilleur élément volés à chaque piège qu'elle déclenche alors (effet 2828), comme KrozTrap. Sans piège déclaré, rien."
      - "Effets 950/951 : ce sort applique « Concentration de Chakra » (643), lu ici comme la ressource `concentration_de_chakra` pour le vol sur les pieges. AUCUN sort de la classe ne lit ces etats dans son masque de cible."
      - "Effet 1160 : lance aussi « Concentration de Chakra », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines: []
    effects:
      - effect: gain
        resource: concentration_de_chakra

  - id: sournoiserie
    dofusdb_id: 12904
    name: { fr: "Sournoiserie", en: "Deviousness" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Feu aux ennemis et repousse la cible.
    lines:
