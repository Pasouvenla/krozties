      • Attire les entités vers le centre en zone.
    assumptions:
      - "Effet 111, +1 PA au lanceur tant que le masque est porté (voir la ressource `masque_intrepide`). Les PA donnés aux alliés ne sont pas comptés, ce calculateur résolvant un personnage seul."
      - "Effets 792/2794 : lance aussi « Gestion des masques », « Masque de l'Intrépide », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
