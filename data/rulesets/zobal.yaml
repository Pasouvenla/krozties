# Zobal.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: zobal
name: { fr: "Zobal", en: "Zobal" }

resources:
  - id: nevrose_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 13426
    modifies_damage:
      - kind: characteristic
        amount: 250
    note: |
      La Puissance que la Névrose accorde, pour deux tours : « Augmente la
      Puissance de l'allié ciblé et applique l'état Pesanteur sur la cible. »
      Effet 138 à 250 sur la cible « a », sans condition ; le lanceur peut se
      cibler lui-même, la portée minimale du sort étant de zéro. La Pesanteur
      n'est pas modélisée : elle porte sur le déplacement.
  - id: furia
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 112 : « Dommages », tous elements confondus, 40 pendant 2 tours.
      # Fixe, donc apres l'arrondi caracteristique et non dedans.
      - kind: flat_damage
        amount: 40
    note: |
      « Occasionne des dommages Terre et augmente les Dommages du lanceur. »
      Cumul 1 : un second lancer ne fait que rafraîchir ses deux tours.

  - id: psychopathe
    # Psychopathe (99), qu'exigent onze sorts, seul ou avec l'Intrepide.
    game_states: [99]
    scope: caster
    max: 1
    default: 0
    monotone: none
    modifies_damage: []
    note: |
      L'état posé par le Masque du Psychopathe et par sa variante, le Masque de
      l'Hystérique (effet 950 sur 99). Il se porte jusqu'à ce qu'un autre masque
      le remplace : chaque masque lance d'abord « Gestion des masques » (18634),
      qui retire Intrépide, Psychopathe et Pleutre, puis pose le sien. Trois
      compteurs, un seul à un à la fois.

      Il ne modifie aucun dégât par lui-même : c'est le Carnavalo qui lit l'état.
      `monotone: none` : porter un masque, c'est ne pas porter les deux autres.

  - id: hysterique_poussee
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    modifies_damage:
      - kind: push_damage
        amount: 80
    note: |
      Les 80 Dommages Poussée du Masque de l'Hystérique (effet 414, sur le
      lanceur), distincts de `psychopathe`, que le Masque du Psychopathe pose
      sans ces Dommages Poussée. Hypothèses : durée -1 dans la donnée, donc
      permanent ; un seul cumul ; un changement de masque ne le retire pas,
      « Gestion des masques » ne retirant que les trois états de masque.

  - id: bocciara_poussee
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Duree 2 dans la donnee : le tour du lancer et le suivant.
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: push_damage
        amount: 80
    note: |
      Les 80 Dommages Poussée de la Bocciara (effet 414, sur le lanceur). Un
      seul cumul : la donnée ne dit pas s'ils s'additionnent quand le sort est
      relancé.

  - id: masque_intrepide
    # Intrepide (98), qu'exigent seize sorts, seul ou avec un autre masque.
    game_states: [98]
    scope: caster
    max: 1
    default: 0
    monotone: none
    # Effet 111, +1 PA au lanceur tant que le masque est porte.
    grants_ap: 1
    note: |
      L'état que posent le Masque de l'Intrépide et le Masque de l'Infatigable,
      exclusif des deux autres comme le Psychopathe.

      +1 PA tant que le masque est porté : effet 111 sur le lanceur, sans durée,
      et « Gestion des masques » (18636) retire les effets du masque quitté
      (effet 406). Trois morceaux : le PA du tour de la pose (`ap_bonus` du
      masque, sauf s'il était déjà porté, `max_stack` à 1), celui de chaque tour
      suivant (`grants_ap`), et le PA perdu quand un autre masque le remplace,
      compté comme un surcoût de ce masque-là. Aucun masque au début du combat :
      la rotation en pose un avant son premier sort à masque, pour 1 PA.

  - id: masque_pleutre
    # Pleutre (100), qu'exigent douze sorts, seul ou avec un autre masque.
    game_states: [100]
    scope: caster
    max: 1
    default: 0
    monotone: none
    note: |
      L'etat que posent le Masque du Pleutre et le Masque du Couard. Exclusif
      des deux autres, comme le Psychopathe.

  - id: inferno
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 138 : de la Puissance, qui entre DANS l'arrondi caracteristique,
      # contrairement aux Dommages de la Furia.
      - kind: characteristic
        amount: 200
    note: |
      « Occasionne des dommages Feu et augmente la Puissance du lanceur. » 200 de
      Puissance pendant deux tours, cumul 1. La Puissance d'Inferno passe dans
      l'arrondi, les Dommages de la Furia s'ajoutent après : à magnitude égale, le
      premier vaut bien plus.


  - id: vie_restante
    scope: caster
    max: 100
    default: 100
    monotone: increasing
    declared_by_player: true
    player_label: "Vie restante (%)"
    note: |
      La part de votre vie maximum qui vous reste, en pour cent, valable pour
      toute la rotation, soins et régénération compris. La vie maximum vient du
      build : 50, plus 5 par niveau, plus la Vitalité.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "La Nevrose la pose sur sa cible, et la rotation la suppose lancee sur le Zobal lui-meme : il est alors sous Pesanteur. Pivot et Debandade, seuls a l'exiger absente, n'ont aucun effet ici et ne sont jamais lances. ⚠️ S'ils en recoivent un, il faudra compter la Pesanteur de la Nevrose."
  - state: 4106
    name: "Masque Grimacant non invoque et limite atteinte"
    note: "Pose quand le Masque Grimacant est invoque et la limite atteinte. La Grimace n'a aucun effet dans ce calculateur : la rotation ne la lance pas."

