    assumptions:
      - "Compté à son espérance, 19 en normal et 22 en critique : le hasard ne porte que sur la magnitude et ne fait pas brancher l'état, une espérance suffit."
      - "⚠️ CE QUI L'EMPECHAIT etait un garde, et le desaccord est maintenant DECLARE sur la ligne, champ `differs_from_snapshot`. Le motif exact : l'instantane range les trois valeurs du tirage en trois lignes de Feu, l'appariement par element prend la premiere, 16, et toute autre valeur passait pour une contradiction. Le desaccord etait de POSITION, pas de valeur, 19 et 22 etant tous deux dans la donnee. Le garde reste entier pour les 485 autres sorts, et `authored_magnitudes` verifie toujours que ces deux chiffres existent sur ce sort-la."
      - "Compté au plancher, le sort serait lancé deux fois moins souvent qu'il ne devrait : l'erreur porterait sur la rotation, pas sur un chiffre."
      - "Effet 792 : lance aussi « Valet de Cœur », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Tirage uniforme : l'infobulle écrit « 16 dommages Feu (dans 16.7 % des cas) », « 19 » et « 22 » de même, et les critiques « 19 », « 22 », « 25 ». Ni un palier conditionné, ni une zone qui répète : le sort tire sa valeur à chaque lancer, et le coup critique fait monter d'un cran."
      - "Tirage sur trois, et non sur six : un sort ne rate jamais. L'infobulle donne 16,7 % à chacune des six lignes, trois de dégâts et trois de soins : les six lignes sont trois magnitudes vues des deux côtés, les soins sous masque « Allié » et les dégâts sous masque « Ennemi »."
    lines:
      - element: fire
        # L'espérance du tirage, et non son plancher : trois valeurs équiprobables,
        # 16, 19 et 22, de moyenne 19 ; en critique 19, 22 et 25, de moyenne 22.
        differs_from_snapshot: |
          L'instantane range les trois valeurs du tirage en TROIS lignes de Feu,
          16, 19 puis 22. Ce fichier n'en ecrit qu'une, parce que les trois sont
          un seul tirage et non trois frappes, et l'appariement par element prend
          la PREMIERE du vivier. Ecrire l'esperance passait donc pour une
          contradiction, alors que 19 et 22 figurent bel et bien dans la donnee.
          Le desaccord est de POSITION, il est assume, et il ne porte que sur
          cette ligne.
        critical: [22, 22]
        normal: [19, 19]
    effects:
      - effect: gain
        resource: carte_valet_coeur
        at_cap: refresh
      - effect: damage

