# Ecaflip.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: ecaflip
name: { fr: "Ecaflip", en: "Ecaflip" }

resources:
  - id: kraps_critique
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 418, « 28 à 30 Dommages Critiques » pendant trois tours, moyenné
      # comme une fourchette de dégâts. Le critique du sort donne 34 fixes, compté
      # au seuil des valeurs critiques.
      - kind: critical_damage
        amount: 29
        critical_amount: 34

  - id: griffe_joueuse_resistance
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 421, « -31 à -35 Résistances Critiques » sur la cible pendant trois
      # tours : la résistance critique se soustrait du bonus critique du lanceur, en
      # retirer en rend. 42 sur un critique du sort.
      - kind: critical_resistance
        amount: 33
        critical_amount: 42

  - id: yams_critique
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 115, « 3 à 18 % Critique » pendant trois tours : une fourchette, tirée
      # comme un jet de dégâts, moyennée ici à 10. Le critique du sort donne 21
      # fixes, compté au seuil des valeurs critiques.
      - kind: critical_rate
        percent: 10
        critical_percent: 21

  - id: pile_ou_face_critique
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Pas de duree : la donnee porte -1 la ou les autres portent un nombre de
    # tours, ce qui veut dire PERMANENT.
    modifies_damage:
      - kind: critical_rate
        percent: 2

  # Les seize Cartes du Poker d'Ecaflip, une ressource chacune.
  #
  # Un compteur par VALEUR aurait suffi a lire un Carre, et il aurait menti :
  # « Pioche une Dame de Trefle » ne s'applique qu'a qui ne l'a pas deja, la
  # donnee du sort exigeant `e5446`, c'est-a-dire l'ABSENCE de l'etat. Lancer
  # Baraka quatre fois ne fait donc pas quatre Dames. Une carte par ressource,
  # plafonnee a un, dit cela sans effort : le second lancer sature.
  #
  # Les couleurs valent les elements, ce que les seize sorts confirment un a
  # un : Pique = Air, Trefle = Eau, Coeur = Feu, Carreau = Terre.

  - id: carte_valet_pique
    # Une carte en main suffit a porter l'etat Main (5601) qu'exige le Chateau
    # de Cartes.
    game_states: [5601]
    scope: caster
    max: 1
    default: 0
    monotone: none
    note: "Valet de Pique dans la Main."

  - id: carte_valet_trefle
    # Une carte en main suffit a porter l'etat Main (5601) qu'exige le Chateau
    # de Cartes.
    game_states: [5601]
    scope: caster
    max: 1
    default: 0
    monotone: none
    note: "Valet de Trèfle dans la Main."

  - id: carte_valet_coeur
    # Une carte en main suffit a porter l'etat Main (5601) qu'exige le Chateau
    # de Cartes.
    game_states: [5601]
