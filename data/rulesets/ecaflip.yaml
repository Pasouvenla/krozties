  - id: odorat
    dofusdb_id: 12854
    name: { fr: "Odorat", en: "Smell" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    cooldown_turns: 2
    crit: { base_rate: 0, can_crit: false }
    note: |
      Retire immédiatement des PA non esquivables pour augmenter les PM en zone.
      Retire des PM non esquivables pour augmenter les PA au tour suivant.
      Le retrait de PA n'affecte pas le lanceur.
      
      Joue la Main.
    assumptions:
      - "Effets 792/1160 : lance aussi « Joue la Main », « Poker d'Ecaflip », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines: []
    open_questions:
      - "Effet 3793 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 111, +3 PA au tour suivant : le sort les ACHETE avec des PM, « retire des PM non esquivables pour augmenter les PA ». Ce calculateur ne suit pas les PM, donc ne sait pas ce que ca coute."
    effects:
      # « Joue la Main » ou « Defausse la Main » : la Main repart a zero.
      - effect: reset
        resource: carte_valet_pique
