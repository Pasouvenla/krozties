    dofusdb_id: 12842
    name: { fr: "Seconde Chance", en: "Second Chance" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    cooldown_turns: 4
    crit: { base_rate: 0, can_crit: false }
    note: |
