    game_states: [5601]
    scope: caster
    max: 1
    default: 0
    monotone: none
    note: "As de Carreau dans la Main."

  - id: cartes_aleatoires
    # Les cartes tirées au hasard du Poker : le sous-sort 29746, « Pioche
    # Aléatoire », lance l'une des seize cartes, et chacune exige l'absence de
    # son état, si bien qu'une carte déjà en main ne s'ajoute pas. La rotation ne
    # voit pas laquelle : la Rekop compte la moyenne sur tous les tirages. Une
    # carte en main suffit à porter l'état Main (5601).
    game_states: [5601]
    scope: caster
    max: 4
    default: 0
    monotone: none
    random_among: [carte_valet_pique, carte_valet_trefle, carte_valet_coeur, carte_valet_carreau, carte_dame_pique, carte_dame_trefle, carte_dame_coeur, carte_dame_carreau, carte_roi_pique, carte_roi_trefle, carte_roi_coeur, carte_roi_carreau, carte_as_pique, carte_as_trefle, carte_as_coeur, carte_as_carreau]
    note: "Cartes tirées au hasard dans la Main, que la rotation ne voit pas."

  - id: deplacements_forces
    scope: caster
    max: 4
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Attirances, poussées et téléportations faites"
    note: |
      Combien d'attirances, poussées, échanges de position ou téléportations vous
      effectuez dans le tour : la Fanfaronnade monte de 6 dégâts de base par cran,
      quatre au plus (28-32 nu, puis 34-38 à un cran, jusqu'à 52-56 à quatre). Le
      sort remet ce compteur à zéro en partant, et il revient à votre valeur au
      tour suivant.

  - id: infortune
    # Sans `dofusdb_source` : ses chiffres sont la SECONDE ligne de son sort,
    # que l'appariement par position confondrait avec la premiere. Le
    # controle des magnitudes le rattache au sort de meme identifiant.
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          # Sous-sort 29964, grade 2 : 31-33, critique 38, au taux de 20 % du
          # sort lui-meme.
          - element: water
            critical: [38, 38]
            normal: [31, 33]
    note: |
      L'état Infortune (5613), durée 1 : la cible prend 31-33 Eau à la fin de son
      tour si elle n'a pas fait de coup critique pendant ce tour. La rotation
      suppose une cible passive : elle ne critique jamais, et le coup part à
      chaque lancer. « Fin de tour de la cible » tombe au même endroit que le
      début du nôtre pour une recherche par tours.

costly:
  - id: main_de_poker
    name: { fr: "Main de poker", en: "Poker hand" }
    resources: [carte_valet_pique, carte_valet_trefle, carte_valet_coeur, carte_valet_carreau,
                carte_dame_pique, carte_dame_trefle, carte_dame_coeur, carte_dame_carreau,
                carte_roi_pique, carte_roi_trefle, carte_roi_coeur, carte_roi_carreau,
                carte_as_pique, carte_as_trefle, carte_as_coeur, carte_as_carreau,
                cartes_aleatoires]
    note: |
      Les seize cartes que la Rekop consomme par combinaisons, et les cartes
      tirées au hasard. Sur un deck ordinaire, le solveur ne réunit jamais quatre
      cartes de même valeur : elles comptent pour un deck bâti autour des
      pioches.


tier_states:
  - group: main_gagnante
    game_states: [5554]
    note: |
      « Main Gagnante » (5554), que la Rekop exige pour etre lancee. Le jeu la
      pose par le sous-sort « Main d'Ecaflip » (29703) quand la Main reunit
      l'une de vingt et une combinaisons, et ce sont exactement les vingt et un
      paliers de ce groupe : l'etat se lit donc sur eux.

      Sans la Main de poker cochee, les cartes valent toujours zero, aucun
      palier ne tient et la Rekop ne se lance pas, ce qu'elle ne faisait de
      toute facon que pour zero degat.

