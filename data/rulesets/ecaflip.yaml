      - "Effet 414 non modélisé : les 100 Dommages Poussée que la roulette peut tirer, au hasard comme ses autres effets."
      - "Effet 160 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 161 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 178 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 410 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 412 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 418, valeur 75 : des Dommages Critiques, que le moteur ne sait pas encore porter sur une ressource. Peu importe ici, ce sort tirant son effet au hasard parmi treize, comme dit juste au-dessus."
      - "Effet 752 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 753 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 111, +2 PA : c'est le REMBOURSEMENT du cout du sort, « le cout en PA du sort est rembourse », et non des PA qui durent. Le sort ne fait rien d'autre qu'un effet ALEATOIRE sur tout le monde, que rien ne modelise : ecrire le remboursement seul donnerait un lancer gratuit qui n'apporte rien et grossirait la recherche."
      - "Effet 115, valeur 50, et douze autres effets a cote : ce sort « applique un effet ALEATOIRE sur tout le monde », et aucun de ses effets n'est donc acquis. Les compter serait supposer le tirage favorable ; les compter tous serait pire. C'est le meme obstacle que la Tromperie, un tirage que ce calculateur ne modelise pas."
    effects: []

  - id: pile_ou_face
    dofusdb_id: 12841
    name: { fr: "Pile ou Face", en: "Heads or Tails" }
    ap_cost: { base: 2 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Terre.
      
      Sur le lanceur : applique aléatoirement l'état Pile ou l'état Face et lui rend 1 PA.
      • Pile : donne 1 PA.
      • Face : donne 1 PM.
      • Relancer le sort dans un état permet de s'appliquer l'autre.
      
      Pioche un Valet de Carreau.
    assumptions:
      - "Effets 792/1160 : lance aussi « Pile ou Face », « Valet de Carreau », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
      - "Les états « Pile » (5597) et « Face » (5598) ne changent AUCUN dégât. Les quatre sorts qui les lisent, Destin d'Ecaflip, Esprit Félin, Lapement et Mésaventure, s'en servent pour retirer l'aléatoire d'un déplacement ou d'un retrait de PA, jamais d'une fourchette : « Pile : l'aléatoire est supprimé pour téléporter la cible »."
      - "Effet 111, le PA rendu : le sort applique Pile OU Face au hasard, et seul Pile rend le PA. Non compté, par cohérence avec le vol de PA du Xélor, supposé ne pas aboutir plutôt que supposé réussir. Le relancer sous un état donne l'autre, si bien que deux lancers donnent le PA à coup sûr : un Ecaflip qui enchaîne vaut donc un peu plus que ce qui s'affiche."
      - "Effet 115, +2 % de Critique permanent sur le lanceur : la donnée porte -1 en durée, là où les autres portent un nombre de tours."
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    effects:
      - effect: gain
        resource: carte_valet_carreau
        at_cap: refresh
      - effect: damage
      - effect: gain
        resource: pile_ou_face_critique

