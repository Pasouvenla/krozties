      - "La réduction de durée des effets n'est pas modélisée : aucun buff ennemi n'est simulé, et les états posés ici vivent leur durée déclarée."
    lines: []
    open_questions:
      - "Effet 112 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 118 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
      - "Effet 119 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
