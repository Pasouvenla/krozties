  - id: rekop
    dofusdb_id: 12853
    name: { fr: "Rekop", en: "Rekop" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Utilise la Main Gagnante pour occasionner des dommages :
      • Carrés ou Suite Royale Couleurs : dommages dans tous les éléments.
      • Suite Royale d'une Couleur : dommages dans l'élément de la Couleur par Carte.
      • Suite Royale : dommages dans le meilleur élément.
      • Paires : dommages dans le meilleur élément par Paires.
      • Brelans : dommages dans le meilleur élément par Carte du Brelan.
      
      Défausse la Main.
    assumptions:
      - "L'ordre de priorité est celui de l'infobulle : le Carré Couleurs passe devant le Brelan de Valets. Sur les 1820 Mains de quatre cartes, c'est le seul endroit où les deux ordres divergent : douze Mains, trois Valets plus une carte d'une autre valeur avec les quatre couleurs différentes, valent 32 au lieu de 24."
      - "La Main ne part pas toute seule : la Rekop se lance à l'initiative du joueur et consomme la Main entière d'un coup, un sort qu'on choisit de lancer et qui remet les seize compteurs à zéro."
      - "Ce calculateur ne sait pas plafonner une somme de compteurs, donc rien ne l'empêche de piocher plus de quatre cartes. Chaque combinaison exigeant un total exact, ces états-là ne rapportent rien et le solveur les évite : sur un deck de quatre pioches de Dames, il en pioche exactement quatre."
      - "« Etre dans l'etat Main Gagnante » : le jeu INTERDIT de lancer la Rekop sans combinaison, la ou ce calculateur l'autorise pour zero degat. La difference ne change aucun chiffre, un solveur ne gaspillant pas 4 PA pour rien, mais elle explique pourquoi le sort ne porte aucune ligne inconditionnelle."
      - "Les vingt et une combinaisons sont vérifiées une à une contre l'infobulle en jeu : valeur et nombre de lignes, en coup normal comme en critique. La liste des effets, lue dans l'ordre avec les tailles que le texte du sort impose, quatre par Carré, trois par Brelan, deux par Paires, les met toutes en place."
      - "Paires de Valets et de Dames frappe 15 en coup normal et 11 en coup critique, seul cas du sort où le critique tape moins fort : vérifié sur l'infobulle en jeu, une bizarrerie du jeu et non une faute de la donnée."
      - "Effets 792/1160 : lance aussi « Défausse la Main », « Main d'Ecaflip », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les pioches aléatoires se comptent en moyenne : Bonne Pioche, Redistribution, Neuf Vies et Bonne Étoile tirent des cartes du Poker, uniformément parmi les seize, une carte déjà en main ne s'ajoutant pas (chaque carte exige l'absence de son état). La Rekop compte la moyenne de ce que la Main fait sur tous les tirages, et la rotation choisit ses lancers sans voir la carte tirée : un plancher de ce que fait un joueur qui la voit. Une défausse de couleur (Belote, Blakjak, Baraka, Jass) défausse aussi les cartes tirées, autre plancher : une carte tirée n'est de sa couleur qu'une fois sur quatre. Quatre cartes tirées au plus. Hors du compte : la carte de la Tromperie, qui dépend de l'élément tiré, et la pioche du Château de Cartes, qui ne tire que sans Main."
