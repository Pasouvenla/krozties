# Ouginak.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.
#
# La Rage : la donnée porte son plafond, deux crans, mais pas son incrément ;
# un cran par lancer est une hypothèse déclarée. Modélisés : la Proie, le +7 %
# de Gibier, le +15 % de l'Acharnement, les cumuls d'Os à Moelle et de
# Carcasse, la Puissance d'Arcanin, la Rage et la Forme Bestiale.

schema_version: 1
game_version: "3.6.12"
class: ouginak
name: { fr: "Ouginak", en: "Ouginak" }

resources:
  - id: rogne_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 13803
    modifies_damage:
      - kind: characteristic
        amount: 80
      # Effet 414 : 40 Dommages Poussée.
      - kind: push_damage
        amount: 40
    note: |
      La Puissance que la Rogne accorde, pour deux tours, avec ses Dommages
      Poussée : « Augmente la Puissance, les Dommages Poussée et le Tacle de
      l'allié ciblé », effet 138 à 80 sur la cible « a » ; le lanceur peut se
      cibler lui-même, la portée minimale du sort étant de zéro. Le Tacle (753)
      n'est pas compté.

      La seconde moitié du sort n'est pas écrite : « augmente ces mêmes
      caractéristiques sur le lanceur si la cible subit des dommages (cumulable 5
      fois) », un second jeu à 30/20/10 qui demande que la cible encaisse, ce que
      ce calculateur ne simule pas.
  - id: battue
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 138, valeur 150, duree 2 : de la Puissance, donc DANS l'arrondi
      # caracteristique, au meme etage que celle du stuff. Elle profite a TOUS
      # les sorts du tour, pas seulement a la Battue.
      - kind: characteristic
        amount: 150
    note: |
      « Augmente la Puissance du lanceur et des allies en zone. » La moitie du
      lanceur est inconditionnelle : le sort la donne en frappant, sans rien
      demander au placement. Celle des allies ne compte pas ici, ce calculateur
      resolvant une rotation a un seul lanceur.

  - id: proie
    scope: target
    max: 1
    default: 0
    monotone: increasing
    note: |
      L'etat Proie, que posent Proie et Gibier, deux variantes du meme sort a
      1 PA. Effet 950 sur l'etat 516, duree -1 : il ne s'efface pas tout seul.

      C'est le pivot de la classe. Onze sorts a degats en dependent, la plupart
      pour un effet secondaire de placement dont ce solveur ne fait rien, mais
      Os a Moelle et Carcasse en tirent un vrai cumul de degats. Le marquer coute
      1 PA une fois, et rien ensuite.

  - id: gibier
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Le tour du lancer seulement : effet 1163 à durée 0, comme le Bond du Iop.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163, parametre 107 : les dommages subis par la cible sont
      # multiplies par 1,07. Meme etage qu'un bonus de Dofus.
      - kind: final_multiplier
        percent: 107
    note: |
      Ce que Gibier ajoute par rapport a Proie, sa variante : +7 % de dommages
      subis par la cible, en plus de l'etat. Une ressource a part et non une
      propriete de `proie`, justement parce que Proie ne le donne pas.

  - id: acharnement
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Le tour du lancer seulement : effet 1163 à durée 0, comme le Bond du Iop.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163, parametre 115, sur la cible en etat 516.
      - kind: final_multiplier
        percent: 115
    note: |
      « Si l'ennemi est la Proie : augmente egalement les dommages subis par la
      cible. » Effet 1163 a 115, cible `A,E516`, donc +15 % conditionne a la
      Proie. Le reste du sort est du placement.

  - id: rage
    # Rage Ouginak (515), qu'exigent Flair, Arcanin, Caninos, et Apaisement ou
    # Affection a defaut de la Forme Bestiale.
    game_states: [515]
    scope: caster
    max: 2
    default: 0
    monotone: none
    note: |
      La Rage : onze sorts à dégâts disent « Augmente la Rage » et cinq sorts
      utilitaires « nécessite et diminue la Rage » ; un seul de ces cinq pèse sur
      les dégâts, l'Arcanin, 100 Puissance pour 1 PA.

      Plafond de deux, lu dans la donnée : l'effet 792 porte « état, plafond »,
      ce qui se vérifie sur Os à Moelle (état 13761, 4) et Carcasse (13767, 4),
      dont le « Cumul » vaut 4 ; les onze sorts à Rage le portent sur l'état 24128
      avec 2. Deux crans, ce que confirme la fiche du Cerbère, qui distingue
      « Lanceur sous Rage » et « Lanceur sous Raage ».

      Le gain par lancer est une hypothèse : la donnée porte le plafond, pas
      l'incrément, et un par lancer est la seule lecture qui rende les deux crans
      atteignables.

      Il n'y a pas de troisième cran : le sous-sort « La Rage d'Ouginak » (13745),
      grade 1, fait passer de rien à Rage 1 (états 513 et 515), de Rage 1 à Rage 2
      (514), et de Rage 2 à la Forme Bestiale (sous-sort 13746), en retirant 513,
      514 et 515. Sous Forme Bestiale, aucun cran ne se gagne (masque « e517 »).
      Le grade 2, celui de l'Arcanin, du Caninos et de l'Apaisement, retire un
      cran. D'où `monotone: none` : un cran de plus peut coûter la Rage entière.

  - id: arcanin
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 138, parametre 100, duree 3 : de la Puissance, qui entre dans
      # l'arrondi caracteristique comme celle du stuff.
      - kind: characteristic
        amount: 100
    note: |
      +100 Puissance pendant trois tours pour 1 PA, cumulable deux fois, donc 200
      à deux crans (effet 138, « Cumul : 2 »). Le sort consomme un cran de Rage,
      qu'il faut avoir accumulé.

  - id: os_a_moelle_cumul
    scope: caster
    max: 4
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    note: |
      « Les dommages du sort sont augmentés après chaque lancer si la cible est la
      Proie » : effet 293, valeur 6, durée 3, sur le lanceur. Plafond de quatre :
      21-24, 27-30, 33-36, 39-42, 45-48, six de plus à chaque cran.

  - id: vertebre
    scope: target
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          # Deux Vertebres, deux poisons qui tombent chacun : la ligne se
          # repete une fois par cran.
          - element: water
            critical: [38, 43]
            normal: [32, 36]
            repeats_per: [vertebre]
        note: |
          Le poison, qui tombe au debut du tour de la cible. Deux tours de
          duree, donc deux tics.
    note: |
      Cumul 2 : deux Vertèbres font deux poisons qui tombent chacun, la ligne du
      poison se répétant une fois par cran ; un seul lancer par cible, à relancer
      chaque tour pour cumuler. Approximation déclarée : un seul compte à rebours
      pour les deux poisons, que la relance remet à deux tours.

      « Applique un poison Eau de début de tour sur l'ennemi ciblé. » Le sort ne
      frappe pas immédiatement : ses 32-36 sont ceux du poison, « Début de tour »,
      durée 2.

  - id: carcasse_cumul
    scope: caster
    max: 4
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Plafond de quatre : 9-11, 15-17, 21-23, 27-29, 33-35, six de plus à chaque
      cran.

  - id: ennemis_au_contact
    scope: caster
    max: 4
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Ennemis au contact du lanceur"
    note: |
      Combien d'ennemis sont collés à vous, à ne pas confondre avec « Ennemis
      touchés », qui compte ceux de la zone du sort. La Muselière monte de 22
      dégâts de base par ennemi au contact, quatre au plus (37-41 nu, puis 59-63 à
      un ennemi, jusqu'à 125-129 à quatre).

  - id: forme_bestiale
    # Forme Bestiale (517) : Pelage Protecteur, Ferocite et Nouvelle Lune
    # l'exigent absente, Apaisement et Affection s'en contentent sans Rage.
    game_states: [517]
    scope: caster
    max: 1
    default: 0
    monotone: none
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1171 a 20, « #1 % Dommages finaux », duree 2.
      - kind: final_multiplier
        percent: 120
        # Effet 1171, « % Dommages finaux » : ils s'additionnent à ceux des
        # Dofus et de l'équipement.
        finaux: true
    note: |
      Le sous-sort « Bestialité Ouginak » (13746), lancé au troisième cran de
      Rage : état 517 et +20 % de dommages finaux, pour le tour de son
      déclenchement et le suivant (voir `DurationDef::turns`). Non comptés : +2
      PM, les états Intaclable et Affaibli, et la portée maximale de dix-huit
      sorts fixée à 2 (effet 2905). Le sous-sort 13747, lancé au tour suivant,
      n'est pas lu non plus.


states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "L'Acharnement la pose sur l'ennemi cible, pas sur le lanceur."

spells:

  - id: proie
    dofusdb_id: 13748
    name: { fr: "Proie", en: "Prey" }
    ap_cost: { base: 1 }
    casts_per_turn: 1
    cooldown_turns: 1
    crit: { base_rate: 0, can_crit: false }
    note: |
      Applique l'état Proie sur l'ennemi ciblé.
      Les entités qui attaquent la cible sont soignées d'une partie des dommages occasionnés.
      
      Fixe le temps de relance du sort à 0 si la Proie est achevée.
    lines: []
    assumptions:
      - "Effet 1160 : lance aussi « Proie », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Pose l'état Proie sur la cible, sans limite de durée (effet 950 sur l'état 516, durée -1). Le marquer coûte 1 PA une fois et conditionne onze sorts de la classe."
      - "Le soin rendu aux entités qui attaquent la Proie n'est pas modélisé : ce calculateur ne simule ni les alliés ni les soins."
    open_questions:
      - "Effets 950/951 : ce sort applique « Proie » (516), lu par Aboi, Acharnement, Appel de la Meute, Calcanéus, Carcasse, Chasse et 12 autre(s). Ces etats-la portent une mecanique que ce calculateur n'ecrit pas encore : chacun demande une decision de modelisation."
    effects:
      - effect: gain
        resource: proie


  - id: flair
    dofusdb_id: 13749
    name: { fr: "Flair", en: "Sniff" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    cooldown_turns: 2
    requires: { kind: caster_has, resource: rage }
    crit: { base_rate: 0, can_crit: false }
    note: |
      Téléporte le lanceur sur la première case disponible au contact de la Proie.
      
      Si la Proie est dans la zone d'effet : téléporte le lanceur sur la case ciblée.
      
      Nécessite et diminue la Rage.
    assumptions:
      - "Effets 950/951 : ce sort retire « Flair » (496). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "Effets 1160/2794 : lance aussi « - 1 Rage », « Flair », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Ce sort exige et dépense un cran de Rage, accumulé par les onze sorts qui l'augmentent."
      - "Les déplacements de ce sort, téléportation, attirance ou poussée, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
    lines: []
    effects:
      - effect: consume
        resource: rage


  - id: tetanisation
    dofusdb_id: 13753
    name: { fr: "Tétanisation", en: "Tetanisation" }
    ap_cost: { base: 4 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Feu et retire des PM.
      
      Augmente la Rage (nécessite une cible).
    assumptions:
      - "\"Effets 792/1160 : ce sort fait attaquer les invocations du lanceur, « Accrocs » et ce qu'il lance à son tour sur « a,A » : Neutre 6-7 en vol de vie, Neutre 15-16 en vol de vie, Neutre 9-10 en vol de vie, Neutre 25-26 en vol de vie, Neutre 12-13 en vol de vie, Neutre 30-31 en vol de vie. Ces dégâts ne sont pas comptés : ils dépendent de qui est invoqué, de sa portée et de sa ligne de vue au moment du lancer. Le chiffre affiché est celui de la ligne propre du sort.\""
      - "Effets 792/1160 : lance aussi « +1 Rage », « La Rage d'Ouginak », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Ce sort accumule un cran de Rage. La Rage plafonne à deux et se dépense dans l'Arcanin, qui donne 100 Puissance par cran. ⚠️ Le gain d'un cran par lancer est une hypothèse : la donnée porte le plafond, pas l'incrément."
    lines:
      - element: fire
        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      # « La Rage d'Ouginak » (13745, grade 1) : un cran de plus, et a
      # Rage 2 la Forme Bestiale, qui remet la Rage a zero.
      - effect: gain
        resource: forme_bestiale
        requires: { kind: exactly, resource: rage, amount: 2 }
      - effect: reset
        resource: rage
        requires: { kind: caster_has, resource: forme_bestiale }
      - effect: gain
        resource: rage
        requires: { kind: exactly, resource: forme_bestiale, amount: 0 }


  - id: rabattage
    dofusdb_id: 13754
    name: { fr: "Rabattage", en: "Tally Ho" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Vole de la vie dans l'élément Feu.
      Vole des PM avant d'appliquer les effets si la cible est la Proie.
    assumptions:
      - "\"Effet 1160 : ce sort fait attaquer les invocations du lanceur, « Accrocs » et ce qu'il lance à son tour sur « a,A » : Neutre 6-7 en vol de vie, Neutre 15-16 en vol de vie, Neutre 9-10 en vol de vie, Neutre 25-26 en vol de vie, Neutre 12-13 en vol de vie, Neutre 30-31 en vol de vie. Ces dégâts ne sont pas comptés : ils dépendent de qui est invoqué, de sa portée et de sa ligne de vue au moment du lancer. Le chiffre affiché est celui de la ligne propre du sort.\""
      - "Le vol de vie est compté comme des dégâts : le soin rendu au lanceur ne pèse pas sur une recherche de dégâts."
    lines:
      - element: fire
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: traque
    dofusdb_id: 13755
    name: { fr: "Traque", en: "Tracking" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Feu.
      Rapproche le lanceur vers la cible avant d'appliquer les effets si c'est la Proie.
      
      Le sort n'est pas soumis aux contraintes de lancer sous Forme Bestiale.
    assumptions:
      - "\"Effet 1160 : ce sort fait attaquer les invocations du lanceur, « Accrocs » et ce qu'il lance à son tour sur « a,A » : Neutre 6-7 en vol de vie, Neutre 15-16 en vol de vie, Neutre 9-10 en vol de vie, Neutre 25-26 en vol de vie, Neutre 12-13 en vol de vie, Neutre 30-31 en vol de vie. Ces dégâts ne sont pas comptés : ils dépendent de qui est invoqué, de sa portée et de sa ligne de vue au moment du lancer. Le chiffre affiché est celui de la ligne propre du sort.\""
      - "Les déplacements de ce sort, téléportation, attirance ou poussée, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
    lines:
      - element: fire
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: molosse
    dofusdb_id: 13756
    name: { fr: "Molosse", en: "Watchdog" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Terre aux ennemis et réduit les dommages subis par le lanceur.
      
      Augmente la Rage (nécessite une cible).
    assumptions:
      - "\"Effets 792/1160 : ce sort fait attaquer les invocations du lanceur, « Accrocs » et ce qu'il lance à son tour sur « A » : Neutre 6-7 en vol de vie, Neutre 15-16 en vol de vie, Neutre 9-10 en vol de vie, Neutre 25-26 en vol de vie, Neutre 12-13 en vol de vie, Neutre 30-31 en vol de vie. Ces dégâts ne sont pas comptés : ils dépendent de qui est invoqué, de sa portée et de sa ligne de vue au moment du lancer. Le chiffre affiché est celui de la ligne propre du sort.\""
      - "Effets 792/1160 : lance aussi « +1 Rage », « La Rage d'Ouginak », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Ce sort accumule un cran de Rage. La Rage plafonne à deux et se dépense dans l'Arcanin, qui donne 100 Puissance par cran. ⚠️ Le gain d'un cran par lancer est une hypothèse : la donnée porte le plafond, pas l'incrément."
      - "Effet 1163 à 90, « réduit les dommages subis par le LANCEUR » : c'est un multiplicateur sur ce que le Ouginak ENCAISSE, pas sur ce qu'il inflige. Rien n'en dépend ici, ce calculateur ne comptant que les dégâts portés. Noté parce qu'un multiplicateur inférieur à 100 ressemble, de loin, à une vulnérabilité oubliée."
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      # « La Rage d'Ouginak » (13745, grade 1) : un cran de plus, et a
      # Rage 2 la Forme Bestiale, qui remet la Rage a zero.
      - effect: gain
        resource: forme_bestiale
        requires: { kind: exactly, resource: rage, amount: 2 }
      - effect: reset
        resource: rage
        requires: { kind: caster_has, resource: forme_bestiale }
      - effect: gain
        resource: rage
        requires: { kind: exactly, resource: forme_bestiale, amount: 0 }


  - id: dogue
    dofusdb_id: 13757
    name: { fr: "Dogue", en: "Mastiff" }
    ap_cost: { base: 2 }
    casts_per_turn: 4
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Vole de la vie dans l'élément Terre.
      Retire de la Fuite si la cible est la Proie.
    assumptions:
      - "\"Effet 1160 : ce sort fait attaquer les invocations du lanceur, « Accrocs » et ce qu'il lance à son tour sur « a,A » : Neutre 6-7 en vol de vie, Neutre 15-16 en vol de vie, Neutre 9-10 en vol de vie, Neutre 25-26 en vol de vie, Neutre 12-13 en vol de vie, Neutre 30-31 en vol de vie. Ces dégâts ne sont pas comptés : ils dépendent de qui est invoqué, de sa portée et de sa ligne de vue au moment du lancer. Le chiffre affiché est celui de la ligne propre du sort.\""
      - "Le vol de vie est compté comme des dégâts : le soin rendu au lanceur ne pèse pas sur une recherche de dégâts."
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: cerbere
    dofusdb_id: 13758
    name: { fr: "Cerbère", en: "Cerberus" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Applique un bouclier sur le lanceur et occasionne des dommages Terre aux ennemis en zone.
      Les dommages du sort sont plus importants selon la Rage du lanceur et le bouclier n'est pas appliqué sous Forme Bestiale.
    assumptions:
      - "Effet 2160 : le sort REBONDIT sur une autre entite, « Accrocs » et ce qu'il lance a son tour sur « A » : Neutre 6-7 en vol de vie, Neutre 15-16 en vol de vie, Neutre 9-10 en vol de vie, Neutre 25-26 en vol de vie, Neutre 12-13 en vol de vie, Neutre 30-31 en vol de vie. Le rebond frappe l'entite la plus proche AUTRE que celle visee : sur une cible unique il n'a rien a toucher et n'ajoute rien, le chiffre affiche est donc exact. C'est le reglage « Ennemis touches » qui le fait compter, un rebond valant une cible de plus."
      - "Effets 1160/2160 : lance aussi « <color=#e6893d>Aucune Rage :</color> », « <color=#e6893d>Forme Bestiale :</color> », « <color=#e6893d>Raage :</color> », « <color=#e6893d>Rage :</color> », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les dégâts montent avec la Rage, et les trois crans changent de largeur : 15-18 sans Rage, 21-25 sous Rage, puis deux lignes de 15-18 sous Raage, soit trois, quatre et six points d'amplitude. Un bonus de dégâts de base décale une fourchette sans l'élargir : une ligne par cran."
      - "Deux Rage valent deux lignes de 15-18, soit 30-36 de dégâts de base."
      - "La Forme Bestiale, qui remplace ces paliers par trois lignes de 13-14, n'est pas modélisée : rien ici ne déclenche la transformation."
      - "Le bouclier posé sur le lanceur n'est pas modélisé : ce calculateur maximise les dégâts infligés."
    # Une ligne par cran de Rage. Le troisième en compte DEUX, parce que le jeu
    # frappe deux fois sous Raage : l'écrire 30-36 d'un bloc dirait le bon total
    # en inventant une fourchette qu'aucune des deux sources ne porte.
    lines:
      - element: earth
        active_at: { resource: rage, exactly: 0 }
        critical: [19, 23]
        normal: [15, 18]
      - element: earth
        active_at: { resource: rage, exactly: 1 }
        critical: [26, 30]
        normal: [21, 25]
      - element: earth
        active_at: { resource: rage, exactly: 2 }
        critical: [19, 22]
        normal: [15, 18]
      - element: earth
        active_at: { resource: rage, exactly: 2 }
        critical: [19, 22]
        normal: [15, 18]
    effects:
      - effect: damage

  - id: cubitus
    dofusdb_id: 13760
    name: { fr: "Cubitus", en: "Ulna" }
    ap_cost: { base: 2 }
    casts_per_turn: 4
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Vole de la vie dans l'élément Eau.
      Donne 1 PM au lanceur si la cible est la Proie.
      
