  - id: prelude_au_fer
    dofusdb_id: 23841
    name: { fr: "Prélude au Fer", en: "Iron Prelude" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    cooldown_turns: 2
    crit: { base_rate: 0, can_crit: false }
    note: |
      Réduit la durée des effets sur les ennemis et augmente la Puissance des alliés en zone.
      
      Le sort ne peut se lancer que sur la Lance si le lanceur est Désarmé.
    assumptions:
      - "Désarmé, le sort se lance sur la Lance et donne sa Puissance aux alliés qui l'entourent : le lanceur, supposé loin d'elle, n'en reçoit rien (masque « a,*E3360 » de l'effet 138). Au contact aussi, faute de savoir où se tient la Lance."
      - "Effets 792/1160/2960 : lance aussi « Prélude au Fer », « Reprise de Volée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "La réduction de durée des effets n'est pas modélisée : aucun buff ennemi n'est simulé, et les états posés ici vivent leur durée déclarée."
      - "Effet 138, +200 Puissance au lanceur pendant deux tours, sur l'état `prelude_au_fer_puissance` : la cible de l'effet est « a », les alliés, et le lanceur se compte parmi eux. Les alliés, eux, ne sont pas mesurés ici."
      - "Ce sort n'est jamais interdit, il change de cible : armé, il frappe autour du lanceur (état 3360) ; désarmé, depuis la Lance (état 3361, cible « a,P,F7139 »), avec les mêmes fourchettes. Le chiffre affiché est donc juste dans les deux cas. À distance, le mode armé frappe autour d'un lanceur que personne n'entoure, et il exige donc la Lance plantée ; ce que ce calculateur ne tient pas, c'est où la Lance se trouve, donc si l'ennemi est dans son axe."
    lines: []
    effects:
