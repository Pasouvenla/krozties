      - "\"Effets 792/1160/2960 : ce sort a deux modes de lancer, autour du lanceur ou depuis la Lance, « Pluie d'Airain » sur « a,A,*E3360 » : Air 19-21; « Pluie d'Airain » sur « a,P,F7139,*E3361,*e3589 » : Air 19-21. Ils ne se cumulent pas : « les dommages de zone ne sont appliqués qu'une seule fois par lancer », et lancer sur la Lance ne frappe jamais autour du lanceur. Confirmé en jeu. Une seule ligne est donc comptée, celle du mode le plus fort.\""
      - "Effets 792/1160/2960 : lance aussi « Reprise de Volée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Ce sort n'est jamais interdit, il change de cible : armé, il frappe autour du lanceur (état 3360) ; désarmé, depuis la Lance (état 3361, cible « a,P,F7139 »), avec les mêmes fourchettes. Le chiffre affiché est donc juste dans les deux cas. À distance, le mode armé frappe autour d'un lanceur que personne n'entoure, et il exige donc la Lance plantée ; ce que ce calculateur ne tient pas, c'est où la Lance se trouve, donc si l'ennemi est dans son axe."
