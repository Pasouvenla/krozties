# Forgelance.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: forgelance
name: { fr: "Forgelance", en: "Forgelance" }

resources:
  - id: lance
    # Desarme (3361) tant que la Lance est plantee, Arme (3360) sinon : quinze
    # sorts exigent Arme, le Muspel exige Desarme (condition de la donnee).
    game_states: [3361]
    game_states_when_zero: [3360]
    scope: caster
    max: 1
    default: 0
    monotone: none
    note: |
      La Lance est-elle plantée ? C'est l'état qui commande toute la classe : onze
      sorts l'invoquent, dix-huit la rappellent, quatorze exigent qu'elle soit
      posée. Le Jormun frappe « en zone jusqu'à la Lance » quand elle est posée, et
      « autour du lanceur » sinon : un tout autre sort.

      `monotone: none` et non `increasing` : porter la Lance n'est pas toujours
      mieux, et dix-huit sorts la rappellent.

      Cet état ne dit pas où la Lance se trouve : un sort qui exige de viser sa
      case demande en plus que l'ennemi s'y prête. La contrainte d'ordre est
      tenue, la contrainte de placement ne l'est pas.

  - id: incendie
    scope: caster
    max: 4
    default: 0
    monotone: increasing
    note: |
      « Les dommages du sort sont augmentés après chaque lancer. » La Lance à
      Incendie se charge elle-même, cumul 4 : cinq paliers, 18-21, 23-26, 28-31,
      33-36, 38-41, cinq de plus à chaque cran, la valeur de l'effet 293 au dernier
      grade.


  - id: vulnerabilite_fer_rouge
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Zéro tour veut dire « le tour de la pose, et lui seul » : la vulnérabilité
    # tient jusqu'au début du prochain tour du lanceur, qui n'en profite que dans
    # le même tour d'actions.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163, « Dommages subis x107 % » : un multiplicateur, donc tout a
      # la fin du pipeline.
      - kind: final_multiplier
        percent: 107
    note: |
      La vulnerabilite que Fer Rouge pose sur sa cible. Tout ce qui tombe ensuite
      sur elle dans le meme tour est multiplie par 1.07.

  - id: prelude_au_fer_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Effet 138, duree 2 dans l'instantane, copiee telle quelle.
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 23841
    modifies_damage:
      # Effet 138, `dice_num` a 200 au grade 3, celui que ce parc lit partout.
      # Deux cents points de PUISSANCE, qui entrent dans le meme facteur que la
      # caracteristique : `100 + carac + puissance`.
      - kind: characteristic
        amount: 200
    note: |
      La Puissance que le Prélude au Fer accorde au lanceur pour deux tours : la
      cible de l'effet est « a », les alliés, et le lanceur se compte parmi eux.
      Les alliés reçoivent les mêmes deux cents points en jeu ; ce calculateur ne
      mesure que les dégâts du lanceur.

  - id: terre_du_milieu_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Effet 138, duree 2 dans l'instantane, copiee telle quelle : les Tirs
    # Puissants du Cra portent le meme effet a duree 1 et le fichier ecrit 1.
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 23738
    modifies_damage:
      # Effet 138, `dice_num` a 50 : cinquante points de PUISSANCE. La formule
      # les additionne a la caracteristique dans le meme facteur,
      # `100 + carac + puissance`, et le parc les ecrit donc ici, comme les 250
      # des Tirs Puissants.
      - kind: characteristic
        amount: 50
        # Cinquante par ennemi touché, quatre fois au plus : « Augmente la
        # Puissance du lanceur pour chaque ennemi dans la zone d'effet », effet 138
        # `dice_num` 50 sur la cible « C », le lanceur. Le plafond vient de
        # `maxStack`.
        per_target: true
        per_target_cap: 4
    note: |
      La Puissance que la Terre du Milieu accorde au lanceur pour deux tours :
      cinquante par ennemi touché, quatre fois au plus, soit deux cents points. Le
      plafond vient de `maxStack` ; sans lui, huit ennemis rendraient quatre cents
      points que le jeu ne donne pas.

      Ce compteur suppose que les ennemis annoncés au scénario sont tous dans la
      zone du sort : en annoncer quatre dont la Terre du Milieu n'attrape que deux
      gonfle le chiffre. Une limite acceptée.

  - id: poussee_subie
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "La cible subit des dommages de poussée à chaque tour"
    note: |
      À cocher si vous poussez la cible contre un obstacle à chaque tour : elle
      subit des dommages de poussée sans bouger, ce que le Noa exploite.

  - id: noa
    # Sans `dofusdb_source` : ses chiffres sont la SECONDE ligne de son sort,
    # que l'appariement par position confondrait avec la premiere. Le
    # controle des magnitudes le rattache au sort de meme identifiant.
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      # La poussee d'un autre, entre deux tours : seulement si le joueur la
      # declare.
      - trigger: turn_start
        requires: { kind: caster_has, resource: poussee_subie }
        lines:
          # Sous-sort 32503, au taux de critique du sort, 25 %.
          - element: air
            # Toutes les cibles touchées portent l'état, et chacune le
            # déclenche seule, une fois, quand elle subit des dommages de
            # poussée : la zone est celle où l'état se pose, le carré de neuf
            # cases de l'effet 950, et non celle du coup sur un porteur.
            area: { shape: G, size: 1, max_targets: 9 }
            critical: [31, 35]
            normal: [26, 29]
      # La poussée des sorts du Forgelance lui-même, quand le joueur coche
      # « Vos poussées butent contre un obstacle ».
      - trigger: push_damage
        lines:
          - element: air
            area: { shape: G, size: 1, max_targets: 9 }
            critical: [31, 35]
            normal: [26, 29]
    note: |
      L'état Noa : 26-29 Air quand la cible subit des dommages de poussée, puis il
      se retire ; il ne revient qu'avec le Noa suivant. Il se pose sur toutes les
      cibles touchées, et chacune le déclenche de son côté.

      Deux poussées le consomment. Celle d'un sort du Forgelance, dans le tour, si
      ses poussées butent contre un obstacle. Et celle que le joueur déclare subie
      par la cible à chaque tour, comptée une fois au début du tour suivant si
      l'état est encore là.

      26-29, 31-35 en critique, au rang 2, confirmé en jeu : les 28-31 du
      sous-sort 32503 de la donnée ne sont pas ceux du jeu.

  - id: eclipse_en_cours
    # Eclipse (3735), que vingt-cinq sorts exigent absente.
    game_states: [3735]
    scope: caster
    max: 1
    default: 0
    monotone: none
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      L'état que l'Éclipse pose sur le lanceur (sous-sort 24584, effet 950, durée
      1) : vingt-cinq sorts ne se lancent pas tant qu'il dure, dont tous ceux qui
      partent de la Lance. Le tour du lancer seulement, comme le veut la règle des
      durées : l'Éclipse tombe au tour suivant, où le Forgelance récupère la Lance
      et lance Jormun dans le même tour.

  - id: parade_posee
    # Parade (3378), que l'Eclipse exige absente.
    game_states: [3378]
    scope: caster
    max: 1
    default: 0
    monotone: none
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      L'état que la Parade pose sur le lanceur (sous-sort 24462, effet 950, durée
      1) : le tour du lancer seulement. L'Éclipse ne se lance pas tant qu'il dure.


  - id: pieges_declenches
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "La cible traverse l'aura de votre Holmgang"
    note: |
      Cochez si la cible traverse l'aura de votre Holmgang, ou en sort : elle y
      prend ses dégâts une fois.

  - id: coups_de_melee_subis
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "La cible vous frappe en mêlée"
    note: |
      Cochez si la cible vous frappe au contact pendant son tour : votre Parade
      riposte une fois.

  - id: holmgang_aura
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        requires: { kind: caster_has, resource: pieges_declenches }
        lines:
          # Sous-sort 24853 (par 30131) : 34-38 dans le meilleur élément. Le sous-sort
          # n'est pas dans la donnée figée : sa zone s'écrit ici, la seule case de
          # l'ennemi qui traverse.
          - best_element: true
            area: { shape: P, size: 1, max_targets: 1 }
            critical: [34, 38]
            normal: [34, 38]
            sans_critique: true
    note: |
      L'aura du Holmgang : « attire les ennemis qui le traversent ou qui en
      sortent et leur occasionne des dommages dans le meilleur element [...]
      une fois par ennemi par tour ». La cible la traverse pendant son tour,
      si le joueur le declare : une fois, au debut du tour suivant.

  - id: parade_riposte
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        requires: { kind: caster_has, resource: coups_de_melee_subis }
        lines:
          # Effet 2822 du sort 23386 : 26-30 dans le meilleur element.
          - best_element: true
            critical: [26, 30]
            normal: [26, 30]
            sans_critique: true
    note: |
      La riposte de la Parade : « occasionne des dommages dans son meilleur
      element et repousse son attaquant s'il subit des dommages en melee. La
      Parade est retiree apres la premiere attaque subie en melee. » Une fois,
      pendant le tour de la cible, si le joueur declare qu'elle frappe au
      contact : au debut du tour suivant.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "Seul le Croissant de Mani la pose sur le lanceur, au tour qui suit l'Eclipse quand il se tient sur la case ciblee : la rotation ne compte que l'autre branche, le Disque de Sigel (voir l'Eclipse)."
  - state: 8
    name: "Porte"
    note: "Le Forgelance n'est porte que par un Pandawa allie, hors d'une rotation solo."
  - state: 3589
    name: "Reprise de Volee"
    note: "Posee par l'Etendard (grade 2) sur ses invocations, pas sur le lanceur : les quinze sorts qui l'acceptent a la place d'Arme exigent donc Arme."

spells:
  - id: lance_a_incendie
    dofusdb_id: 23263
    name: { fr: "Lance à Incendie", en: "Fire Lance" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: 10 }
    note: |
      Occasionne des dommages Feu aux ennemis en zone.
      Invoque la Lance si la case est ou devient libre.
      
      Les dommages du sort sont augmentés après chaque lancer.
    assumptions:
      - "Effets 792/1160 : lance aussi « Invoque la Lance Immortelle », « Reprise de Volée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Effet 293, +5 dégâts de base par charge, plafonné à quatre, le sort se chargeant lui-même à chaque lancer : cinq paliers, 18-21, 23-26, 28-31, 33-36, 38-41, et 22-26 à 42-46 en critique."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
    lines:
      - element: fire
        critical: unknown
        normal: unknown
        base_bonus:
          - kind: per_resource
            resource: incendie
            amount: 5
    effects:
      - effect: damage
      - effect: gain
        resource: incendie
        at_cap: refresh
      # Invoque la Lance : elle est plantee apres ce lancer.
      - effect: gain
        resource: lance
        at_cap: refresh
  - id: jormun
    dofusdb_id: 23268
    name: { fr: "Jormun", en: "Jormun" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Eau aux ennemis en zone jusqu'à la Lance.
      
      Sur le lanceur : occasionne des dommages Eau plus faibles aux ennemis en zone autour du lanceur et de la Lance.
      Les dommages de zone ne sont pas dégressifs et ne sont appliqués qu'une seule fois par lancer.
      
      Rappelle également la Lance.
    assumptions:
      - "Aucun délai initial ni relance, comme le dit la donnée."
      - "Effets 950/951 : ce sort retire « Jormun (cercle) » (3931). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "\"Effets 1017/1160 : ce sort a deux modes de lancer, autour du lanceur ou depuis la Lance, « Jormun » sur « a,P,F7139 » : Eau 30-34; « Jormun » sur « c » : Eau 26-30. Ils ne se cumulent pas : « les dommages de zone ne sont appliqués qu'une seule fois par lancer », et lancer sur la Lance ne frappe jamais autour du lanceur. Confirmé en jeu. Une seule ligne est donc comptée, celle du mode le plus fort.\""
      - "Effets 1017/1160 : lance aussi « Rappel de la Lance », « Rappelle la Lance Immortelle », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les deux lignes Eau sont les deux modes de lancer, pas deux frappes : 30-34 en visant la Lance, zone en ligne jusqu'à elle, et 26-30 en visant le lanceur, zone autour de lui et de la Lance. « Les dommages de zone ne sont pas dégressifs et ne sont appliqués qu'une seule fois par lancer », et lancer sur la Lance ne frappe jamais autour du lanceur : seule la plus forte est comptée, 30-34."
    lines:
      - element: water
        critical: unknown
        normal: unknown
    # La Lance ne conditionne pas le lancer, elle en change la cible : armé, le
    # sort frappe autour du lanceur ; désarmé, il frappe depuis la Lance, avec les
    # mêmes fourchettes. Au contact les deux modes touchent ; au loin, le mode
    # armé frappe autour d'un lanceur que personne n'entoure : la Lance doit être
    # plantée.
    requires: { kind: caster_has, resource: lance }
    requires_only_at_range: true
    effects:
      - effect: damage
      # Rappelle la Lance : elle n'est plus plantee apres ce lancer.
      - effect: consume
        resource: lance
  - id: galanterie
    dofusdb_id: 23314
    name: { fr: "Galanterie", en: "Gallantry" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Éloigne le lanceur de la cible, attire la cible et soigne le lanceur et l'allié ciblé.
      
      Rappelle également la Lance si elle est ciblée.
    assumptions:
      - "Effets 792/1160 : lance aussi « Rappel de la Lance », « Rappelle la Lance Immortelle », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines: []
    effects:
      # Rappelle la Lance : elle n'est plus plantee apres ce lancer.
      - effect: consume
        resource: lance

  - id: renommee
    dofusdb_id: 23319
    name: { fr: "Renommée", en: "Renown" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    crit: { base_rate: 0, can_crit: false }
    note: |
      Attire la cible et soigne le lanceur et l'allié ciblé.
      Attire la cible vers la Lance si le lanceur est Désarmé.
      
      Rappelle également la Lance si elle est ciblée.
    assumptions:
      - "Effets 792/1160/2794 : lance aussi « Rappel de la Lance », « Rappelle la Lance Immortelle », « Renommée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines: []
    effects:
      # Rappelle la Lance : elle n'est plus plantee apres ce lancer.
      - effect: consume
        resource: lance

  - id: phalange
    dofusdb_id: 23330
    name: { fr: "Phalange", en: "Phalanx" }
    ap_cost: { base: 3 }
    casts_per_turn: 1
    cooldown_turns: 3
    crit: { base_rate: 0, can_crit: false }
    note: |
      Applique un bouclier sur les alliés et augmente leurs Résistances Poussée en zone.
      
      Le sort ne peut se lancer que sur la Lance si le lanceur est Désarmé.
    assumptions:
      - "Effets 792/1160/2960 : lance aussi « Phalange », « Reprise de Volée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Ce sort n'est jamais interdit, il change de cible : armé, il frappe autour du lanceur (état 3360) ; désarmé, depuis la Lance (état 3361, cible « a,P,F7139 »), avec les mêmes fourchettes. Le chiffre affiché est donc juste dans les deux cas. À distance, le mode armé frappe autour d'un lanceur que personne n'entoure, et il exige donc la Lance plantée ; ce que ce calculateur ne tient pas, c'est où la Lance se trouve, donc si l'ennemi est dans son axe."
    lines: []
    effects: []

  - id: parade
    dofusdb_id: 23386
    name: { fr: "Parade", en: "Parry" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    cooldown_turns: 2
    crit: { base_rate: 0, can_crit: false }
    note: |
      Rappelle immédiatement la Lance et de nouveau à la fin du tour du lanceur en remplaçant la Garde par la Parade :
      • Rend le lanceur Indéplaçable.
      • Réduit les dommages subis en mêlée.
      • Occasionne des dommages dans son meilleur élément et repousse son attaquant s'il subit des dommages en mêlée.
      
      La Parade est retirée après la première attaque subie en mêlée.
      Les effets d'interception et de partage de dommages sont incompatibles avec le sort.
    assumptions:
      - "Dans la Rotation : sa riposte, 26-30 en meilleur élément, une fois, si le joueur déclare que la cible le frappe en mêlée."
      - "Effet 1163, « Dommages subis x25 % » sur le LANCEUR : c'est la reduction de degats en melee que le texte du sort annonce. Elle change ce que le Forgelance encaisse, jamais ce qu'il inflige, et ce calculateur ne mesure que les degats portes."
      - "Effets 950/951 : ce sort applique « {{spell,32504,2::Parade}} » (6992) ; applique « Indéplaçable » (97). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "\"Effets 792/1160 : ce sort a deux modes de lancer, autour du lanceur ou depuis la Lance, « Parade » et ce qu'il lance a son tour sur « C » : meilleur element 26-30. Ils ne se cumulent pas : « les dommages de zone ne sont appliqués qu'une seule fois par lancer », et lancer sur la Lance ne frappe jamais autour du lanceur. Confirmé en jeu. Une seule ligne est donc comptée, celle du mode le plus fort.\""
      - "Effets 792/1160 : lance aussi « Parade », « Rappel de la Lance », « Rappelle la Lance Immortelle », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
    lines: []
    effects:
      # Rappelle la Lance : elle n'est plus plantee apres ce lancer.
      - effect: consume
        resource: lance
      - effect: gain
        resource: parade_posee
      - effect: gain
        resource: parade_riposte
  - id: octave
    dofusdb_id: 23391
    name: { fr: "Octave", en: "Octave" }
    ap_cost: { base: 2 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Éloigne le lanceur de la cible et occasionne des dommages Eau aux ennemis.
    assumptions:
      - "Effet 792 : lance aussi « Reprise de Volée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
    lines:
      - element: water
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: javelot_foudre
    dofusdb_id: 23392
    name: { fr: "Javelot-foudre", en: "Lightning-Javelin" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    casts_per_target: 1
    crit: { base_rate: unknown }
    note: |
      Invoque la Lance et occasionne des dommages Eau aux ennemis en zone.
      Rebondit également sur l'ennemi le plus proche n'étant pas dans la zone d'effet dans un cercle de taille 2 si la case est occupée.
    assumptions:
      - "Effets 950/951 : ce sort applique « Javelot-Foudre (ligne) » (3942). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "Effets 792/1160/2794 : lance aussi « Invoque la Lance Immortelle », « Javelot-foudre », « Reprise de Volée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
      - "Deux modes de lancer, qui se partagent les deux lancers du tour. Sur une case vide, la Lance se plante et seuls les ennemis alignés entre le lanceur et la case sont touchés. Sur un monstre, le javelot frappe la ligne jusqu'à lui, puis rebondit sur l'ennemi le plus proche que la ligne n'a pas touché, à deux cases au plus : 28 à 32 Eau, 35 à 39 en critique (sous-sort 25449, grade 4). La Lance ne se plante pas."
      - "Avec un placement, la case visée décide du mode : vide, la Lance se plante ; occupée, le javelot rebondit. Sans placement, le solveur choisit, et les ennemis déclarés sont supposés alignés sur la ligne tant qu'elle a de la place, comme pour toute zone : le rebond ne trouve alors quelqu'un qu'au-delà de ce que la ligne frappe."
    lines:
      - element: water
        critical: unknown
        normal: unknown
    effects:
