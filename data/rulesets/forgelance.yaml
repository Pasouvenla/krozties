        normal: unknown
    # La Lance ne conditionne pas le lancer, elle en change la cible : armé, le
    # sort frappe autour du lanceur ; désarmé, il frappe depuis la Lance, avec les
    # mêmes fourchettes. Au contact les deux modes touchent ; au loin, le mode
    # armé frappe autour d'un lanceur que personne n'entoure : la Lance doit être
