      - "Effets 950/951 : ce sort applique « {{spell,32508,2::Éclipse}} » (6994). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "\"Effets 792/1160/2794 : ce sort a deux modes de lancer, autour du lanceur ou depuis la Lance, « Éclipse » et ce qu'il lance a son tour sur « C » : meilleur element 67-76. Ils ne se cumulent pas : « les dommages de zone ne sont appliqués qu'une seule fois par lancer », et lancer sur la Lance ne frappe jamais autour du lanceur. Confirmé en jeu. Une seule ligne est donc comptée, celle du mode le plus fort.\""
      - "Effets 792/1160/2794 : lance aussi « Croissant de Mani », « Disque de Sigel », « Rappel de la Lance », « Rappelle la Lance Immortelle », « Éclipse », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Effet 1160 à `delay: 1`, meilleur élément 67-76 (80-91 en critique), en frappe différée d'un tour : le sort « désarme immédiatement le lanceur pour appliquer des effets sur la case ciblée au tour suivant », et la donnée porte deux sous-sorts à délai 1. Fourchette du groupe « Disque de Sigel - Ennemi »."
      - "« Éclipse parfaite » : au tour suivant, la Lance se plante sur la case ciblée et le lanceur est bien Désarmé. Sur une case occupée par un monstre, elle ne se planterait pas : la rotation suppose le cas où elle se plante."
      - "Deux branches, une seule comptée : le tour suivant lance le « Croissant de Mani » si la case ciblée est occupée par le lanceur, et le « Disque de Sigel » sinon. Choisir entre les deux est du placement : seul le Disque est compté, la branche la plus forte, le Croissant n'ayant aucune fourchette publiée."
      - "Une seule ligne est comptée, celle du Disque de Sigel."
    lines: []
    effects:
      # La frappe du tour suivant, sur la case ciblee.
      - effect: schedule
        id: disque_de_sigel
        delay: 1
        payload:
          # La zone du sous-sort Disque de Sigel (23836, grade 6), effet 2822 : cercle
          # de taille 3, 25 cases, dégressif de 10 % sur quatre crans. L'instantané de
          # la classe ne porte pas ce sous-sort, d'où la zone écrite ici.
          - best_element: true
            area: { shape: C, size: 3, max_targets: 25, falloff_percent: 10, falloff_steps: 4 }
            critical: [80, 91]
            normal: [67, 76]
      # « Rappelle la Lance » puis « désarme immédiatement le lanceur » : le
      # sous-sort « Désarme » (23286) pose 3361 dès le lancer, et au tour suivant le
      # Disque de Sigel invoque la Lance sur la case ciblée. Le lanceur reste
      # Désarmé, Lance plantée, ce que dit ce compteur.
      - effect: gain
        resource: lance
      - effect: gain
        resource: eclipse_en_cours

