      - "Effet 1163, « Dommages subis x65 % », sur le lanceur : la réduction que le texte annonce, « réduit les dommages subis à distance ». Elle protège, et ce calculateur compte ce que le lanceur inflige."
      - "Effet 335, « Change l'apparence », paramètre 2062, permanent sur le lanceur : le Holmgang remplace la Garde et le montre. De l'apparence, dont aucun chiffre ne dépend."
      - "Effets 950/951 : ce sort applique « Holmgang (caster glyphe) » (5746) ; applique « {{spell,32507,1::Holmgang}} » (3498) ; applique « Indéplaçable » (97) ; applique « Holmgang (cast) » (5742) ; retire « Holmgang (cast) » (5742). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "Effets 792/1160 : lance aussi « Garde », « Holmgang », « Rappel de la Lance », « Rappelle la Lance Immortelle », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les déplacements et les poses au sol de ce sort, téléportation, poussée, attirance, glyphe ou piège, ne sont pas modélisés : ce calculateur ne simule pas la grille. Ses dégâts, eux, sont exacts."
