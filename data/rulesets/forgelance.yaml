    name: { fr: "Ydra", en: "Ydra" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    cooldown_turns: 2
    crit: { base_rate: unknown }
    note: |
      Réduit les dommages reçus par le lanceur pour chaque ennemi dans la zone d'effet et leur occasionne des dommages Terre en zone.
      Les dommages de zone ne sont pas dégressifs.
      
      Le sort ne peut se lancer que sur la Lance et la rappelle si le lanceur est Désarmé.
    assumptions:
      - "\"Effets 792/1160/2960 : ce sort a deux modes de lancer, autour du lanceur ou depuis la Lance, « Ydra » sur « a,A,*E3360 » : Terre 44-50; « Ydra » sur « a,P,F7139,*E3361,*e3589 » : Terre 44-50. Ils ne se cumulent pas : « les dommages de zone ne sont appliqués qu'une seule fois par lancer », et lancer sur la Lance ne frappe jamais autour du lanceur. Confirmé en jeu. Une seule ligne est donc comptée, celle du mode le plus fort.\""
      - "Effets 792/1160/2960 : lance aussi « Rappel de la Lance », « Rappelle la Lance Immortelle », « Reprise de Volée », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Ce sort n'est jamais interdit, il change de cible : armé, il frappe autour du lanceur (état 3360) ; désarmé, depuis la Lance (état 3361, cible « a,P,F7139 »), avec les mêmes fourchettes. Le chiffre affiché est donc juste dans les deux cas. À distance, le mode armé frappe autour d'un lanceur que personne n'entoure, et il exige donc la Lance plantée ; ce que ce calculateur ne tient pas, c'est où la Lance se trouve, donc si l'ennemi est dans son axe."
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    # La Lance ne conditionne pas le lancer, elle en change la cible : armé, le
    # sort frappe autour du lanceur ; désarmé, il frappe depuis la Lance, avec les
    # mêmes fourchettes. Au contact les deux modes touchent ; au loin, le mode
    # armé frappe autour d'un lanceur que personne n'entoure : la Lance doit être
    # plantée.
    requires: { kind: caster_has, resource: lance }
    requires_only_at_range: true
    effects:
      - effect: damage
      # Rappelle la Lance : elle n'est plus plantee apres ce lancer.
      - effect: consume
        resource: lance
