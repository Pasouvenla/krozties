# Huppermage.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: huppermage
name: { fr: "Huppermage", en: "Huppermage" }

resources:
  - id: drain_force
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 13672
    modifies_damage:
      - kind: characteristic
        amount: 200
        element: earth
    note: |
      Les deux cents points de Force que le Drain Élémentaire vole quand la
      cible porte l'état Terre, pendant trois tours (cible « A,E292 » : l'état
      décide de la caractéristique volée). Le lanceur gagne ce qu'il vole, le
      double du Sram. Les quatre vols du sort s'excluent, comme ses quatre lignes
      de dégâts : une cible ne porte jamais deux états élémentaires à la fois.
      La Terre emporte le Neutre avec elle, les deux tirant de la Force.

  - id: drain_intelligence
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 13672
    modifies_damage:
      - kind: characteristic
        amount: 200
        element: fire
    note: |
      Les deux cents points de Intelligence que le Drain Élémentaire vole quand la
      cible porte l'état Feu, pendant trois tours (cible « A,E290 » : l'état
      décide de la caractéristique volée). Le lanceur gagne ce qu'il vole, le
      double du Sram. Les quatre vols du sort s'excluent, comme ses quatre lignes
      de dégâts : une cible ne porte jamais deux états élémentaires à la fois.
  - id: drain_chance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 13672
    modifies_damage:
      - kind: characteristic
        amount: 200
        element: water
    note: |
      Les deux cents points de Chance que le Drain Élémentaire vole quand la
      cible porte l'état Eau, pendant trois tours (cible « A,E291 » : l'état
      décide de la caractéristique volée). Le lanceur gagne ce qu'il vole, le
      double du Sram. Les quatre vols du sort s'excluent, comme ses quatre lignes
      de dégâts : une cible ne porte jamais deux états élémentaires à la fois.
  - id: drain_agilite
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 13672
    modifies_damage:
      - kind: characteristic
        amount: 200
        element: air
    note: |
      Les deux cents points de Agilité que le Drain Élémentaire vole quand la
      cible porte l'état Air, pendant trois tours (cible « A,E293 » : l'état
      décide de la caractéristique volée). Le lanceur gagne ce qu'il vole, le
      double du Sram. Les quatre vols du sort s'excluent, comme ses quatre lignes
      de dégâts : une cible ne porte jamais deux états élémentaires à la fois.
  # Les combinaisons élémentaires : « Quand un Huppermage génère une
  # combinaison élémentaire, il gagne de la Puissance pour 2 tours, à hauteur
  # d'une fois maximum par combinaison élémentaire différente. » D'où un
  # drapeau par combinaison : six combinaisons différentes font six fois 50
  # Puissance, deux fois la même une seule.
  #
  # Durée : 3 dans la donnée (sous-sort 23876, effet 138), le tour de la
  # combinaison et les deux suivants, vérifiée en jeu malgré le « pour 2
  # tours » de l'aide.
  - id: comb_eruption
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: characteristic
        amount: 50
    note: |
      La Puissance de l'Eruption (Terre et Feu), une fois au plus tant qu'elle dure.

  - id: comb_enlisement
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: characteristic
        amount: 50
    note: |
      La Puissance de l'Enlisement (Terre et Eau), une fois au plus tant qu'elle dure.

  - id: comb_carbonisation
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: characteristic
        amount: 50
    note: |
      La Puissance de la Carbonisation (Feu et Air), une fois au plus tant qu'elle dure.

  - id: comb_ebullition
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: characteristic
        amount: 50
    note: |
      La Puissance de l'Ebullition (Eau et Feu), une fois au plus tant qu'elle dure.

  - id: comb_cristallisation
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: characteristic
        amount: 50
    note: |
      La Puissance de la Cristallisation (Eau et Air), une fois au plus tant qu'elle dure.

  - id: comb_assechement
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: characteristic
        amount: 50
    note: |
      La Puissance de l'Assechement (Air et Terre), une fois au plus tant qu'elle dure.

  - id: eruption
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Le tour de la combinaison seulement : effet 1163 a duree 0 (sous-sort
    # 23876), « la cible subit les effets suivants pendant 1 tour » dans l'aide.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163 a 115 : les dommages subis par la cible sont multiplies par
      # 1,15.
      - kind: final_multiplier
        percent: 115
    note: |
      L'Eruption, combinaison Terre et Feu : « augmentation des dommages
      subis ». La seule des six qui touche aux degats ; les cinq autres
      retirent des PM (Enlisement), des PA (Carbonisation), de la Fuite
      (Ebullition), des dommages finaux a la cible (Cristallisation) ou
      volent de la Portee (Assechement), et ne changent aucun chiffre ici.

  - id: combinaison_ce_lancer
    scope: caster
    max: 1
    default: 0
    monotone: none
    note: |
      Vrai pendant les effets d'un sort qui vient de generer une combinaison,
      et remis a zero avant la fin de ses effets : il sert a ne PAS poser
      l'etat du sort quand la combinaison vient de consommer les deux.

  - id: combinaisons_generees
    scope: caster
    max: 6
    default: 0
    monotone: increasing
    dofusdb_source: 14342
    note: |
      Combien de Combinaisons Élémentaires le lanceur a générées, pour le seul
      Torrent Arcanique : « les dommages du sort sont augmentés pour chaque
      combinaison élémentaire générée par le lanceur ». Sans durée, et distinct
      des drapeaux `comb_*`, qui portent chacun 50 Puissance et valent un ;
      celui-ci compte. Les fondre multiplierait la Puissance par le nombre de
      combinaisons, un modificateur d'état valant son montant par charge.

      Plafonné à six : six paliers de 4 à 14 en normal et de 6 à 16 en critique,
      deux points par cran, la fourchette nue valant 2 et 4. Le compte reprend à
      zéro après chaque Torrent (« les effets sont réinitialisés après
      utilisation du sort »). Le jeu compte depuis le début du combat, ce solveur
      depuis le premier tour résolu : un Huppermage qui arrive avec des crans
      acquis frappe plus fort que ce total.

  - id: etat_feu
    scope: target
    max: 1
    default: 0
    monotone: none
    note: |
      L'état Feu posé sur la cible par six sorts offensifs : deux états
      différents présents ensemble déclenchent une Combinaison, qui les consomme
      tous les deux. `monotone: none` : un même élément relancé ne cumule rien.

  - id: etat_eau
    scope: target
    max: 1
    default: 0
    monotone: none
    note: |
      L'état Eau posé sur la cible par six sorts offensifs : deux états
      différents présents ensemble déclenchent une Combinaison, qui les consomme
      tous les deux. `monotone: none` : un même élément relancé ne cumule rien.

  - id: etat_terre
    scope: target
    max: 1
    default: 0
    monotone: none
    note: |
      L'état Terre posé sur la cible par six sorts offensifs : deux états
      différents présents ensemble déclenchent une Combinaison, qui les consomme
      tous les deux. `monotone: none` : un même élément relancé ne cumule rien.

  - id: etat_air
    scope: target
    max: 1
    default: 0
    monotone: none
    note: |
      L'état Air posé sur la cible par six sorts offensifs : deux états
      différents présents ensemble déclenchent une Combinaison, qui les consomme
      tous les deux. `monotone: none` : un même élément relancé ne cumule rien.

  - id: rune
    scope: target
    max: 4
    default: 0
    monotone: none
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    note: |
      L'élément de la rune sous la cible : 0 aucune, 1 Terre, 2 Feu, 3 Eau, 4 Air.
      Les vingt-quatre sorts élémentaires la posent (effet 2022, deux tours) dans
      leur élément, et une nouvelle rune remplace l'ancienne ; la Runification et
      la Manifestation la déclenchent, dans son élément, et elle disparaît.

      Une seule valeur pour toutes les cibles : lancée sur soi, la Runification
      déclenche une rune par cible, toutes supposées de l'élément du dernier sort
      lancé, exact tant que les sorts qui les posent partagent un élément. Suivre
      l'élément de chaque cible multiplierait les états par cinq à chaque ennemi.

      `monotone: none` : les éléments ne se comparent pas.

  - id: derniere_rune
    scope: caster
    max: 4
    default: 0
    monotone: none
    note: |
      L'element de la derniere rune posee, memes codes que `rune`, pour la
      Surcharge Runique qui frappe « dans l'element des runes ». La
      Runification ne l'efface pas : elle ne declenche que la rune sous sa
      cible, les autres restent.

  - id: bonus_force
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: decrement_one }
    modifies_damage:
      - kind: characteristic
        amount: 50
        element: earth
    note: |
      Les cinquante points de Force que la Runification et la Manifestation
      donnent au lanceur quand la rune déclenchée est Terre (rune = 1), effet
      118, pendant trois tours.

      Plafonné à un seul cran, quand le jeu en donne six : chaque cran multiplie
      par cinq le nombre d'états que la recherche distingue, et le total reste un
      plancher quand le joueur enchaîne les Runifications. Le jeu donne trois
      tours à chaque application, et ce moteur ne tient qu'un compte à rebours
      par compteur : `refresh: on_apply` le remet à trois à chaque nouvelle rune
      déclenchée, et `on_expire: decrement_one` fait tomber les crans un par un.

  - id: bonus_intelligence
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: decrement_one }
    modifies_damage:
      - kind: characteristic
        amount: 50
        element: fire
    note: |
      Les cinquante points de Intelligence que la Runification et la Manifestation
      donnent au lanceur quand la rune déclenchée est Feu (rune = 2), effet
      126, pendant trois tours.

      Plafonné à un seul cran, quand le jeu en donne six : chaque cran multiplie
      par cinq le nombre d'états que la recherche distingue, et le total reste un
      plancher quand le joueur enchaîne les Runifications. Le jeu donne trois
      tours à chaque application, et ce moteur ne tient qu'un compte à rebours
      par compteur : `refresh: on_apply` le remet à trois à chaque nouvelle rune
      déclenchée, et `on_expire: decrement_one` fait tomber les crans un par un.

  - id: bonus_chance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: decrement_one }
    modifies_damage:
      - kind: characteristic
        amount: 50
        element: water
    note: |
      Les cinquante points de Chance que la Runification et la Manifestation
      donnent au lanceur quand la rune déclenchée est Eau (rune = 3), effet
      123, pendant trois tours.

      Plafonné à un seul cran, quand le jeu en donne six : chaque cran multiplie
      par cinq le nombre d'états que la recherche distingue, et le total reste un
      plancher quand le joueur enchaîne les Runifications. Le jeu donne trois
      tours à chaque application, et ce moteur ne tient qu'un compte à rebours
      par compteur : `refresh: on_apply` le remet à trois à chaque nouvelle rune
      déclenchée, et `on_expire: decrement_one` fait tomber les crans un par un.

  - id: bonus_agilite
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: decrement_one }
    modifies_damage:
      - kind: characteristic
        amount: 50
        element: air
    note: |
      Les cinquante points de Agilité que la Runification et la Manifestation
      donnent au lanceur quand la rune déclenchée est Air (rune = 4), effet
      119, pendant trois tours.

      Plafonné à un seul cran, quand le jeu en donne six : chaque cran multiplie
      par cinq le nombre d'états que la recherche distingue, et le total reste un
      plancher quand le joueur enchaîne les Runifications. Le jeu donne trois
      tours à chaque application, et ce moteur ne tient qu'un compte à rebours
      par compteur : `refresh: on_apply` le remet à trois à chaque nouvelle rune
      déclenchée, et `on_expire: decrement_one` fait tomber les crans un par un.

  - id: runes_ce_tour
    scope: caster
    max: 6
    default: 0
    monotone: increasing
    shifts_into: runes_tour_1
    note: |
      Les runes posées pendant ce tour, une par sort élémentaire lancé. Une rune
      dure deux tours (effet 2022) : posée au tour N, elle disparaît à la fin du
      tour N+1, d'où deux compteurs qui glissent d'un cran à chaque fin de tour.
      Six au plus par tour : à douze PA, les sorts élémentaires en coûtent trois
      ou plus.

  - id: runes_tour_1
    scope: caster
    max: 6
    default: 0
    monotone: increasing
    note: |
      Les runes posees au tour precedent : elles vivent leur dernier tour et
      disparaissent a la fin de celui-ci.

  - id: tribut_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      - kind: characteristic
        amount: 150
    note: |
      « Applique des effets sur le lanceur SELON L'ETAT ELEMENTAIRE sur l'ennemi
      cible : Eau, augmente la Puissance. » Cent cinquante pendant deux tours,
      ce que porte l'effet 138 du Tribut au dernier grade.

      La condition se lit sur la ressource `etat_eau`, que les six sorts Eau de
      la classe posent : c'est le meme mecanisme que la Combinaison, et il ne
      demande pas plus de placement.

  - id: vulnerabilite_volcan
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Zéro tour veut dire « le tour de la pose, et lui seul » : la vulnérabilité
    # tient jusqu'au début du prochain tour du lanceur, qui n'en profite que dans
    # le même tour d'actions.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163, « Dommages subis x104 % » : un multiplicateur, donc tout a
      # la fin du pipeline.
      - kind: final_multiplier
        percent: 104
    note: |
      La vulnerabilite que Volcan pose sur sa cible. Tout ce qui tombe ensuite
      sur elle dans le meme tour est multiplie par 1.04.

costly:
  - id: bonus_de_rune
    name: { fr: "Bonus de caractéristique des runes", en: "Rune characteristic bonus" }
    resources: [bonus_force, bonus_intelligence, bonus_chance, bonus_agilite]
    note: |
      Le +50 que la Runification et la Manifestation donnent dans la
      caractéristique de l'élément de la rune déclenchée. Il ne sert qu'avec les
      runes élémentaires : il se gagne quand une rune se déclenche.


  - id: les_runes
    name: { fr: "Runes élémentaires", en: "Elemental runes" }
    resources: [rune, derniere_rune, runes_ce_tour, runes_tour_1]
    note: |
      Les runes élémentaires : celle posée sous la cible par les vingt-quatre
      sorts élémentaires, son élément, et le compte des runes vivantes tour par
      tour que lisent la Surcharge Runique et la Runification lancée sur soi. Les
      runes frappent quinze de base : elles comptent pour qui joue autour d'elles.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "La Sublimation la pose sur l'ennemi cible, pas sur le lanceur."

spells:
  - id: lance_flamme
    dofusdb_id: 13666
    name: { fr: "Lance-flamme", en: "Flamethrower" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Feu et retire des PA.
      
      Peut générer des {{spell,23876,1::Combinaisons Élémentaires}}.
    assumptions:
      - "Effets 950 et 951, états élémentaires Feu (290), Eau (291), Terre (292) et Air (293) : deux états différents présents ensemble sur la cible déclenchent une Combinaison Élémentaire, qui les consomme et donne 50 Puissance au lanceur pendant trois tours. Le moteur de dégâts de la classe, sans placement : il suffit d'enchaîner deux éléments sur la même cible."
      - "Effet 2022, « pose une rune » : la rune posée sous la cible prend l'élément Feu de ce sort et remplace la précédente, pour deux tours. La Runification et la Manifestation la déclenchent."
      - "Effet 1160 : lance aussi « Rune de Feu », « État Feu », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      - element: fire
        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      # Une combinaison part si la cible porte un AUTRE element : sa
      # Puissance (une fois par combinaison differente), l'Eruption pour Terre
      # et Feu, et le compte du Torrent Arcanique.
      - effect: gain
        resource: comb_ebullition
        requires: { kind: target_has, resource: etat_eau }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
        requires: { kind: target_has, resource: etat_eau }
      - effect: gain
        resource: combinaison_ce_lancer
        requires: { kind: target_has, resource: etat_eau }
      - effect: gain
        resource: comb_eruption
        requires: { kind: target_has, resource: etat_terre }
        at_cap: refresh
      - effect: gain
        resource: eruption
        requires: { kind: target_has, resource: etat_terre }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
        requires: { kind: target_has, resource: etat_terre }
      - effect: gain
        resource: combinaison_ce_lancer
        requires: { kind: target_has, resource: etat_terre }
      - effect: gain
        resource: comb_carbonisation
        requires: { kind: target_has, resource: etat_air }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
        requires: { kind: target_has, resource: etat_air }
      - effect: gain
        resource: combinaison_ce_lancer
        requires: { kind: target_has, resource: etat_air }
      # Sans combinaison, le sort pose son état ; avec, il ne pose rien : la
      # combinaison consomme les deux états, le sien compris.
      - effect: gain
        resource: etat_feu
        requires: { kind: exactly, resource: combinaison_ce_lancer, amount: 0 }
        at_cap: refresh
      - effect: reset
        resource: etat_eau
      - effect: reset
        resource: etat_terre
      - effect: reset
        resource: etat_air
      - effect: reset
        resource: combinaison_ce_lancer
      # La rune posee sous la cible prend l'element du sort (effet 2022).
      - effect: reset
        resource: rune
      - effect: gain
        resource: rune
        amount: 2
      # Et compte parmi les runes vivantes, pour la Surcharge Runique.
      - effect: reset
        resource: derniere_rune
      - effect: gain
        resource: derniere_rune
        amount: 2
      - effect: gain
        resource: runes_ce_tour

  - id: stalagmite
    dofusdb_id: 13667
    name: { fr: "Stalagmite", en: "Stalagmite" }
    ap_cost: { base: 3 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Eau et réduit les dommages finaux.
      
      Peut générer des {{spell,23876,1::Combinaisons Élémentaires}}.
    assumptions:
      - "Effet 1172, -4 % de Dommages finaux sur la CIBLE : c'est l'adversaire qui frappera moins fort."
      - "Effets 950 et 951, états élémentaires Feu (290), Eau (291), Terre (292) et Air (293) : deux états différents présents ensemble sur la cible déclenchent une Combinaison Élémentaire, qui les consomme et donne 50 Puissance au lanceur pendant trois tours. Le moteur de dégâts de la classe, sans placement : il suffit d'enchaîner deux éléments sur la même cible."
      - "Effet 2022, « pose une rune » : la rune posée sous la cible prend l'élément Eau de ce sort et remplace la précédente, pour deux tours. La Runification et la Manifestation la déclenchent."
      - "Effet 1160 : lance aussi « Rune d'Eau », « État Eau », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      - element: water
        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      # Une combinaison part si la cible porte un AUTRE element : sa
      # Puissance (une fois par combinaison differente), l'Eruption pour Terre
      # et Feu, et le compte du Torrent Arcanique.
      - effect: gain
        resource: comb_ebullition
        requires: { kind: target_has, resource: etat_feu }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
        requires: { kind: target_has, resource: etat_feu }
      - effect: gain
        resource: combinaison_ce_lancer
        requires: { kind: target_has, resource: etat_feu }
      - effect: gain
        resource: comb_enlisement
        requires: { kind: target_has, resource: etat_terre }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
        requires: { kind: target_has, resource: etat_terre }
      - effect: gain
        resource: combinaison_ce_lancer
        requires: { kind: target_has, resource: etat_terre }
      - effect: gain
        resource: comb_cristallisation
        requires: { kind: target_has, resource: etat_air }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
