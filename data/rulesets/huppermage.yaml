  - id: onde_celeste
    dofusdb_id: 13708
    name: { fr: "Onde Céleste", en: "Celestial Wave" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    casts_per_target: 1
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Air.
      
      Peut générer des {{spell,23876,1::Combinaisons Élémentaires}}.
    assumptions:
      - "Effets 950 et 951, états élémentaires Feu (290), Eau (291), Terre (292) et Air (293) : deux états différents présents ensemble sur la cible déclenchent une Combinaison Élémentaire, qui les consomme et donne 50 Puissance au lanceur pendant trois tours. Le moteur de dégâts de la classe, sans placement : il suffit d'enchaîner deux éléments sur la même cible."
      - "Effet 2022, « pose une rune » : la rune posée sous la cible prend l'élément Air de ce sort et remplace la précédente, pour deux tours. La Runification et la Manifestation la déclenchent."
      - "Effet 1160 : lance aussi « Rune d'Air », « État Air », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      # Une combinaison part si la cible porte un AUTRE element : sa
      # Puissance (une fois par combinaison differente), l'Eruption pour Terre
      # et Feu, et le compte du Torrent Arcanique.
      - effect: gain
        resource: comb_carbonisation
        requires: { kind: target_has, resource: etat_feu }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
        requires: { kind: target_has, resource: etat_feu }
      - effect: gain
        resource: combinaison_ce_lancer
        requires: { kind: target_has, resource: etat_feu }
      - effect: gain
        resource: comb_cristallisation
        requires: { kind: target_has, resource: etat_eau }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
        requires: { kind: target_has, resource: etat_eau }
      - effect: gain
        resource: combinaison_ce_lancer
        requires: { kind: target_has, resource: etat_eau }
      - effect: gain
        resource: comb_assechement
        requires: { kind: target_has, resource: etat_terre }
        at_cap: refresh
      - effect: gain
        resource: combinaisons_generees
        requires: { kind: target_has, resource: etat_terre }
      - effect: gain
        resource: combinaison_ce_lancer
        requires: { kind: target_has, resource: etat_terre }
      # Sans combinaison, le sort pose son état ; avec, il ne pose rien : la
      # combinaison consomme les deux états, le sien compris.
      - effect: gain
        resource: etat_air
        requires: { kind: exactly, resource: combinaison_ce_lancer, amount: 0 }
        at_cap: refresh
      - effect: reset
        resource: etat_feu
      - effect: reset
        resource: etat_eau
      - effect: reset
        resource: etat_terre
      - effect: reset
        resource: combinaison_ce_lancer
      # La rune posee sous la cible prend l'element du sort (effet 2022).
      - effect: reset
        resource: rune
      - effect: gain
        resource: rune
        amount: 4
      # Et compte parmi les runes vivantes, pour la Surcharge Runique.
      - effect: reset
        resource: derniere_rune
      - effect: gain
        resource: derniere_rune
        amount: 4
      - effect: gain
        resource: runes_ce_tour

