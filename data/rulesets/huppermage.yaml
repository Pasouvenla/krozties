  - id: runification
    dofusdb_id: 13670
    name: { fr: "Runification", en: "Runification" }
    ap_cost: { base: 2 }
    casts_per_turn: 2
    crit: { base_rate: 0, can_crit: false }
    note: |
      Déclenche une rune du lanceur pour voler de la vie à l'ennemi ou soigner l'allié qui l'occupe, et augmenter les caractéristiques du lanceur et de l'allié sur la rune selon l'élément de la rune.
      
      Sur le lanceur : déclenche toutes ses runes occupées par une entité.
      
      Peut générer des {{spell,23876,1::Combinaisons Élémentaires}}.
    assumptions:
      - "Effet 2023, « declenche les runes » : c'est le geste central du sort, et il porte sur des cases."
      - "Effets 950/951 : ce sort applique « Rune (rang 3) » (6971) ; retire « Runification » (6968) ; retire « Rune (rang 3) » (6971). AUCUN sort de la classe ne lit ces etats dans son masque de cible, et ils ne portent aucun drapeau touchant aux degats : ils ne changent donc aucun chiffre ici."
      - "Effets 1160/2794 : lance aussi « Runes Élémentaires », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Deux modes de lancer, qui se partagent les deux lancers du tour. Sur un ennemi, le sort déclenche la rune sous lui : une frappe de 15, dans l'élément de la rune. Sur soi, il déclenche une rune par cible déclarée. La rune prend l'élément du dernier sort élémentaire lancé, et le déclenchement la retire."
      - "⚠️ Lancé sur soi, toutes les runes sont supposées de l'élément du dernier sort lancé : exact quand les sorts qui les posent partagent un élément, approché sinon."
      - "Lancé sur soi, le sort « déclenche toutes ses runes occupées par une entité » : il frappe une fois par rune vivante, jamais plus de fois qu'il n'y a d'ennemis déclarés."
      - "Effets 118, 119, 123 et 126, +50 dans une caractéristique pendant trois tours « selon l'élément de la rune » déclenchée, en quatre compteurs, un par élément, plafonnés à un cran chacun : le jeu en donne un par rune déclenchée, six au plus, et six crans rendent le calcul trop long. Le total reste un plancher quand plusieurs runes partent d'un même lancer. Lancée sur soi, la Runification déclenche toutes les runes occupées de la carte, sans limite de zone."
    requires: { kind: target_has, resource: rune }
    lines:
      - element: earth
        critical: unknown
        normal: [15, 15]
        active_at: { resource: rune, exactly: 1 }
      - element: fire
        critical: unknown
        normal: [15, 15]
        active_at: { resource: rune, exactly: 2 }
      - element: water
        critical: unknown
        normal: [15, 15]
        active_at: { resource: rune, exactly: 3 }
      - element: air
        critical: unknown
        normal: [15, 15]
        active_at: { resource: rune, exactly: 4 }
    effects:
      - effect: damage
      # Le lanceur gagne cinquante points dans la caracteristique de
      # l'element de la rune declenchee, pour trois tours.
      - effect: gain
        resource: bonus_force
        requires: { kind: exactly, resource: rune, amount: 1 }
      - effect: gain
        resource: bonus_intelligence
        requires: { kind: exactly, resource: rune, amount: 2 }
      - effect: gain
        resource: bonus_chance
        requires: { kind: exactly, resource: rune, amount: 3 }
      - effect: gain
        resource: bonus_agilite
        requires: { kind: exactly, resource: rune, amount: 4 }
      - effect: reset
        resource: rune
      # La rune declenchee disparait : la plus recente d'abord, c'est elle qui
      # est sous la cible.
      - effect: consume_across
        resources: [runes_ce_tour, runes_tour_1]
    mode_name: { fr: "sur un ennemi", en: "on an enemy" }
    modes:
      - name: { fr: "sur soi", en: "on self" }
        on_self: true
        requires: { kind: target_has, resource: rune }
        lines:
          - element: earth
            critical: unknown
            normal: [15, 15]
            active_at: { resource: rune, exactly: 1 }
            every_target: true
            targets_capped_by: [runes_ce_tour, runes_tour_1]
          - element: fire
            critical: unknown
            normal: [15, 15]
            active_at: { resource: rune, exactly: 2 }
            every_target: true
            targets_capped_by: [runes_ce_tour, runes_tour_1]
          - element: water
            critical: unknown
            normal: [15, 15]
            active_at: { resource: rune, exactly: 3 }
            every_target: true
            targets_capped_by: [runes_ce_tour, runes_tour_1]
          - element: air
            critical: unknown
            normal: [15, 15]
            active_at: { resource: rune, exactly: 4 }
            every_target: true
            targets_capped_by: [runes_ce_tour, runes_tour_1]
        effects:
          - effect: damage
          # Le lanceur gagne cinquante points dans la caracteristique de
          # l'element de la rune declenchee, pour trois tours.
          - effect: gain
            resource: bonus_force
            requires: { kind: exactly, resource: rune, amount: 1 }
          - effect: gain
            resource: bonus_intelligence
            requires: { kind: exactly, resource: rune, amount: 2 }
          - effect: gain
            resource: bonus_chance
            requires: { kind: exactly, resource: rune, amount: 3 }
          - effect: gain
            resource: bonus_agilite
            requires: { kind: exactly, resource: rune, amount: 4 }
          - effect: reset
            resource: rune
          # Une rune declenchee par cible.
          - effect: consume_across
            resources: [runes_ce_tour, runes_tour_1]
            by_zone: true

  - id: drain_elementaire
    dofusdb_id: 13672
    name: { fr: "Drain Élémentaire", en: "Elemental Drain" }
    ap_cost: { base: 2 }
    casts_per_turn: 3
    casts_per_target: 1
    crit: { base_rate: unknown }
    note: |
      Vole des caractéristiques et de la vie selon l'état élémentaire sur l'ennemi ciblé.
    assumptions:
      - "Effets 266, 268, 269 et 271, « vole 200 Chance / Agilité / Intelligence / Force », sur les quatre états `drain_*` : le lanceur gagne ce qu'il vole, pour la durée inscrite. Chaque vol est conditionné au même état élémentaire que sa ligne de dégâts (cible « A,E29x ») et ne lève que les lignes de son élément. Deux cents points, le double du Sram, pendant trois tours."
      - "« Selon l'état élémentaire » : les quatre lignes s'excluent, chacune ne frappant que si la cible porte son élément, étiquetées « Cible sous Terre », « Cible sous Feu », « Cible sous Eau » et « Cible sous Air », toutes à 23-26. Sans condition, elles frapperaient les quatre à la fois, 100 de dégâts de base pour 2 PA sur une cible nue, là où le jeu n'en fait aucun."
      - "Deux états ne peuvent pas coexister sur une cible : chaque sort élémentaire de la classe remet les quatre à zéro avant de poser le sien, et deux états différents déclencheraient de toute façon une Combinaison qui les consomme. Au plus une des quatre lignes peut donc frapper, ce qui est bien ce que ces conditions disent."
    # Les quatre éléments à la même fourchette, publiée élément par élément.
    # Une ligne `active_at` ne se remplit pas depuis l'instantané, son cran ne
    # se déduisant pas d'une position.
    lines:
      - element: earth
        active_at: { resource: etat_terre, exactly: 1 }
        critical: [28, 31]
        normal: [23, 26]
      - element: fire
        active_at: { resource: etat_feu, exactly: 1 }
        critical: [28, 31]
        normal: [23, 26]
      - element: water
        active_at: { resource: etat_eau, exactly: 1 }
        critical: [28, 31]
        normal: [23, 26]
      - element: air
        active_at: { resource: etat_air, exactly: 1 }
        critical: [28, 31]
        normal: [23, 26]
    effects:
      - effect: damage
      # Les quatre vols s'excluent par la meme condition que les quatre lignes.
      - effect: gain
        resource: drain_force
        requires: { kind: target_has, resource: etat_terre }
      - effect: gain
        resource: drain_intelligence
        requires: { kind: target_has, resource: etat_feu }
      - effect: gain
        resource: drain_chance
        requires: { kind: target_has, resource: etat_eau }
      - effect: gain
        resource: drain_agilite
        requires: { kind: target_has, resource: etat_air }

