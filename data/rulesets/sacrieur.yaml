# Sacrieur.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: sacrieur
name: { fr: "Sacrieur", en: "Sacrieur" }

resources:
  - id: mutilation_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # AUCUNE `duration` : l'effet 138 porte `duration: -1`, il ne s'eteint pas.
    # C'est le seul etat permanent du parc.
    dofusdb_source: 12737
    modifies_damage:
      - kind: characteristic
        amount: 150
    note: |
      La Puissance que la Mutilation accorde, définitivement : « Sacrifie une
      partie de la vie du lanceur pour augmenter sa Puissance. » Effet 138 à 150
      au grade 3, sur le lanceur, `duration: -1`.

      Les points de vie sacrifiés ne sont pas comptés : ce calculateur mesure les
      dégâts portés, et voit les 150 Puissance sans leur prix. L'état de
      Mutilation qui monte chaque tour (états 1229 à 1231, qui alimentent le
      bouclier de la Coagulation) ne touche pas aux dégâts. Relancer le sort
      retire tout et lance la Coagulation : non modélisé, le solveur ne relançant
      jamais un sort dont il tire un bonus permanent.
  - id: pacte_de_sang_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Effet 138, duree 3 dans l'instantane, cible « C » : le lanceur, sans
    # condition. Copiee telle quelle, comme partout dans le parc.
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 12762
    modifies_damage:
      # Cent points de PUISSANCE, `dice_num` a 100. Pas d'element : la Puissance
      # n'en connait pas, elle entre dans le meme facteur que la caracteristique
      # et leve les cinq lignes. C'est ce qui la distingue d'un vol.
      - kind: characteristic
        amount: 100
    note: |
      La Puissance que le Pacte de Sang accorde au lanceur pour trois tours :
      « augmente la Vitalité et la Puissance du lanceur », sans condition, cible
      « C ». La Vitalité n'est pas comptée : elle ne change aucun dégât.

  - id: furie
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1171 : « 3 % Dommages finaux », un multiplicateur, donc applique
      # tout a la fin du pipeline et non dans l'arrondi caracteristique.
      - kind: final_multiplier
        percent: 103
        # Effet 1171, « % Dommages finaux » : ils s'additionnent à ceux des
        # Dofus et de l'équipement.
        finaux: true
    note: |
      « Augmente les dommages finaux du lanceur. » Trois pour cent pendant trois
      tours (effet 1171 au dernier grade), cumul 2 (`maxStack`) : le moteur
      applique les modificateurs par charge, et deux crans valent le double.

  - id: douleur_cuisante
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 138 : de la Puissance, donc DANS l'arrondi caracteristique.
      - kind: characteristic
        amount: 60
    note: |
      « Augmente la Puissance du lanceur. » Soixante pendant trois tours (effet
      138 au dernier grade), cumul 2 (`maxStack`) : deux crans valent le double.


  - id: nervosite_critique
    scope: caster
    max: 2
    default: 0
    monotone: increasing
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 115, valeur 7, durée 3 : sept points de taux de coup critique, le
      # seul modificateur qui ne touche aucun étage du calcul mais le tirage.
      - kind: critical_rate
        percent: 7
    note: |
      « Augmente les chances de Critique du lanceur », effet 115 de valeur 7
      pendant trois tours, cumul 2 (`maxStack`) : sept points de taux par cran,
      appliqués à l'écart entre un coup critique et un coup normal.

  - id: vulnerabilite_decimation
    scope: target
    max: 2
    default: 0
    monotone: increasing
    # Zéro tour veut dire « le tour de la pose, et lui seul » : la vulnérabilité
    # tient jusqu'au début du prochain tour du lanceur, qui n'en profite que dans
    # le même tour d'actions.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163, « Dommages subis x103 % » : un multiplicateur, donc tout a
      # la fin du pipeline.
      - kind: final_multiplier
        percent: 103
    note: |
      La vulnérabilité que Décimation pose sur sa cible, cumul 2 (`maxStack`) :
      tout ce qui tombe ensuite sur elle dans le même tour est multiplié par 1,03
      par cran.

  - id: vie_restante
    scope: caster
    max: 100
    default: 100
    monotone: increasing
    declared_by_player: true
    player_label: "Vie restante (%)"
    note: |
      La part de votre vie maximum qui vous reste, en pour cent, valable pour
      toute la rotation, soins et régénération compris ; le sacrifice du
      Châtiment ne la fait pas baisser. La vie maximum vient du build : 50, plus
      5 par niveau, plus la Vitalité.

  - id: erosion
    scope: caster
    max: 100
    default: 10
    monotone: increasing
    declared_by_player: true
    player_label: "Érosion (%)"
    note: |
      Votre taux d'érosion, en pour cent : 10 de base, davantage sous les malus
      subis. La vie érodée est ce taux appliqué à la vie perdue : à 60 % de vie et
      20 % d'érosion, 8 % de la vie maximum. Seule la Punition la lit.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "Seule la Couronne d'Epines la pose, en zone autour du lanceur, et elle n'a aucun effet dans ce calculateur : la rotation ne la lance pas. ⚠️ Si elle en recoit un, Fulgurance, Transposition et Penitence devront l'exiger absente."

