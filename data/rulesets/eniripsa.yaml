      Lorsqu'elle est détruite, elle occasionne des dommages selon son contenu aux ennemis et aux autres Fioles du lanceur en zone.
      
      Sur une Fiole pleine du lanceur : consomme le contenu de la Fiole.
      Sur une Fiole vide du lanceur : détruit la Fiole et rembourse le coût en PA.
      
      Utiliser le sort sur une Fiole rembourse l'utilisation du sort dans le tour.
    assumptions:
      - "Effet 3000, soins Terre : ce calculateur mesure les degats portes, pas les points de vie rendus. Aucun chiffre n'en depend."
      - "Effets 118, 119, 123 et 126 : +150 Force, Agilite, Chance et Intelligence pendant trois tours, sur la cible « a », c'est-a-dire un ALLIE et non le lanceur, dont les effets portent la marque « C » partout ailleurs dans ce fichier. Le bonus demande en outre que la Fiole soit attaquee PAR UN ALLIE. Ce calculateur resout un personnage seul : ni l'une ni l'autre condition ne se presente."
      - "Effet 1160 : lance aussi « Mot Alchimique », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les soins de ce sort ne sont pas modélisés : ce calculateur maximise les dégâts infligés, pas les points de vie."
