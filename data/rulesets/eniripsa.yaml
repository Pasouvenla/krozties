    assumptions:
      - "Effet 3000, soins Terre : ce calculateur mesure les degats portes, pas les points de vie rendus. Aucun chiffre n'en depend."
      - "Effet 414, +30 Dommages Poussée du lanceur par allié touché : la rotation est solo, aucun allié n'est touché, donc rien à compter."
      - "Trois modes de lancer, qui se partagent les deux lancers du tour. Sur une cible non peinte : 19 à 22 Terre, et la cible est peinte. Sur une cible peinte (effets 792 et 1160) : 19 à 22 à chaque ennemi du cercle de 2 cases, qui sont tous peints. Sur soi : 19 à 22, plus 8 par ennemi peint (cinq au plus), sur chaque ennemi peint, puis la Peinture disparaît (sous-sort 25924, grade 2)."
      - "Effets 950/951 : la Peinture (4440) dure deux tours et se compte en ennemis, jamais au-delà du nombre de cibles. Le sort ne part qu'une fois par cible : peindre un ennemi puis propager depuis lui attend le tour suivant, sauf s'il reste un autre ennemi déjà peint."
      - "Sans placement, les ennemis déclarés sont supposés dans le cercle de 2 cases de la cible propagée, comme pour toute zone : une propagation les peint tous."
      - "Effets 792/1160 : lance aussi « Peinture », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
