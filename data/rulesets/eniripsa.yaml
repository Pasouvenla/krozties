  - id: mot_secret
    dofusdb_id: 25882
    name: { fr: "Mot Secret", en: "Secret Word" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Soigne les alliés et occasionne des dommages Air aux ennemis en zone.
      Les soins et les dommages sont augmentés dans 2 tours si le sort n'est pas relancé au tour suivant.
      
      Augmente les soins finaux de toutes les Fées du lanceur si une entité est touchée.
    assumptions:
      - "Effets 293 et 3793, +30 dégâts de base, sur le compteur `mot_secret_maturation` : valeur 30, délai 2, durée 1, plus l'effet 406 qui annule quand on relance. Deux fourchettes, 28-32 nu et 58-62 « 1 charge - Dans 2 tours », 34-38 et 64-68 en critique : +30 sur les quatre bornes, à largeur constante."
      - "L'ABSTENTION est ce qui rendait ce sort difficile, et elle s'ecrit : un drapeau arme par le lancer, un compteur qui monte tant qu'il tient et que le lancer remet a zero. Le cran DEUX est la fenetre, le trois la fenetre manquee. Le solveur arbitre donc lui-meme entre relancer chaque tour et laisser murir, ce qu'aucune charge differee n'aurait permis : le moteur refuse de relancer un sort dont une charge est en vol."
      - "Effet 406 : il annule la maturation quand le sort est relance trop tot. Sans le bonus modelise, il n'a rien a annuler."
      - "Effet 3793 : l'autre moitie de la maturation ci-dessus, sans description officielle."
      - "Effet 2935, +30 soins de base : le pendant du bonus de degats ci-dessous, cote soins."
      - "Effet 2971, +25 % de Soins finaux : ce calculateur mesure les degats portes, pas les points de vie rendus."
      - "Effets 1160/2160 : lance aussi « Alchi-Rhétorique », « Mot Secret », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Les soins de ce sort ne sont pas modélisés : ce calculateur maximise les dégâts infligés, pas les points de vie."
    lines:
      - element: air
        active_at: { resource: mot_secret_maturation, exactly: 0 }
        critical: [34, 38]
        normal: [28, 32]
      - element: air
        active_at: { resource: mot_secret_maturation, exactly: 1 }
        critical: [34, 38]
        normal: [28, 32]
      - element: air
        active_at: { resource: mot_secret_maturation, exactly: 2 }
        critical: [64, 68]
        normal: [58, 62]
      - element: air
