# Eniripsa.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: eniripsa
name: { fr: "Eniripsa", en: "Eniripsa" }

resources:
  - id: mot_galvanisant_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 25745
    modifies_damage:
      - kind: characteristic
        amount: 150
    note: |
      La Puissance que le Mot Galvanisant accorde, pour deux tours : « Augmente
      la Puissance de l'allié ciblé et lui applique un bouclier et l'état
      Encouragé. » Effet 138 à 150 sur la cible « a » ; le lanceur peut se cibler
      lui-même, sa portée minimale étant de zéro. « Le cumul est partagé entre
      les Encouragements » : ce bonus ne s'additionne pas à celui d'un autre sort
      d'Encouragement, aucun autre n'étant écrit ici. Le bouclier et la Fée
      Galvanisante ne sont pas comptés.
  - id: moquerie
    scope: caster
    max: 3
    default: 0
    monotone: increasing
    gain_once_per_turn: true
    # « Les effets ne peuvent etre augmentes qu'une seule fois par tour. »
    # QUATRE sorts de la classe appliquent une Moquerie ; sans ce drapeau, en
    # lancer deux dans le meme tour donnerait deux crans au lieu d'un et le
    # Choeur Strident serait SURESTIME.
    dofusdb_source: 25861
    note: |
      Les crans du Chœur Strident : le sort « augmente ses dommages à
      l'application d'une Moquerie par le lanceur ou à la mort d'un de ses Feux
      Follets », et « les effets se décrémentent après utilisation du sort ». Le
      compteur monte d'un cran par tour au plus, et le Chœur en dépense un à
      chaque lancer : trois tours de Moqueries sans lancer remplissent les trois
      crans. Sans durée : seul le lancer consomme les crans.

      La seconde source, la mort d'un Feu Follet, n'est pas comptée : le compteur
      monte moins vite qu'en jeu, ce qui laisse le sort au plancher.


  - id: mot_secret_arme
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    note: |
      Le Mot Secret a ete lance au moins une fois : c'est ce qui autorise sa
      maturation a courir. Sans ce drapeau, `gain_per_turn` monterait des le
      premier tour et le tout premier lancer du combat toucherait le bonus sans
      l'avoir merite.

  - id: mot_secret_maturation
    scope: caster
    max: 3
    default: 0
    # NI CROISSANT NI DECROISSANT : le cran DEUX est le bon, le trois est la
    # fenetre manquee. Plus n'est pas mieux, le solveur ne doit pas l'elaguer
    # comme si ca l'etait.
    monotone: none
    gain_per_turn: 1
    gain_per_turn_while: mot_secret_arme
    dofusdb_source: 25882
    note: |
      La maturation du Mot Secret. « Les soins et les dommages sont augmentes
      DANS 2 TOURS si le sort n'est pas relance au tour suivant » : effet 293,
      valeur 30, DELAI 2 et DUREE 1 dans la donnee.

      Le compteur monte d'un cran par debut de tour tant que le sort a ete
      lance, et le lancer le remet a zero, ce qui est exactement l'effet 406
      « retire les effets du sort ». D'ou la lecture des quatre crans :

        0  le tour du lancer
        1  le tour suivant, trop tot
        2  LA FENETRE, deux tours apres, et le bonus vaut +30
        3  la fenetre est passee, la duree de 1 ayant expire

      Relancer au cran 1 ramene a zero et repousse la fenetre de deux tours :
      le solveur arbitre lui-meme entre un lancer de plus et un lancer plus
      fort, ce qui est precisement la question que pose ce sort.

      ⚠️ Une charge differee aurait ete le reflexe et aurait fausse le sort. Le
      moteur REFUSE de relancer un sort dont une charge est en vol, la ou le
      jeu autorise le relancement et se contente d'annuler la maturation : le
      sort aurait perdu un lancer sur deux au lieu d'un bonus.

  - id: peintures
    scope: target
    max: 30
    capped_by_targets: true
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Combien d'ennemis portent la Peinture du Pinceau Tribal, que la rotation
      pose et consomme elle-même, plafonné au nombre d'ennemis du scénario. La
      Peinture dure deux tours (effet 950, état 4440) ; le compteur n'a qu'une
      durée pour tous les ennemis, remise à neuf à chaque pose. Le lancer sur soi
      monte de 8 dégâts de base par ennemi peint, cinq au plus : 19-22 nu, puis
      27-30 à un cran, jusqu'à 59-62 à cinq.

  - id: pinceau_cibles
    scope: caster
    max: 30
    capped_by_targets: true
    default: 0
    monotone: decreasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Combien d'ennemis le Pinceau Tribal a déjà visés dans le tour. Le sort part
      une fois par cible : on ne peint pas un ennemi pour propager depuis lui dans
      le même tour, il faut un autre ennemi peint. Tout ennemi visé est peint (le
      premier mode peint sa cible, le second vise une cible déjà peinte) : il
      reste un ennemi peint et libre tant que `peintures` dépasse ce compteur.
      Remis à zéro à la fin du tour.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "Aucun sort de l'Eniripsa ne la pose."
  - state: 4190
    name: "Lapino Invoque et limite atteinte"
    note: "Pose quand le Lapino est invoque et la limite atteinte. Le Mot d'Amitie n'a aucun effet dans ce calculateur : la rotation ne le lance pas."
  - state: 4192
    name: "Fiole Alchimique Invoquee et limite atteinte"
    note: "Pose quand la Fiole est invoquee et la limite atteinte. Les degats du Mot Alchimique ne sont pas chiffres (lignes inconnues) : la rotation n'en tire rien et ne le relance pas au-dela de la limite."

