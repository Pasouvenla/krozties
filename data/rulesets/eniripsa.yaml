        critical: unknown
        normal: unknown
    effects:
      - effect: damage
      - effect: gain
        resource: peintures
      - effect: gain
        resource: pinceau_cibles
    mode_name: { fr: "sur une cible non peinte", en: "on an unpainted target" }
    blocked_at_max: peintures
    modes:
      - name: { fr: "sur une cible peinte", en: "on a painted target" }
        requires_more_than: { resource: peintures, than: pinceau_cibles }
        lines:
          - element: earth
            critical: unknown
            normal: unknown
        effects:
          - effect: damage
          - effect: gain
            resource: peintures
            up_to_zone: true
          - effect: gain
            resource: pinceau_cibles
      - name: { fr: "sur soi", en: "on self" }
        on_self: true
        requires: { kind: caster_has, resource: peintures }
        lines:
          - element: earth
            repeats_per: peintures
            differs_from_snapshot: "La consommation est le sous-sort 25924 (grade 2), qui frappe chaque ennemi peint : sa ligne ne se tire pas de celles du sort, ses fourchettes viennent de DofusDB."
            # Une frappe par ennemi peint, que `repeats_per` compte, chacune sur la
            # seule case de son ennemi : le cercle de taille 2 du sort est celui de la
            # propagation, et le prendre ici compterait chaque ennemi plusieurs fois.
            area: { shape: P, size: 1, max_targets: 1 }
            critical: [23, 26]
            normal: [19, 22]
            base_bonus:
              - kind: steps
                resource: peintures
                steps: [8, 8, 8, 8, 8, 0]
        effects:
          - effect: damage
          - effect: reset
            resource: peintures

