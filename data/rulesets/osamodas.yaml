# Osamodas.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: osamodas
name: { fr: "Osamodas", en: "Osamodas" }

resources:
  - id: pacte_bestial_pa
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Effet 111, duree 3 dans l'instantane, cible « C ».
    duration: { turns: 3, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 31141
    grants_ap: 2
    note: |
      Les deux PA que le Pacte Bestial donne au lanceur : « Applique l'état
      Bestial sur le lanceur : augmente ses PA », sans condition (cible « C »).
      Les PA ouvrent chaque tour où l'état tient, là où `ap_bonus` rend des PA
      dans le tour du lancer. « La durée de l'état et du bonus PA est prolongée
      si le lanceur invoque une créature Osamodas » : une invocation lancée sous
      l'état les fait repartir pour trois tours (voir `bestial`). Relancé sous
      l'état, le Pacte les retire.

  - id: bestial
    name: { fr: "Bestial", en: "Bestial" }
    scope: caster
    max: 1
    default: 0
    # Effet 950 du sous-sort 32557 (rang 1), duree 3 : trois tours de jeu.
    duration:
      turns: 2
      refresh: on_apply
      on_expire: reset_to_default
      # Rang 9 du sous-sort, lance a la fin de l'etat : effet 1045 sur les
      # quatorze sorts d'invocation, relance fixee a zero.
      then_reset_cooldowns: [tofu, bouftou, crapipou, dragoune, ventritofu, bouflourd, crapipaud, dragonnet, craquolosse, crocolereux, sulfenix, scarafoudre, esprit_glouton, esprit_facetieux]
    game_states: [6295]
    note: |
      L'état Bestial du Pacte Bestial (6295). Le Pacte n'agit que par son
      sous-sort 32557 : les effets 950, 111, 1171, 2971 et 90 du sort lui-même
      sont `forClientOnly`, pour l'infobulle.

      * Lancé sans l'état (rang 1, cible « C,e6295 ») : l'état pour trois tours,
        les PA (`pacte_bestial_pa`), et le sacrifice des invocations en jeu.
      * Lancé sous l'état (rang 9, cible « C,E6295 ») : il retire tous ses
        effets et remet la relance des sorts d'invocation à zéro, sans rien
        reposer : une bascule.
      * Une invocation Osamodas lancée sous l'état est sacrifiée aussitôt (rang
        3, déclencheur « CI ») et relance le rang 1 : l'état et les PA repartent
        pour trois tours (`maxStack` 1 sur les PA). C'est la « durée prolongée »
        du texte.
      * À la fin de l'état, la relance des sorts d'invocation retombe à zéro.

  - id: pacte_bestial_finaux
    name: { fr: "Pacte Bestial", en: "Bestial Pact" }
    scope: caster
    max: 90
    default: 0
    monotone: increasing
    modifies_damage:
      # Effet 1171 des rangs 5, 6 et 7 du sous-sort : 3, 6 ou 9 % de dommages
      # finaux par invocation sacrifiee, selon son palier. Un cran vaut 3 %.
      - kind: final_multiplier
        percent: 103
        finaux: true
    note: |
      Les dommages finaux du Pacte Bestial, en crans de 3 % : chaque invocation
      Osamodas sacrifiée en donne un par palier de PI (un Tofu 3 %, un Ventritofu
      6 %, un Craquolosse 9 %), pour trois tours, cumulables sans limite (rangs 5
      à 7 du sous-sort 32557, `maxStack` -1). Le total porte le bonus ; la chaîne
      `pacte_bestial_sacrifices` fait vieillir chaque sacrifice et retire du total
      ceux qui arrivent à leur terme. Les gains viennent de la Rotation, qui sait
      quelles invocations sont en jeu. Les soins finaux (2971) et le transfert de
      vie (90) ne sont pas des dégâts.

  - id: pacte_bestial_sacrifices
    scope: caster
    max: 30
    default: 0
    shifts_into: pacte_bestial_sacrifices_1
    note: |
      Les crans du Pacte Bestial gagnes ce tour-ci. Voir `pacte_bestial_finaux`.

  - id: pacte_bestial_sacrifices_1
    scope: caster
    max: 30
    default: 0
    shifts_into: pacte_bestial_sacrifices_2

  - id: pacte_bestial_sacrifices_2
    scope: caster
    max: 30
    default: 0
    drains: pacte_bestial_finaux
    note: |
      Les crans gagnes deux tours plus tot : ils vivent leur troisieme et
      dernier tour, puis quittent le total.

  - id: cortege_sauvage
    name: { fr: "Cortège Sauvage", en: "Wild Procession" }
    scope: caster
    max: 1
    default: 0
    # Effets 182 et 285 (sous-sort 32555, rang 2), duree 2 : deux tours de jeu.
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Cortège Sauvage : -1 PA sur les quatorze sorts d'invocation (effet 285,
      sous-sort 32555) et +3 Invocations (effet 182), pour le tour du lancer et le
      suivant.

  - id: cortege_sauvage_morts
    scope: caster
    max: 1
    default: 0
    # Le rang 1 du sous-sort 32555 (effet 141, « tue la cible » sur les
    # invocations 8070 a 8083) part au debut des deux tours qui suivent le
    # lancer, delais 1 et 2.
    duration: { turns: 2, refresh: on_apply, on_expire: reset_to_default }
    note: |
      « Toutes les invocations Osamodas meurent au debut du tour du lanceur
      tant qu'il est sous les effets du sort » : au debut des deux tours qui
      suivent le lancer, apres avoir joue le leur. Les compteurs des
      invocations s'y accrochent par `reset_at_turn_start_while`, que la
      Rotation pose.

  - id: pics_du_prespic
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 115, valeur 10, duree 2 : dix points de TAUX de coup critique.
      - kind: critical_rate
        percent: 10
    note: |
      « Augmente egalement les Critiques du lanceur et de l'allie cible. » Seule
      la moitie du lanceur compte ici, ce calculateur ne resolvant qu'une
      rotation solo.

  - id: morsure_du_serpent
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    while_present:
      - trigger: turn_start
        lines:
          - element: water
            critical: [22, 24]
            normal: [19, 21]
        note: |
          Le poison, au debut du tour de la cible, deux tours de duree.
    note: |
      « Augmente les dommages subis par la cible et lui applique un poison Eau de
      début de tour. » Le sort ne frappe pas au lancer : sa seule ligne est celle
      du poison, « Début de tour », durée 2, et ses 19-21 sont ceux du poison. Le
      malus de dommages subis est à part, dans `morsure_du_serpent_vulnerabilite` :
      la donnée le pose pour le seul tour du lancer, le poison pour deux.

  - id: morsure_du_serpent_vulnerabilite
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Effet 1163 à durée 0 : le tour du lancer seulement, comme le Bond du Iop.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 1163 a 104 : les dommages subis par la cible sont multiplies par
      # 1,04.
      - kind: final_multiplier
        percent: 104
    note: |
      Le malus de dommages subis de la Morsure du Serpent, séparé de son poison :
      leurs durées diffèrent dans la donnée.

  - id: cri_de_l_ours
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 138 : de la Puissance, dans l'arrondi caracteristique.
      - kind: characteristic
        amount: 150
    note: |
      « Augmente egalement la Puissance du lanceur et des allies cibles » : 150
      pendant deux tours, Cumul 1.

  - id: dents_du_piranya
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    modifies_damage:
      # Effet 112 : des Dommages fixes, APRES l'arrondi caracteristique.
      - kind: flat_damage
        amount: 20
    note: |
      « Augmente egalement les Dommages du lanceur et des allies cibles » : 20
      pendant deux tours, Cumul 1. Fixe, donc bien moins fort que la Puissance
      du Cri de l'Ours a magnitude comparable.


states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "Aucun sort de l'Osamodas ne la pose : elle viendrait d'un adversaire, et la cible est passive."
  - state: 6322
    name: "Esprit Facetieux"
    note: "L'etat du Gobgob Facetieux en vie. L'Esprit Facetieux n'a aucun effet dans ce calculateur (degats d'invocation non comptes) : la rotation ne le lance pas, donc jamais une seconde fois."
  - state: 6323
    name: "Esprit Glouton"
    note: "L'etat du Gobgob Glouton en vie. Meme raison que l'Esprit Facetieux."

