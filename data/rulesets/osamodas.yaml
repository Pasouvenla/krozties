  - id: pacte_bestial
    dofusdb_id: 31141
    name: { fr: "Pacte Bestial", en: "Bestial Pact" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    cooldown_turns: 2
    initial_cooldown: 1
    crit: { base_rate: 0, can_crit: false }
    note: |
      Applique l'état Bestial sur le lanceur :
      • Augmente ses PA.
      • Sacrifie toutes ses présentes et futures invocations Osamodas pour augmenter ses dommages et soins finaux.
      • Transfère une partie de la vie des invocations sacrifiées vers le lanceur.
      • Les effets sont plus importants selon le coût en PI de l'invocation.
      
      Les Gobgobs ne sont pas affectés par le sort.
      La durée de l'état et du bonus PA est prolongée si le lanceur invoque une créature Osamodas.
      Le temps de relance des sorts d'invocation Osamodas est réinitialisé et les effets du sort sont retirés à la perte de l'état ou si le sort est relancé.
    assumptions:
      - "Effet 111, +2 PA au lanceur pendant trois tours, sur l'état `pacte_bestial_pa` : cible « C », « applique l'état Bestial sur le lanceur : augmente ses PA », sans condition. Une invocation lancée sous l'état les fait repartir pour trois tours."
      - "D'après le sous-sort 32557 : l'état Bestial (`bestial`), le sacrifice des invocations Osamodas et leurs dommages finaux (`pacte_bestial_finaux`, 3 % par palier de PI et par invocation, trois tours chacun). Relancé sous l'état, il retire tout et remet la relance des sorts d'invocation à zéro. Le sacrifice et ses dommages finaux se branchent dans la Rotation, avec les invocations du deck. À vérifier en jeu : Tofu (palier 1) et Craquolosse (palier 3) sacrifiés, +12 % de dommages finaux pendant trois tours ?"
      - "Effets 950, 111, 1171, 2971 et 90 du sort lui-meme : `forClientOnly`, l'infobulle. Le sort agit par son sous-sort 32557."
      - "Effets 2971 (soins finaux) et 90 (transfert de vie des invocations sacrifiees) : pas des degats."
    lines: []
    effects:
      # Relance sous Bestial (rang 9) : il retire tous ses effets et remet la
      # relance des sorts d'invocation, sans rien reposer. Lus AVANT la bascule
      # de la fin.
      - effect: reset
        resource: pacte_bestial_finaux
        requires: { kind: caster_has, resource: bestial }
      - effect: reset
        resource: pacte_bestial_sacrifices
        requires: { kind: caster_has, resource: bestial }
      - effect: reset
        resource: pacte_bestial_sacrifices_1
        requires: { kind: caster_has, resource: bestial }
      - effect: reset
        resource: pacte_bestial_sacrifices_2
        requires: { kind: caster_has, resource: bestial }
      - effect: reset
        resource: pacte_bestial_pa
        requires: { kind: caster_has, resource: bestial }
      - effect: reset_cooldowns
        spells: [tofu, bouftou, crapipou, dragoune, ventritofu, bouflourd, crapipaud, dragonnet, craquolosse, crocolereux, sulfenix, scarafoudre, esprit_glouton, esprit_facetieux]
        requires: { kind: caster_has, resource: bestial }
      # Premier lancer (rang 1) : les PA. Le sacrifice des invocations en jeu
      # s'insere ici, depuis la Rotation.
      - effect: gain
        resource: pacte_bestial_pa
        requires: { kind: exactly, resource: bestial, amount: 0 }
      - effect: toggle
        resource: bestial

