  - id: distillation
    dofusdb_id: 12815
    name: { fr: "Distillation", en: "Distillation" }
    ap_cost: { base: 4 }
    casts_per_turn: 1
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages et applique un poison Eau de début de tour sur les cibles en zone.
      N'affecte pas le lanceur.
      
      Les dommages du sort et du poison sont augmentés pour chaque poison du sort déclenché sur une cible (cumulable 4 fois).
      
      Les bonus sont retirés après utilisation du sort.
    assumptions:
      - "Effet 96 au déclencheur « TB », Eau 13-16 (17-20 en critique), durée 3, sur l'état `distillation_poison` : « applique un poison Eau de début de tour sur les cibles en zone », la seconde des deux lignes Eau, « Tous sauf lanceur - Début de tour »."
      - "Effet 406 : le sort retire les effets qu'il a lui-meme poses. Sans mecanique modelisee derriere, il n'a rien a retirer."
      - "Effet 1160 : lance aussi « Distillation », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Effets 293 et 3793, +4 dégâts de base par cran, sur les deux lignes, le coup immédiat et le poison (« les dommages du sort et du poison sont augmentés »). Le cran se compte par ennemi touché au-delà du premier : le palier le plus bas s'appelle « 2 cibles sous poison » et vaut 17-20 quand le lancer nu vaut 13-16, soit un seul cran pour deux cibles. Même convention que le Muspel du Forgelance."
      - "Le drapeau `distillation_crans` s'arme avec un tour de retard, parce que le poison se declenche au DEBUT du tour de la cible : le tout premier lancer du combat ne peut rien avoir declenche et sort a 13-16, quel que soit le nombre d'ennemis. Un bonus replie a la compilation, comme celui du Muspel, aurait paye ce premier lancer plein tarif."
      - "Un palier de trop est publié : de « 2 cibles sous poison » à « 6 cibles sous poison », soit cinq crans à +4, quand le texte du sort dit « cumulable 4 fois ». Le fichier suit le texte et plafonne à quatre crans, donc +16 : au-delà de cinq ennemis touchés, il sous-estime de 4 points de base. À vérifier en jeu."
      - "Le poison se fige à la pose : il garde le bonus du lancer qui l'a posé, et celui du tout premier lancer, posé à vide, reste nu à chacune de ses frappes."
      - "⚠️ Si le Pandawa saute un tour, le drapeau tombe alors que le poison, lui, dure trois tours et continue de se declencher. Le lancer qui suit une pause sort donc nu ici, quand le jeu lui donnerait ses crans. Sous-estimation, et le solveur ne choisit de toute facon pas de sauter un tour avec le sort de degats de zone de la classe."
    lines:
      - element: water
        critical: unknown
        normal: unknown
        base_bonus:
          - kind: per_extra_target_while
            resource: distillation_crans
            amount: 4
            cap: 4
    effects:
      - effect: damage
      # Le poison se fige a la pose : il porte le bonus de CE lancer.
      - effect: reset
        resource: distillation_poison_renforce
      - effect: gain
        resource: distillation_poison_renforce
        requires: { kind: caster_has, resource: distillation_crans }
      # Le bonus sert a ce lancer, puis il est retire.
      - effect: reset
        resource: distillation_crans
      - effect: gain
        resource: distillation_poison
      # Le poison pose maintenant se declenchera au debut du tour des cibles,
      # donc avant le prochain tour du Pandawa : `delay: 1`.
      - effect: schedule_gain
        resource: distillation_crans
        delay: 1

