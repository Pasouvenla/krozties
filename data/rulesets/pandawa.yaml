# Pandawa.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: pandawa
name: { fr: "Pandawa", en: "Pandawa" }

resources:
  - id: paume_explosive_lancee
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # `turns: 0` veut dire « le tour de la pose, et lui seul » : l'etat marque
    # que le sort a deja ete lance CE tour-ci, et il est parti au suivant. Une
    # duree de 1 le ferait vivre tout le tour d'apres, si bien que le premier
    # lancer du tour deux se paierait deja au prix fort.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Etats « Paume Explosive Sobre » (3532) et « Paume Explosive Saoul »
      (3533), effet 950 de duree 1 dans l'instantane. Ils marquent que la Paume
      a deja ete lancee dans le tour, et c'est le sort lui-meme qui les lit pour
      savoir s'il doit couter plus cher.

      Un seul compteur ici plutot que deux : les deux etats disent la meme
      chose, chacun dans son regime d'ebriete, et le surcout est le meme des
      deux cotes. La zone, que seul l'etat Sobre commande, se lit sur
      `paume_explosive_sobre` ; le bonus de degats reste declare sur le sort.

  - id: paume_explosive_sobre
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Meme duree que `paume_explosive_lancee` : le tour du lancer, et lui seul.
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      État « Paume Explosive Sobre » (3532) : la Paume a été lancée sous Sobre
      dans ce tour. La donnée en fait la condition de sa zone : une seule case
      sans lui (masque `*e3532`), un cercle de taille 2 avec (`*E3532`), aux mêmes
      dégâts. À part de `paume_explosive_lancee`, qui compte les lancers des deux
      régimes : une Paume lancée Saoul ne l'arme pas.

  - id: distillation_crans
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Le poison se déclenche au début du tour de la cible, donc entre deux tours
    # du Pandawa. « Les bonus sont retirés après utilisation du sort » : le
    # drapeau tient jusqu'au lancer suivant, qui le consomme, et ce lancer le
    # réarme pour le tour d'après. Sans durée.
    note: |
      Drapeau de presence, pas un compteur : il dit que le poison de la
      Distillation s'est declenche depuis le dernier lancer. Ce que vaut le
      bonus ne se lit pas ici mais sur les lignes, `per_extra_target_while`
      multipliant par le nombre d'ennemis annonce.

      « Les dommages du sort et du poison sont augmentes pour chaque poison du
      sort declenche sur une cible (cumulable 4 fois). » Le tout premier lancer
      du combat ne peut rien avoir declenche : il sort nu, et c'est la raison
      d'etre de ce drapeau plutot qu'un bonus replie a la compilation.

  - id: distillation_poison
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration:
      turns: 2
      refresh: on_apply
      on_expire: reset_to_default
    while_present:
      - trigger: turn_start
        lines:
          - element: water
            # Le poison ne décroît pas avec la distance : l'instantané donne
            # `falloff_percent: 0` sur cette ligne, là où le coup immédiat porte les
            # 10 % habituels. Carré de taille 1, neuf cases : l'effet 1160 de la donnée,
            # qui pose le poison.
            area: { shape: G, size: 1, max_targets: 9 }
            critical: [17, 20]
            normal: [13, 16]
            # « Les dommages du sort et du poison sont augmentés » : le texte
            # nomme les deux, et chaque palier « N cibles sous poison » range les
            # deux lignes. Le bonus du lancer qui l'a posé, pas celui du moment où
            # il tombe : voir `distillation_poison_renforce`.
            base_bonus:
              - kind: per_extra_target_while
                resource: distillation_poison_renforce
                amount: 4
                cap: 4
        note: |
          Le poison de début de tour : « Occasionne des dommages et applique un poison
          Eau de début de tour sur les cibles en zone. » L'instantané porte deux
          lignes Eau 13-16, l'une au déclenchement « I », l'autre au déclenchement
          « TB », étiquetées « Tous sauf lanceur » et « Tous sauf lanceur - Début de
          tour », la seconde avec une durée de 3 : le coup immédiat et le poison.

  - id: distillation_poison_renforce
    scope: target
    max: 1
    default: 0
    monotone: increasing
    # Un tour de plus que le poison : celui-ci frappe une derniere fois au
    # debut du tour ou sa duree s'acheve, et ce drapeau doit encore y etre lu.
    duration: { turns: 3, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Le poison posé porte le bonus du lancer qui l'a posé, figé à la pose : celui
      du tout premier lancer du combat, posé sans bonus, reste sans bonus à
      chacune de ses frappes, même une fois `distillation_crans` armé.

  - id: saoul
    # Saoul (498) quand il vaut un, Sobre (3531) quand il vaut zéro : cinq sorts
    # exigent Saoul, quatre Sobre (Karcham et Chamrak pour porter, Stabilisation,
    # Varappe). Sobre au début du combat.
    game_states: [498]
    game_states_when_zero: [3531]
    scope: caster
    max: 1
    default: 0
    monotone: none
    # Deux tours : posé au tour N, il disparaît au début du tour N+2. En
    # retombant, il pose « sorti de Saoul » pour le tour qui s'ouvre, comme le
    # déclencheur EOFF498 du jeu.
    duration:
      turns: 1
      refresh: on_apply
      on_expire: reset_to_default
      then_gain: sorti_de_saoul
    note: |
      L'état Saoul (498), le cœur du Pandawa. Cinq de ses sorts offensifs frappent
      plus fort sous cet état, chaque fourchette étant étiquetée « Lanceur sous
      Sobre » ou « Lanceur sous Saoul », la Sobre toujours la plus basse.

      Sans durée : on reste Saoul jusqu'à ce qu'un sort rende Sobre, Picole et
      Bombance, qui basculent de l'un à l'autre, la Gueule de Bois, le Lait de
      Bambou et la Prohibition. Un régime et non un buff qui expire, ce que
      `monotone: none` dit au solveur : porter l'état n'est pas toujours
      préférable.

      La Main de Pandawa est l'exception : 70 dans le meilleur élément sous Sobre
      et 7 dans chacun des cinq sous Saoul, donc plus fort à jeun. Elle est
      traitée à part.


  - id: porteur
    # Porteur (3), qu'exigent les cinq sorts qui jettent ce que le Pandawa
    # porte : Propulsion, Pandikulation, Eau-de-vie, Brancard, Cascade.
    game_states: [3]
    # Drapeau preventsSpellCast de l'etat : en portant, on ne fait que jeter.
    prevents_spell_cast: true
    scope: caster
    max: 1
    default: 0
    monotone: none
    note: |
      Le Pandawa porte-t-il quelque chose ? Karcham et Chamrak le font porter
      (effet 950 sur 3, sans durée), et cinq sorts à dégâts « jettent la
      cible » : sans rien porter, le jeu les refuse (condition HS=3 de la donnée).

      L'état porte le drapeau `preventsSpellCast` : tant qu'il porte, le Pandawa
      ne lance que les sorts dont la condition exige Porteur, Karcham, Chamrak et
      les cinq qui jettent. Karcham exige une cible : la rotation porte l'ennemi
      qu'elle frappe, ou un allié présent.

      Ce qui est porté n'est pas simulé (la cible, un allié, le Tonneau de
      l'Ivresse ou de l'Ébriété, un Bambou) : la rotation suppose que le jet tombe
      de façon à ce que la zone touche la cible. Porter son Tonneau rend 1 PA et le
      jeter rend Saoul : ni l'un ni l'autre n'est compté.

  - id: prohibition
    # Prohibition (3536), que Picole et Bombance exigent absente.
    game_states: [3536]
    scope: caster
    max: 1
    default: 0
    monotone: none
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      L'état que la Prohibition pose sur le lanceur, durée 1 dans la donnée : le
      tour du lancer seulement. Il « empêche l'entrée dans l'état Saoul » : les
      cinq gains de Saoul l'exigent absent.

  - id: sorti_de_saoul
    # « Gueule de Bois » (3577) : le Pandawa est sorti de l'etat Saoul ce
    # tour-ci. La Gueule de Bois frappe plus fort sous cet etat.
    game_states: [3577]
    scope: caster
    max: 1
    default: 0
    monotone: none
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    note: |
      Le sous-sort « Gueule de Bois » (24248) pose l'état 3577 sur le lanceur
      chaque fois que Saoul le quitte, par un déclencheur « EOFF498 » (24247). La
      Gueule de Bois lit l'état dans ses lignes : 34-37 au lieu de 24-27. Le tour
      en cours seulement, comme le dit le texte du sort (« si le lanceur est sorti
      de l'état Saoul pendant le tour en cours »), bien que la donnée porte une
      durée de 1. Picole, Bombance, Gueule de Bois, Lait de Bambou et Prohibition
      le posent quand le Pandawa était Saoul.


states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 8
    name: "Porte"
    note: "Le Pandawa n'est porte que par un allie, ou par son Bambou ou son Pandawasta s'il les frappe au contact : la rotation ne fait ni l'un ni l'autre."
  - state: 534
    name: "Goule Anerice"
    note: "Aucun sort du Pandawa ne le pose."
  - state: 661
    name: "Porte Bambou"
    note: "Le Bambou porte le Pandawa Sobre qui le frappe au contact, et la rotation ne frappe pas ses invocations."

spells:
  - id: ivresse
    dofusdb_id: 12777
    name: { fr: "Ivresse", en: "Drunkenness" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    crit: { base_rate: 0, can_crit: false }
    note: |
      Invoque un Tonneau qui soigne son invocateur lorsqu'il est porté et le rend Saoul quand il est jeté.
      Le lanceur soigne également ses alliés en zone autour du point d'impact.
      
      Rend 1 PA au lanceur s'il porte son Tonneau.
      
      Si le Tonneau du lanceur est encore présent et que le sort est relancé, l'ancien est détruit pour laisser place au nouveau.
    assumptions:
      - "Effets 950 et 951, états « Saoul » (498) et « Sobre » (3531) : le régime du Pandawa. Cinq sorts offensifs portent deux fourchettes selon lui, et la ressource `saoul` décide laquelle s'applique."
    lines: []
    effects: []

  - id: picole
    dofusdb_id: 12780
    name: { fr: "Picole", en: "Boozer" }
    ap_cost: { base: 1 }
    casts_per_turn: 6
    crit: { base_rate: 0, can_crit: false }
    note: |
      Rend le lanceur Saoul ou Sobre.
      Augmente ses PM s'il devient Sobre.
    assumptions:
      - "Effets 950 et 951, états « Saoul » (498) et « Sobre » (3531) : le régime du Pandawa. Cinq sorts offensifs portent deux fourchettes selon lui, et la ressource `saoul` décide laquelle s'applique."
      - "Effet 792 : lance « Saoul » (24036) si le lanceur est Sobre, « Sobre » (24037) s'il est Saoul, les deux masques lus avant le lancer : une bascule (effet `toggle`). Le PM gagné en redevenant Sobre (effet 128) n'est pas compté, ce calculateur ne simulant pas les déplacements."
    lines: []
    effects:
      - effect: toggle
        resource: saoul
      # Redevenu Sobre : sorti de Saoul ce tour-ci.
      - effect: gain
        resource: sorti_de_saoul
        requires: { kind: exactly, resource: saoul, amount: 0 }

  - id: paume_explosive
    dofusdb_id: 12781
    name: { fr: "Paume Explosive", en: "Explosive Palm" }
    ap_cost:
      base: 2
      # Effet 296, « +1 PA au cout du sort apres le premier lancer », cumulable
      # une fois. Le compteur se pose au lancer et se lit AVANT les effets du
      # suivant, si bien que le lancer qui le pose se paie encore 2 PA.
      increased_by: { resource: paume_explosive_lancee, per_stack: 1, ceiling: 1 }
    casts_per_turn: 3
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Feu.
      N'affecte pas le lanceur.
      
      Modifie le sort selon l'état du lanceur après un lancer :
      • Le coût en PA du sort est augmenté après le premier lancer.
      • Sobre : les dommages s'appliquent en zone.
      • Saoul : les dommages du sort sont augmentés.
      
      Chaque effet est cumulable une fois.
    assumptions:
      - "Effets 950 et 951, etats « Paume Explosive Sobre » (3532) et « Saoul » (3533) : ils marquent que le sort a deja ete lance ce tour-ci, chacun dans son regime, et le sort les lit lui-meme pour savoir s'il doit couter plus cher et frapper plus fort."
      - "Effet 1160 : lance aussi « <color=#e6893d>État Saoul :</color> », « <color=#e6893d>État Sobre :</color> », « Change la zone d'effet en Cercle de taille 2 », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
      - "Effet 293, +12 dégâts de base, à une condition à deux termes : « Saoul » et absence de « Paume Explosive Saoul » (cible `C,*E498,*e3533`), écrite en `all_of`. Deux fourchettes, 20-22 nu et 32-34 à une charge, largeur constante des deux côtés comme un bonus de dégâts de base."
      - "L'état Sobre (3532) ne change pas les dégâts, il change la zone : les deux lignes de la donnée portent 20-22 et ne diffèrent que par leur forme, une seule case sans l'état, Cercle de taille 2 avec. Le compteur `paume_explosive_sobre` suit l'état, et les deux lignes Sobre portent chacune leur zone."
      - "Effet 296, +1 PA après le premier lancer : le sort vaut 2 PA, puis 3, puis 3, ce qui n'en laisse tenir que deux dans un tour à 7 PA."
    lines:
      # Quatre lignes qui s'excluent. Sous Sobre, la zone suit l'etat 3532 : une
      # case au premier lancer Sobre du tour, un cercle de taille 2 ensuite
      # (masques `*e3532` et `*E3532` de la donnee, degressif de 10 % par cran
      # sur quatre crans comme elle). Sous Saoul, une case, et le bonus au
      # premier lancer. Les zones sont ECRITES ici parce que la donnee porte
      # deux zones pour la meme fourchette : la fusion ne sait pas laquelle.
      - element: fire
        active_at:
          all_of:
            - { resource: saoul, exactly: 0 }
            - { resource: paume_explosive_sobre, exactly: 0 }
        area: { shape: P, size: 1, max_targets: 1, falloff_percent: 10, falloff_steps: 4 }
        critical: [24, 26]
        normal: [20, 22]
      - element: fire
        active_at:
          all_of:
            - { resource: saoul, exactly: 0 }
            - { resource: paume_explosive_sobre, exactly: 1 }
        area: { shape: C, size: 2, max_targets: 13, falloff_percent: 10, falloff_steps: 4 }
        critical: [24, 26]
        normal: [20, 22]
      - element: fire
        active_at:
          all_of:
            - { resource: saoul, exactly: 1 }
            - { resource: paume_explosive_lancee, exactly: 1 }
        area: { shape: P, size: 1, max_targets: 1, falloff_percent: 10, falloff_steps: 4 }
        critical: [24, 26]
        normal: [20, 22]
      # Le bonus : Saoul, et le sort pas encore lance dans le tour.
      - element: fire
        active_at:
          all_of:
            - { resource: saoul, exactly: 1 }
            - { resource: paume_explosive_lancee, exactly: 0 }
        area: { shape: P, size: 1, max_targets: 1, falloff_percent: 10, falloff_steps: 4 }
        critical: [36, 38]
        normal: [32, 34]
    effects:
      - effect: damage
      - effect: gain
        resource: paume_explosive_lancee
      # L'etat 3532 : lancee sous Sobre ce tour-ci.
      - effect: gain
        resource: paume_explosive_sobre
        requires: { kind: exactly, resource: saoul, amount: 0 }

  - id: schnaps
    dofusdb_id: 12782
    name: { fr: "Schnaps", en: "Schnaps" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Air et applique des effets sur les cibles selon l'état du lanceur en zone :
      • Sobre : retire du Retrait PA et PM.
      • Saoul : réduit les Résistances Poussée.
      
      N'affecte pas le lanceur.
    assumptions:
      - "Effet 417, -30 de la Resistance Poussee sur les cibles : le sort applique des effets differents selon le regime du lanceur, Sobre ou Saoul. Aucun des trois ne touche a ce qu'on inflige : ils changent ce que la cible resiste ou retire."
      - "Effet 413, -30 du Retrait PM sur les cibles : le sort applique des effets differents selon le regime du lanceur, Sobre ou Saoul. Aucun des trois ne touche a ce qu'on inflige : ils changent ce que la cible resiste ou retire."
      - "Effet 411, -30 du Retrait PA sur les cibles : le sort applique des effets differents selon le regime du lanceur, Sobre ou Saoul. Aucun des trois ne touche a ce qu'on inflige : ils changent ce que la cible resiste ou retire."
      - "Effet 1160 : lance aussi « <color=#e6893d>État Saoul :</color> », « <color=#e6893d>État Sobre :</color> », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      - element: air
        critical: unknown
        normal: unknown
    effects:
      - effect: damage

  - id: epouvante
    dofusdb_id: 12783
    name: { fr: "Épouvante", en: "Terror" }
    ap_cost: { base: 2 }
    casts_per_turn: 3
    casts_per_target: 1
    crit: { base_rate: 0, can_crit: false }
    note: |
      Repousse la cible et applique des effets sur la cible selon l'état du lanceur :
      • Sobre : la poussée est plus importante.
      • Saoul : réduit les chances de Critique.
    assumptions:
      - "Effet 1160 : lance aussi « <color=#e6893d>État Saoul :</color> », « <color=#e6893d>État Sobre :</color> », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines: []
    effects: []

  - id: souffle_alcoolise
    dofusdb_id: 12784
    name: { fr: "Souffle Alcoolisé", en: "Alcoholic Breath" }
    ap_cost: { base: 3 }
    casts_per_turn: 2
    crit: { base_rate: unknown }
    note: |
      Occasionne des dommages Air aux ennemis et repousse les cibles en zone.
      
      La portée du sort est réduite de moitié mais les dommages sont plus importants si le lanceur est Saoul.
    assumptions:
      - "Effet 1160 : lance aussi « <color=#e6893d>État Saoul :</color> », « <color=#e6893d>État Sobre :</color> », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      # Deux régimes, jamais les deux : la première « Lanceur sous Sobre », la
      # seconde « Lanceur sous Saoul ».
      - element: air
        active_at: { resource: saoul, exactly: 0 }
        critical: [34, 38]
        normal: [28, 32]
      - element: air
        active_at: { resource: saoul, exactly: 1 }
        critical: [40, 44]
        normal: [34, 38]
    effects:
      - effect: damage

  - id: bambouseraie
    dofusdb_id: 12785
    name: { fr: "Bambouseraie", en: "Bamboo Grove" }
    ap_cost: { base: 2 }
    casts_per_turn: 1
    cooldown_turns: 2
    crit: { base_rate: 0, can_crit: false }
    note: |
      Invoque plusieurs Petits <color=#ebc304>{{spell,12824,1::Bambous}}</color> en zone.
      
      Les Bambous meurent au début du prochain tour du lanceur.
    lines: []
    effects: []

  - id: ribote
    dofusdb_id: 12786
    name: { fr: "Ribote", en: "Debauchery" }
    ap_cost: { base: 2 }
    casts_per_turn: 3
    casts_per_target: 2
    crit: { base_rate: unknown }
    note: |
      Applique des effets selon l'état du lanceur et occasionne des dommages Terre :
      • Sobre : rend le lanceur Saoul.
      • Saoul : retire de la Fuite à la cible.
    assumptions:
      - "Effets 950 et 951, états « Saoul » (498) et « Sobre » (3531) : le régime du Pandawa. Cinq sorts offensifs portent deux fourchettes selon lui, et la ressource `saoul` décide laquelle s'applique."
      - "Effet 754, -40 Fuite sur la cible sous regime Saoul : la Fuite decide si un corps a corps se quitte, jamais ce qu'un sort inflige."
      - "Effets 792/1160 : lance aussi « <color=#e6893d>État Saoul :</color> », « <color=#e6893d>État Sobre :</color> », « Saoul », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    lines:
      - element: earth
        critical: unknown
        normal: unknown
    effects:
      - effect: gain
        resource: saoul
        # Pas sous Prohibition, qui « empeche l'entree dans l'etat Saoul ».
        requires: { kind: exactly, resource: prohibition, amount: 0 }
        at_cap: refresh
      - effect: damage

  - id: karcham
    dofusdb_id: 12787
    name: { fr: "Karcham", en: "Karcham" }
    ap_cost: { base: 1 }
    casts_per_turn: 4
    casts_per_target: 1
    crit: { base_rate: 0, can_crit: false }
    note: |
      Porte ou jette la cible.
      
      La portée maximale du sort est augmentée lorsque le lanceur porte une cible.
    assumptions:
      - "Effet 2960, sous-sort « Potion Magique » : deux gardes. Côté lanceur, le sous-sort ne part que sur « C,*E4029 » ou « C,*E4030 », l'état d'Ébriété, c'est-à-dire avec le Tonneau. Côté cible, chacun de ses trois paliers porte sa propre garde, « A,*E4077 », « A,*E4078 » et « A,*E4079 », pour 4-6, 6-8 et 8-10 dans le meilleur élément (sous-sort 25508). Aucun sort du parc ne pose ces cinq états : une rotation de sorts de classe seule ne peut pas déclencher cette frappe, et ses fourchettes sont les plus petites du parc."
      - "Effet 2960 : lance aussi « Grande Rasade », sans aucune ligne de degats, etat, deplacement ou pose au sol. Aucun chiffre de ce calculateur n'en depend."
    # Porter : la condition de la donnee exige Sobre. Le jet par ce sort
    # n'est pas ecrit, il ne frappe pas : ce sont les cinq sorts a degats qui
    # jettent qui rendent la main.
    requires: { kind: exactly, resource: porteur, amount: 0 }
    lines: []
    open_questions:
      - "Effets 950/951 : ce sort applique « {{spell,24243,1::Porteur}} » (3), qui porte preventsSpellCast, un drapeau qui change ce qu'une cible peut infliger ou subir. Ces etats-la portent une mecanique que ce calculateur n'ecrit pas encore : chacun demande une decision de modelisation."
      - "Effet 50 non modelise. Ce que le sort fait en plus de ses degats reste a lire dans son texte et a verifier en jeu."
