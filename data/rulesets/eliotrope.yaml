# Eliotrope.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.
#
# Le portail est la mécanique centrale : la moitié des sorts de la classe
# porte un bonus « si le sort est projeté dans un portail ». Ce solveur ne
# simule pas la grille, et les portails se déclarent : combien de sorts y
# passent (`portails_traverses`) et à quelle distance l'un de l'autre
# (`cases_entre_portails`). Les bonus de portail qui ne touchent pas aux
# dégâts restent en questions ouvertes.

schema_version: 1
game_version: "3.6.12"
class: eliotrope
name: { fr: "Eliotrope", en: "Eliotrope" }

resources:
  - id: extinction_poison
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 14594
    while_present:
      # `turn_start` pour un poison de fin de tour, convention du parc : « fin de
      # tour de la cible » tombe, pour une recherche par tours, au même endroit que
      # le début du nôtre (comme la Sève Paralysante du Sadida, la Sentence du Iop
      # et la Flèche Tyrannique du Crâ).
      - trigger: turn_start
        lines:
          - element: fire
            critical: [38, 42]
            normal: [32, 35]
        note: |
          Le poison Feu de fin de tour, « si le sort est projeté dans un portail »
          (durée 1).
    note: |
      Le poison que ce sort ajoute quand il passe par un portail. Il ne tombe que
      si le joueur déclare jouer ses portails : la condition lit
      `portails_traverses`, le compteur que le joueur renseigne ; à zéro, ce
      poison n'existe pas. Le compteur dit combien de sorts passent par un portail
      dans le tour, pas lesquels : un seul passage déclaré fait tomber les poisons
      des deux sorts, ce qui les surestime si le joueur n'en projette qu'un.
  - id: affliction_poison
    scope: target
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 14584
    while_present:
      - trigger: turn_start
        lines:
          - element: water
            critical: [28, 32]
            normal: [23, 26]
        note: |
          Le poison Eau de début de tour, « si le sort est projeté dans un portail »
          (durée 1).
    note: |
      Le poison que ce sort ajoute quand il passe par un portail. Il ne tombe que
      si le joueur déclare jouer ses portails : la condition lit
      `portails_traverses`, le compteur que le joueur renseigne ; à zéro, ce
      poison n'existe pas. Le compteur dit combien de sorts passent par un portail
      dans le tour, pas lesquels : un seul passage déclaré fait tomber les poisons
      des deux sorts, ce qui les surestime si le joueur n'en projette qu'un.
  - id: orgueil_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    duration: { turns: 0, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 14614
    modifies_damage:
      # Effet 138 a `delay: 1` : la Puissance arrive AU TOUR SUIVANT.
      - kind: characteristic
        amount: 150
    note: |
      La Puissance que l'Orgueil accorde au tour suivant : « Applique l'état
      Orgueil sur l'allié ciblé [...] Augmente la Puissance de la cible au tour
      suivant. » Effet 138 à 150 sur la cible « a », `delay: 1` ; le lanceur peut
      se cibler lui-même, sa portée minimale étant de zéro. Le renvoi de dommages
      n'est pas compté : il demande de savoir qui attaque la cible.
  - id: cases_entre_portails
    scope: caster
    max: 10
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Cases entre tes deux portails"
    modifies_damage:
      # Effet 1181, « Pose un portail (+#3 % dommages, +#1 % dommages par case
      # d'eloignement entre 2 portails) », parametres 0 et 2 : rien a la pose,
      # et DEUX POUR CENT PAR CASE. Le moteur additionne les crans d'un meme
      # etat, donc dix cases valent +20 % et non 1,02 dix fois.
      - kind: final_multiplier
        percent: 102
        # Effet 1171, « % Dommages finaux » : ils s'additionnent à ceux des
        # Dofus et de l'équipement.
        finaux: true
    note: |
      La distance, en cases, entre vos deux portails ouverts : +2 % de dommages
      finaux par case, dix cases au plus (au-delà, saisir dix). Ce bonus ne vaut
      que pour un sort projeté, et le calcul l'applique à tous les lancers :
      laissez zéro si vous ne projetez pas tout.

  - id: portails_traverses
    scope: caster
    max: 10
    default: 0
    monotone: increasing
    declared_by_player: true
    player_label: "Sorts projetés dans un portail"
    modifies_damage:
      # Effet 1171, `dice_num` a 2 : « 2 % Dommages finaux », un multiplicateur,
      # donc applique tout a la fin du pipeline. Le moteur l'applique PAR CHARGE,
      # si bien que dix crans valent 1,02^10, soit environ 22 %.
      - kind: final_multiplier
        percent: 102
        # Effet 1171, « % Dommages finaux » : ils s'additionnent à ceux des
        # Dofus et de l'équipement.
        finaux: true
    note: |
      Combien de sorts vous projetez dans un portail par tour : +2 % de dommages
      finaux par sort projeté, cumulable dix fois (effet 1171, trois tours). Le
      compteur vaut dès le début du combat, là où le jeu le monte sort après
      sort : le chiffre est juste quand le cumul est tenu, trop haut en début de
      combat. Laissez zéro si vous ne jouez pas vos portails.
  - id: cabale_puissance
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    # Effet 138, duree 2 dans l'instantane, copiee telle quelle.
    duration: { turns: 1, refresh: on_apply, on_expire: reset_to_default }
    dofusdb_source: 14617
    modifies_damage:
      # Effet 138, `dice_num` a 100 au grade 3 pour la cible « a,r ». Cent
      # points de PUISSANCE, qui entrent dans le meme facteur que la
      # caracteristique : `100 + carac + puissance`.
      - kind: characteristic
        amount: 100
    note: |
      La Puissance que la Cabale accorde au lanceur pour deux tours. La cible de
      l'effet est « a », les alliés, et le lanceur se compte parmi eux. La donnée
      porte deux effets 138 : cent points pour « a,r » et deux cents pour « a,R »,
      sort projeté dans un portail ; c'est la valeur sans portail qui est écrite,
      un plancher pour un Eliotrope qui joue ses portails.

states_outside_model:
