# Roublard.
#
# Ce que la donnée du jeu ne dit pas est écrit en `open_questions` plutôt que
# deviné : un sort dont la mécanique manque rend ses dégâts justes et son
# mécanisme déclaré absent.

schema_version: 1
game_version: "3.6.12"
class: roublard
name: { fr: "Roublard", en: "Roublard" }

resources:
  - id: detonations
    scope: caster
    max: 5
    default: 0
    monotone: increasing
    note: |
      Les explosions de Sismobombe et de Bombe Collante que l'Oblitération a
      accumulées : « Les dommages sont augmentés après chaque explosion de
      Sismobombe ou de Bombe Collante », et « les effets sont retirés après
      utilisation du sort » : la réserve se vide au lancer. Cumul 5, six paliers :
      33-37 sans détonation, puis 43-47, 53-57, 63-67, 73-77 et 83-87, dix de plus
      à chaque cran, la valeur de l'effet 293 au dernier grade. Faire exploser une
      bombe demande de l'avoir posée au bon endroit, ce que ce solveur ne simule
      pas : le budget `detonations_par_tour` dit combien le placement en permet.

  - id: bombes_en_portee
    scope: caster
    max: 3
    default: 0
    monotone: increasing
    note: |
      Les Bombes du lanceur bien placées autour de la cible. Deux suffisent à
      tendre le mur que Plombage, lancé sur une Bombe, redéclenche : c'est la
      condition de son mode « sur une bombe ». La Cadence et le Shrapnel ne le
      lisent pas : leur relance depuis les Bombes, deux au plus, ne porte que le
      retrait de PM ou de PA, aucun dégât.

      Plafond à trois. Le placement étant hors de portée de ce solveur, le budget
      `bombes_par_tour` dit ce que le terrain permet. La réserve ne s'efface pas
      entre les tours : une bombe posée reste jusqu'à ce qu'elle explose, et le
      budget borne les poses par tour, pas le total. Ce modèle ne porte pas la
      durée de vie réelle d'une bombe, ni le coût en PA de la Sismobombe, qui
      augmente d'un par Sismobombe déjà posée.

  - id: cible_bougee_dans_le_mur
    scope: caster
    max: 1
    default: 0
    declared_by_player: true
    player_label: "Vos déplacements gardent la cible dans le mur de bombes"
    note: |
      Cochez si vos poussées, attirances et échanges de place laissent la cible
      dans votre mur de bombes : le mur la frappe à chaque fois, à la base de
      votre tour. Espingole, Pulsar, Rémission, Ruse, Recel, Imposture et
      Bombarde déplacent la cible.

  - id: bombe_collante_posee
    scope: caster
    max: 1
    default: 0
    monotone: increasing
    while_present:
      - trigger: spell_tagged
        tag: detonation
        spends: 1
        lines:
          - best_element: true
            # Pas de fourchette critique distincte : le sort ne peut
            # pas critiquer et la donnée ne porte aucun effet critique.
            # Le critique vaut le normal : le laisser inconnu ferait
            # échouer tout calcul en espérance.
            critical: [17, 19]
            normal: [17, 19]
        note: |
          L'explosion : « lorsqu'elle est activée, elle occasionne des dommages dans
          le meilleur élément du lanceur » : effet 2822, 17-19, sans critique, comme
          le sort qui la pose. Ce qui l'active est un sort d'activation, Détonateur ou
          Étoupille (tag `detonation`), ou l'explosion d'une autre Bombe, qui demande
          de savoir où les bombes sont posées les unes par rapport aux autres. Cumul 1 :
          une seule Bombe Collante à la fois.

budgets:
  - id: detonations_par_tour
    name: { fr: "Détonations de bombe par tour", en: "Bomb detonations per turn" }
    default: 2
    max: 5
    note: |
      Combien d'explosions de Sismobombe ou de Bombe Collante votre placement
      permet dans un tour. Deux par défaut : poser une bombe coûte 2 PA et la
      déclencher demande un sort d'activation. Plus haut, les bombes étaient déjà
      en place au tour précédent.

  - id: bombes_par_tour
    name: { fr: "Bombes bien placées par tour", en: "Well-placed bombs per turn" }
    default: 1
    max: 3
    note: |
      Combien de Bombes votre placement met autour de la cible : deux tendent le
      mur que Plombage redéclenche. Une par défaut, et le mur tient dès le
      deuxième tour ; zéro décrit un tour où l'on frappe sans préparation, trois
      un tour où le terrain était prêt.

states_outside_model:
  # Etats que lisent des conditions de lancement et qu'aucun compteur ne
  # represente : le moteur les tient pour ABSENTS.
  - state: 7
    name: "Pesanteur"
    note: "L'Entourloupe la pose sur la Bombe echangee, pas sur le lanceur."

