[package]
name = "krozties"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Krozties : l'atelier de bureau, qui partage son moteur avec le CLI."

[[bin]]
name = "krozties"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dofus-app = { path = "../app" }
dofus-build = { path = "../build" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "~2.7"
tauri-plugin-updater = "~2.12"
tauri-plugin-window-state = "~2.4"
# 2.4 exige tauri 2.12 ; la 2.3 se contente de la 2.10.
tauri-plugin-global-shortcut = "~2.3"
serde = { workspace = true }
serde_json = { workspace = true }
